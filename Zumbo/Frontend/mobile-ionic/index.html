            <div class="mobile-knowledge-render"><div ng-repeat="block in vm.blocks track by $index" ng-switch="block.type"><h2 ng-switch-when="heading" ng-class="'level-'+block.level"><mobile-knowledge-segments segments="block.segments"></mobile-knowledge-segments></h2><p ng-switch-when="paragraph"><mobile-knowledge-segments segments="block.segments"></mobile-knowledge-segments></p><blockquote ng-switch-when="quote"><mobile-knowledge-segments segments="block.segments"></mobile-knowledge-segments></blockquote><pre ng-switch-when="code"><code>{{block.text}}</code></pre><ol ng-switch-when="list" ng-if="block.ordered"><li ng-repeat="segments in block.items track by $index"><mobile-knowledge-segments segments="segments"></mobile-knowledge-segments></li></ol><ul ng-switch-when="list" ng-if="!block.ordered"><li ng-repeat="segments in block.items track by $index"><mobile-knowledge-segments segments="segments"></mobile-knowledge-segments></li></ul></div><p class="mobile-state" ng-if="!vm.blocks.length">Bu sürümde içerik yok.</p></div>
          </article>

          <div class="mobile-knowledge-history" ng-if="vm.mode==='history'"><h3>Sürüm geçmişi</h3><button class="mobile-knowledge-version" type="button" ng-repeat="version in vm.document.versions track by version.number" ng-click="vm.preview(version)"><span><strong>v{{version.number}} · {{version.title}}</strong><small>{{version.changeSummary}}</small></span><i class="icon ion-ios-clock-outline" aria-hidden="true"></i></button></div>

          <div class="mobile-knowledge-comments" ng-if="vm.mode==='comments'"><h3>Yorumlar</h3><form class="mobile-knowledge-form" ng-if="vm.document.canComment" ng-submit="vm.addComment()"><label><span>Yeni yorum</span><textarea ng-model="vm.comment" maxlength="2000" rows="3" required></textarea></label><button class="button button-positive button-block" type="submit" ng-disabled="vm.saving || shell.pwa.offline">Yorum ekle</button></form><article class="mobile-knowledge-comment" ng-repeat="comment in vm.document.comments track by comment.id" ng-class="{resolved:comment.resolved}"><header><span><strong>{{vm.userName(comment.authorUserId)}}</strong><small>{{comment.createdAt | date:'dd MMM HH:mm'}}</small></span><button class="button button-small button-icon icon ion-checkmark" type="button" ng-if="!comment.resolved" ng-click="vm.resolveComment(comment)" aria-label="Yorumu çöz"></button></header><p>{{comment.body}}</p><small ng-if="comment.resolved">Çözüldü</small></article><p class="mobile-state" ng-if="!vm.document.comments.length">Henüz yorum yok.</p></div>

          <div class="mobile-knowledge-links" ng-if="vm.mode==='links'"><h3>Bağlı işler</h3><span class="mobile-knowledge-link" ng-repeat="id in vm.document.workItemIds track by id"><i class="icon ion-android-checkbox-outline" aria-hidden="true"></i> {{vm.workItemName(id)}}</span><p class="mobile-state" ng-if="!vm.document.workItemIds.length">Bağlı iş yok.</p><h3>İlgili kullanıcılar</h3><span class="mobile-knowledge-link" ng-repeat="id in vm.document.userIds track by id"><i class="icon ion-person" aria-hidden="true"></i> {{vm.userName(id)}}</span><p class="mobile-state" ng-if="!vm.document.userIds.length">Bağlı kullanıcı yok.</p></div>
        </section>
      </ion-content>
    </ion-view>
  </script>

  <script id="templates/capacity.html" type="text/ng-template">
    <ion-view view-title="Kapasite">
      <ion-content class="workspace mobile-capacity">
        <ion-refresher pulling-text="Yenile" on-refresh="vm.load()"></ion-refresher>
        <header class="mobile-capacity-head"><div><small>Ekip ve proje planlama</small><h2>{{vm.plan ? vm.plan.name : 'Kapasite'}}</h2></div><button type="button" ng-if="vm.canCreatePlan()" ng-click="vm.newPlan()" aria-label="Kapasite planı oluştur" title="Kapasite planı oluştur"><i class="icon ion-plus-round" aria-hidden="true"></i></button></header>
        <div class="mobile-feedback success" role="status" aria-live="polite" ng-if="vm.notice">{{vm.notice}}</div>
        <div class="mobile-feedback error" role="alert" aria-live="assertive" ng-if="vm.error">{{vm.error}}</div>
        <div class="mobile-state" ng-if="vm.loading && !vm.plan">Kapasite planları yükleniyor...</div>
        <nav class="mobile-capacity-register" ng-if="vm.plans.length" aria-label="Kapasite planı listesi"><button type="button" ng-repeat="item in vm.plans track by item.id" ng-class="{active:vm.plan.id===item.id}" ng-click="vm.select(item)"><strong>{{item.name}}</strong><small>{{item.periodStart | date:'dd MMM'}} - {{item.periodEnd | date:'dd MMM'}} · {{item.members.length}} kişi</small></button></nav>

        <div class="mobile-state" ng-if="!vm.loading && !vm.plan && !vm.canCreatePlan()">Yönetebildiğiniz bir proje olmadığından yeni kapasite planı oluşturamazsınız.</div>
        <form class="mobile-capacity-form" ng-if="vm.draft && (!vm.plan || vm.mode==='definition')" ng-submit="vm.save()">
          <label><span>Plan adı</span><input type="text" ng-model="vm.draft.name" maxlength="120" required ng-disabled="vm.plan && !vm.plan.canEdit"></label>
          <label><span>Açıklama</span><textarea ng-model="vm.draft.description" maxlength="500" rows="3" ng-disabled="vm.plan && !vm.plan.canEdit"></textarea></label>
          <div class="mobile-capacity-fields"><label><span>Başlangıç</span><input type="date" ng-model="vm.draft.periodStart" required ng-disabled="vm.plan && !vm.plan.canEdit"></label><label><span>Bitiş</span><input type="date" ng-model="vm.draft.periodEnd" required ng-disabled="vm.plan && !vm.plan.canEdit"></label></div>
          <label><span>Bağlı portföy</span><select ng-model="vm.draft.portfolioId" ng-options="item.id as item.name for item in vm.portfolios" ng-disabled="vm.plan && !vm.plan.canEdit"><option value="">Portföy yok</option></select></label>
          <label><span>Projeler · {{vm.draft.projectIds.length}}/20</span><select multiple ng-model="vm.draft.projectIds" ng-options="project.id as (project.key + ' · ' + project.name) for project in vm.projectOptions()" required ng-disabled="vm.plan && !vm.plan.canEdit"></select></label>
          <label><span>Görüntüleyiciler · {{vm.draft.viewerUserIds.length}}/50</span><select multiple ng-model="vm.draft.viewerUserIds" ng-options="user.id as vm.userName(user.id) for user in vm.viewerUsers()" ng-disabled="vm.plan && !vm.plan.canEdit"></select></label>

          <section class="mobile-capacity-editor" aria-labelledby="mobile-capacity-members-heading">
            <header><div><h3 id="mobile-capacity-members-heading">Kişi kapasitesi</h3><p>Haftalık saat; performans sıralaması değildir.</p></div><button class="button button-small button-stable icon-left ion-person-add" type="button" ng-if="!vm.plan || vm.plan.canEdit" ng-click="vm.addMember()" ng-disabled="vm.draft.members.length>=100">Ekle</button></header>
            <div class="mobile-capacity-member" ng-repeat="member in vm.draft.members track by $index">
              <label><span>Kişi</span><select ng-model="member.userId" ng-options="user.id as vm.userName(user.id) for user in vm.users" required ng-disabled="vm.plan && !vm.plan.canEdit"><option value="">Kişi seçin</option></select></label>
              <label><span>Ekip</span><select ng-model="member.teamId" ng-options="team.id as team.name for team in vm.teamOptions(member)" ng-disabled="vm.plan && !vm.plan.canEdit"><option value="">Ekip atanmamış</option></select></label>
              <label><span>Saat / hafta</span><input type="number" min="0" max="168" step=".25" ng-model="member.weeklyCapacityHours" required ng-disabled="vm.plan && !vm.plan.canEdit"></label>
              <button class="button button-small button-assertive button-outline icon-left ion-trash-a" type="button" ng-if="!vm.plan || vm.plan.canEdit" ng-click="vm.removeMember($index)" ng-disabled="vm.draft.members.length<=1">Kaldır</button>
            </div>
          </section>

          <section class="mobile-capacity-editor" aria-labelledby="mobile-capacity-allocations-heading">
            <header><div><h3 id="mobile-capacity-allocations-heading">Proje tahsisleri</h3><p>Toplam oran %100'ü aşabilir; uyarı görünür kalır.</p></div><button class="button button-small button-stable icon-left ion-plus" type="button" ng-if="!vm.plan || vm.plan.canEdit" ng-click="vm.addAllocation()" ng-disabled="vm.draft.allocations.length>=500">Ekle</button></header>
            <div class="mobile-capacity-allocation" ng-repeat="allocation in vm.draft.allocations track by $index">
              <label><span>Kişi</span><select ng-model="allocation.userId" ng-options="member.userId as vm.userName(member.userId) for member in vm.draft.members" required ng-disabled="vm.plan && !vm.plan.canEdit"></select></label>
              <label><span>Proje</span><select ng-model="allocation.projectId" ng-options="id as vm.projectName(id) for id in vm.draft.projectIds" required ng-disabled="vm.plan && !vm.plan.canEdit"></select></label>
              <div class="mobile-capacity-fields"><label><span>Başlangıç</span><input type="date" ng-model="allocation.startDate" required ng-disabled="vm.plan && !vm.plan.canEdit"></label><label><span>Bitiş</span><input type="date" ng-model="allocation.endDate" required ng-disabled="vm.plan && !vm.plan.canEdit"></label></div>
              <label><span>Oran %</span><input type="number" min="1" max="100" step=".25" ng-model="allocation.percent" required ng-disabled="vm.plan && !vm.plan.canEdit"></label>
              <button class="button button-small button-assertive button-outline icon-left ion-trash-a" type="button" ng-if="!vm.plan || vm.plan.canEdit" ng-click="vm.removeAllocation($index)">Tahsis kaldır</button>
            </div>
            <p class="mobile-state" ng-if="!vm.draft.allocations.length">Henüz proje tahsisi yok.</p>
          </section>

          <button class="button button-positive button-block" type="submit" ng-if="!vm.plan || vm.plan.canEdit" ng-disabled="vm.saving || shell.pwa.offline">{{vm.plan ? 'Planı kaydet' : 'Planı oluştur'}}</button>
          <button class="button button-stable button-block icon-left ion-person-stalker" type="button" ng-if="vm.plan && vm.plan.canEdit" ng-click="vm.share()" ng-disabled="vm.saving || shell.pwa.offline">Paylaşımı güncelle</button>
          <button class="button button-assertive button-outline button-block" type="button" ng-if="vm.plan && vm.plan.canEdit" ng-click="vm.archive()" ng-disabled="vm.saving || shell.pwa.offline">Planı arşivle</button>
        </form>

        <section ng-if="vm.plan && vm.mode!=='definition'">
          <div class="mobile-capacity-readonly" ng-if="!vm.plan.canEdit" role="status"><i class="icon ion-eye" aria-hidden="true"></i><span>Bu plan size salt okunur paylaşıldı.</span></div>
          <div class="mobile-capacity-method"><i class="icon ion-ios-calculator" aria-hidden="true"></i><span>Kapasite saat, iş tahmini puan cinsindedir; birbirine dönüştürülmez.</span></div>
          <div class="mobile-capacity-partial" ng-if="vm.snapshot.sourceStatus==='Partial'" role="status"><i class="icon ion-alert-circled" aria-hidden="true"></i><span>{{vm.snapshot.unavailableProjectIds.length}} proje erişilemedi veya kaynak sınırı aşıldı.</span></div>
          <div class="mobile-capacity-metrics"><div><strong>{{vm.snapshot.summary.people}}</strong><span>Kişi</span></div><div><strong>{{vm.snapshot.summary.capacityHours | number:1}}</strong><span>Kapasite sa</span></div><div><strong>{{vm.snapshot.summary.allocatedHours | number:1}}</strong><span>Tahsis sa</span></div><div><strong>{{vm.snapshot.summary.openItems}}</strong><span>Açık iş</span></div><div><strong>{{vm.snapshot.summary.estimatedPoints | number:1}}</strong><span>Tahmin puanı</span></div><div><strong>{{vm.snapshot.summary.unestimatedItems}}</strong><span>Tahminsiz</span></div></div>
          <nav class="mobile-capacity-tabs" role="tablist" aria-label="Kapasite görünümü"><button role="tab" aria-selected="{{vm.mode==='people'}}" ng-class="{active:vm.mode==='people'}" ng-click="vm.setMode('people')">Kişiler</button><button role="tab" aria-selected="{{vm.mode==='projects'}}" ng-class="{active:vm.mode==='projects'}" ng-click="vm.setMode('projects')">Projeler</button><button role="tab" aria-selected="{{vm.mode==='scenario'}}" ng-class="{active:vm.mode==='scenario'}" ng-click="vm.setMode('scenario')" ng-if="vm.plan.canEdit">Senaryo</button><button role="tab" aria-selected="{{vm.mode==='definition'}}" ng-class="{active:vm.mode==='definition'}" ng-click="vm.setMode('definition')">Tanım</button></nav>

          <div class="mobile-capacity-list" ng-if="vm.mode==='people'">
            <article class="mobile-capacity-person" ng-repeat="member in vm.snapshot.members track by member.userId"><header><span><strong>{{vm.userName(member.userId)}}</strong><small>{{vm.teamName(member.teamId)}} · {{member.weeklyCapacityHours | number:1}} sa/hafta</small></span><b class="mobile-capacity-state" data-tone="{{vm.stateTone(member.state)}}">{{vm.stateLabel(member.state)}}</b></header><div class="mobile-capacity-load" data-tone="{{vm.stateTone(member.state)}}"><i ng-style="{width:vm.barWidth(member.allocationPercent)+'%'}"></i></div><div class="mobile-capacity-week" ng-repeat="week in member.weeks track by week.weekStart"><span>{{week.weekStart | date:'dd MMM'}}</span><strong>{{week.allocatedHours | number:1}} / {{week.capacityHours | number:1}} sa · %{{week.allocationPercent}}</strong></div><footer><span>{{member.openItems}} açık · {{member.unscheduledItems}} tarihsiz</span><span>{{member.remainingHours | number:1}} sa kalan</span></footer></article>
            <p class="mobile-state" ng-if="!vm.snapshot.members.length">Bu planda kişi yok.</p>
          </div>

          <div class="mobile-capacity-projects" ng-if="vm.mode==='projects'">
            <article class="mobile-capacity-project" ng-repeat="project in vm.snapshot.projects track by project.projectId"><span><strong>{{project.name}}</strong><small>{{project.allocatedPeople}} kişi · {{project.openItems}} açık · {{project.unestimatedItems}} tahminsiz</small></span><strong>{{project.allocatedHours | number:1}} sa</strong></article>
            <p class="mobile-state" ng-if="!vm.snapshot.projects.length">Görünür proje kaynağı yok.</p>
          </div>

          <div class="mobile-capacity-scenario" ng-if="vm.mode==='scenario' && vm.plan.canEdit">
            <header><h3>Salt okunur senaryo</h3><p>Tahsisleri karşılaştırın; kayıtlı plan değişmez.</p></header>
            <div class="mobile-capacity-allocation" ng-repeat="allocation in vm.scenarioAllocations track by $index"><label><span>Kişi</span><select ng-model="allocation.userId" ng-options="member.userId as vm.userName(member.userId) for member in vm.plan.members"></select></label><label><span>Proje</span><select ng-model="allocation.projectId" ng-options="id as vm.projectName(id) for id in vm.plan.projectIds"></select></label><div class="mobile-capacity-fields"><label><span>Başlangıç</span><input type="date" ng-model="allocation.startDate"></label><label><span>Bitiş</span><input type="date" ng-model="allocation.endDate"></label></div><label><span>Oran %</span><input type="number" min="1" max="100" step=".25" ng-model="allocation.percent"></label><button class="button button-small button-assertive button-outline" type="button" ng-click="vm.removeScenarioAllocation($index)">Kaldır</button></div>
            <div class="mobile-capacity-scenario-actions"><button class="button button-stable icon-left ion-plus" type="button" ng-click="vm.addScenarioAllocation()">Tahsis ekle</button><button class="button button-positive icon-left ion-ios-calculator" type="button" ng-click="vm.previewScenario()" ng-disabled="vm.saving || shell.pwa.offline">Hesapla</button></div>
            <button class="button button-stable button-block" type="button" ng-click="vm.resetScenario()">Başlangıca dön</button>
            <div class="mobile-capacity-scenario-result" ng-if="vm.scenario"><div><span>Temel</span><strong>{{vm.scenario.baseline.summary.allocatedHours | number:1}} sa</strong><small>{{vm.scenario.baseline.summary.overCapacityPeople}} kişi üstte</small></div><div><span>Senaryo</span><strong>{{vm.scenario.candidate.summary.allocatedHours | number:1}} sa</strong><small>{{vm.scenario.candidate.summary.overCapacityPeople}} kişi üstte</small></div><div><span>Değişim</span><strong>{{vm.scenarioDelta(vm.scenario,'allocatedHours')>0 ? '+' : ''}}{{vm.scenarioDelta(vm.scenario,'allocatedHours') | number:1}} sa</strong><small>Kaydedilmedi</small></div></div>
          </div>
        </section>
      </ion-content>
    </ion-view>
  </script>

  <script id="templates/portfolios.html" type="text/ng-template">
    <ion-view view-title="Portföyler">
      <ion-content class="workspace mobile-portfolio">
        <ion-refresher pulling-text="Yenile" on-refresh="vm.load()"></ion-refresher>
        <header class="mobile-portfolio-head"><div><small>Çapraz proje planlama</small><h2>{{vm.portfolio ? vm.portfolio.name : 'Portföyler'}}</h2></div><button type="button" ng-click="vm.newPortfolio()" aria-label="Portföy oluştur" title="Portföy oluştur"><i class="icon ion-plus-round" aria-hidden="true"></i></button></header>
        <div class="mobile-feedback success" role="status" aria-live="polite" ng-if="vm.notice">{{vm.notice}}</div>
        <div class="mobile-feedback error" role="alert" aria-live="assertive" ng-if="vm.error">{{vm.error}}</div>
        <div class="mobile-state" ng-if="vm.loading && !vm.portfolio">Portföyler yükleniyor...</div>
        <nav class="mobile-portfolio-register" ng-if="vm.portfolios.length" aria-label="Portföy listesi"><button type="button" ng-repeat="item in vm.portfolios track by item.id" ng-class="{active:vm.portfolio.id===item.id}" ng-click="vm.select(item)"><strong>{{item.name}}</strong><small>{{item.initiatives.length}} initiative</small></button></nav>

        <form class="mobile-portfolio-form" ng-if="!vm.portfolio || vm.mode==='definition'" ng-submit="vm.savePortfolio()">
          <label><span>Portföy adı</span><input type="text" ng-model="vm.portfolioDraft.name" maxlength="120" required ng-disabled="vm.portfolio && !vm.portfolio.canEdit"></label>
          <label><span>Açıklama</span><textarea ng-model="vm.portfolioDraft.description" maxlength="1000" rows="3" ng-disabled="vm.portfolio && !vm.portfolio.canEdit"></textarea></label>
          <label><span>Görüntüleyiciler</span><select class="mobile-portfolio-multiple" multiple ng-model="vm.portfolioDraft.viewerUserIds" ng-options="user.id as vm.userName(user.id) for user in vm.users" ng-disabled="vm.portfolio && !vm.portfolio.canEdit"></select></label>
          <button class="button button-positive button-block" type="submit" ng-if="!vm.portfolio || vm.portfolio.canEdit" ng-disabled="vm.saving || shell.pwa.offline">{{vm.portfolio ? 'Portföyü kaydet' : 'Portföyü oluştur'}}</button>
          <button class="button button-assertive button-outline button-block" type="button" ng-if="vm.portfolio && vm.portfolio.canEdit" ng-click="vm.archivePortfolio()" ng-disabled="vm.saving || shell.pwa.offline">Portföyü arşivle</button>
        </form>

        <section ng-if="vm.portfolio && vm.mode!=='definition'">
          <div class="mobile-portfolio-readonly" ng-if="!vm.portfolio.canEdit" role="status"><i class="icon ion-eye" aria-hidden="true"></i><span>{{vm.canUpdateAnyStatus() ? 'Portföy salt okunur; sahibi olduğunuz initiative durumlarını güncelleyebilirsiniz.' : 'Salt okunur paylaşım'}}</span></div>
          <div class="mobile-portfolio-metrics"><div><strong>{{vm.portfolio.initiatives.length}}</strong><span>Initiative</span></div><div><strong>{{vm.linkedProjects().length}}</strong><span>Proje</span></div><div><strong>{{vm.portfolio.dependencies.length}}</strong><span>Bağımlılık</span></div></div>
          <div class="mobile-portfolio-partial" ng-if="vm.roadmap.sourceStatus==='Partial'" role="status">{{vm.roadmap.unavailableProjectIds.length}} proje erişilemedi. İlerleme görünür projelerle sınırlı.</div>
          <nav class="mobile-portfolio-tabs" role="tablist" aria-label="Portföy alanları"><button role="tab" aria-selected="{{vm.mode==='roadmap'}}" ng-class="{active:vm.mode==='roadmap'}" ng-click="vm.setMode('roadmap')">Yol</button><button role="tab" aria-selected="{{vm.mode==='hierarchy'}}" ng-class="{active:vm.mode==='hierarchy'}" ng-click="vm.setMode('hierarchy')">Hiyerarşi</button><button role="tab" aria-selected="{{vm.mode==='updates'}}" ng-class="{active:vm.mode==='updates'}" ng-click="vm.setMode('updates')">Durum</button><button role="tab" aria-selected="{{vm.mode==='dependencies'}}" ng-class="{active:vm.mode==='dependencies'}" ng-click="vm.setMode('dependencies')">Bağlar</button></nav>

          <div class="mobile-portfolio-roadmap" ng-if="vm.mode==='roadmap'"><article ng-repeat="row in vm.tree() track by row.item.id" ng-style="{'margin-left': (row.depth * 14) + 'px'}"><header><span><strong>{{row.item.name}}</strong><small>{{vm.statusLabel(row.item.status)}} · {{vm.userName(row.item.ownerUserId)}}</small></span><b data-health="{{row.item.health}}">{{vm.healthLabel(row.item.health)}}</b></header><div class="mobile-progress-track" aria-label="{{vm.roadmapItem(row.item.id).progress || 0}} yüzde tamamlandı"><i ng-style="{width:(vm.roadmapItem(row.item.id).progress || 0)+'%'}"></i></div><footer><span>{{vm.roadmapItem(row.item.id).progress || 0}}% ilerleme</span><span>{{vm.roadmapItem(row.item.id).overdueWorkItems || 0}} geciken</span></footer><div class="mobile-roadmap-project" ng-repeat="project in vm.roadmapItem(row.item.id).projects track by project.id"><span><strong>{{project.key}} · {{project.name}}</strong><small>{{project.completedWorkItems}} / {{project.totalWorkItems}} iş</small></span><b>{{project.progress}}%</b></div></article></div>

          <div ng-if="vm.mode==='hierarchy'"><button class="button button-small button-stable button-block" ng-if="vm.portfolio.canEdit" ng-click="vm.newInitiative(); vm.setMode('initiative-form')">Initiative ekle</button><div class="mobile-initiative-list"><article ng-repeat="row in vm.tree() track by row.item.id" ng-style="{'margin-left':(row.depth*14)+'px'}"><span><strong>{{row.item.name}}</strong><small>{{vm.healthLabel(row.item.health)}} · {{row.item.projectIds.length}} proje</small></span><div><button class="button button-icon icon ion-edit" ng-if="vm.portfolio.canEdit" ng-click="vm.editInitiative(row.item)" aria-label="Initiative düzenle"></button><button class="button button-icon icon ion-chatbox-working" ng-if="row.item.canUpdateStatus" ng-click="vm.prepareStatus(row.item)" aria-label="Durum güncelle"></button></div></article></div></div>

          <form class="mobile-portfolio-form" ng-if="vm.mode==='initiative-form' && vm.portfolio.canEdit" ng-submit="vm.saveInitiative()"><label><span>Ad</span><input ng-model="vm.initiativeDraft.name" maxlength="120" required></label><label><span>Sahip</span><select ng-model="vm.initiativeDraft.ownerUserId" ng-options="user.id as vm.userName(user.id) for user in vm.users" required></select></label><label><span>Üst initiative</span><select ng-model="vm.initiativeDraft.parentInitiativeId" ng-options="item.id as item.name for item in vm.portfolio.initiatives | filter:{id:'!'+vm.initiativeDraft.id}"><option value="">Üst seviye</option></select></label><div class="mobile-field-pair"><label><span>Durum</span><select ng-model="vm.initiativeDraft.status"><option>Planned</option><option>Active</option><option>Paused</option><option>Completed</option><option>Cancelled</option></select></label><label><span>Sağlık</span><select ng-model="vm.initiativeDraft.health"><option>NoUpdate</option><option>OnTrack</option><option>AtRisk</option><option>OffTrack</option></select></label></div><div class="mobile-field-pair"><label><span>Güven</span><input type="number" min="0" max="100" ng-model="vm.initiativeDraft.confidence"></label><label><span>Hedef</span><input type="date" ng-model="vm.initiativeDraft.targetAt"></label></div><label><span>Projeler</span><select class="mobile-portfolio-multiple" multiple ng-model="vm.initiativeDraft.projectIds" ng-options="project.id as (project.key + ' · ' + project.name) for project in vm.projects" required></select></label><label><span>Özet</span><textarea ng-model="vm.initiativeDraft.summary" maxlength="1000" rows="3"></textarea></label><button class="button button-positive button-block" type="submit" ng-disabled="vm.saving || shell.pwa.offline">Initiative'i kaydet</button></form>

          <div class="mobile-status-stream" ng-if="vm.mode==='updates'"><small ng-if="vm.portfolio.initiatives.length">Her initiative için en yeni {{vm.portfolio.initiatives[0].statusUpdateRetentionLimit}} durum kaydı korunur.</small><article ng-repeat="initiative in vm.portfolio.initiatives track by initiative.id" ng-if="initiative.statusUpdates.length"><header><strong>{{initiative.name}}</strong><b data-health="{{initiative.health}}">{{vm.healthLabel(initiative.health)}}</b></header><div ng-repeat="update in initiative.statusUpdates track by update.id"><p>{{update.note}}</p><small>{{vm.userName(update.authorUserId)}} · {{update.createdAt | date:'dd MMM HH:mm'}} · {{update.confidence == null ? 'Güven yok' : update.confidence + '%'}}</small></div></article><p class="mobile-state" ng-if="!vm.portfolio.initiatives.length">Initiative yok.</p></div>
          <form class="mobile-portfolio-form" ng-if="vm.mode==='status-form' && vm.initiativeDraft.canUpdateStatus" ng-submit="vm.saveStatus()"><h3>{{vm.initiativeDraft.name}}</h3><div class="mobile-field-pair"><label><span>Durum</span><select ng-model="vm.statusDraft.status"><option>Planned</option><option>Active</option><option>Paused</option><option>Completed</option><option>Cancelled</option></select></label><label><span>Sağlık</span><select ng-model="vm.statusDraft.health"><option>NoUpdate</option><option>OnTrack</option><option>AtRisk</option><option>OffTrack</option></select></label></div><label><span>Güven</span><input type="number" min="0" max="100" ng-model="vm.statusDraft.confidence"></label><label><span>Durum notu</span><textarea ng-model="vm.statusDraft.note" maxlength="1000" rows="4" required></textarea></label><button class="button button-positive button-block" type="submit" ng-disabled="vm.saving || shell.pwa.offline">Güncellemeyi yayınla</button></form>

          <div ng-if="vm.mode==='dependencies'"><button class="button button-small button-stable button-block" ng-if="vm.portfolio.canEdit" ng-click="vm.newDependency(); vm.setMode('dependency-form')">Bağımlılık ekle</button><div class="mobile-dependency-list"><article ng-repeat="item in vm.portfolio.dependencies track by item.id"><span><strong>{{vm.projectName(item.sourceProjectId)}} → {{vm.projectName(item.targetProjectId)}}</strong><small>{{item.description}} · {{item.requiredBy ? (item.requiredBy | date:'dd MMM') : 'Tarih yok'}}</small></span><button class="button button-icon icon ion-edit" ng-if="vm.portfolio.canEdit" ng-click="vm.editDependency(item)" aria-label="Bağımlılığı düzenle"></button></article><p class="mobile-state" ng-if="!vm.portfolio.dependencies.length">Tanımlı bağımlılık yok.</p></div></div>
          <form class="mobile-portfolio-form" ng-if="vm.mode==='dependency-form' && vm.portfolio.canEdit" ng-submit="vm.saveDependency()"><label><span>Kaynak proje</span><select ng-model="vm.dependencyDraft.sourceProjectId" ng-options="project.id as project.name for project in vm.linkedProjects()" required></select></label><label><span>Hedef proje</span><select ng-model="vm.dependencyDraft.targetProjectId" ng-options="project.id as project.name for project in vm.linkedProjects()" required></select></label><div class="mobile-field-pair"><label><span>Durum</span><select ng-model="vm.dependencyDraft.status"><option>Active</option><option>Resolved</option></select></label><label><span>Gerekli tarih</span><input type="date" ng-model="vm.dependencyDraft.requiredBy"></label></div><label><span>Açıklama</span><textarea ng-model="vm.dependencyDraft.description" maxlength="500" rows="3" required></textarea></label><button class="button button-positive button-block" type="submit" ng-disabled="vm.saving || shell.pwa.offline">Bağımlılığı kaydet</button></form>
        </section>
      </ion-content>
    </ion-view>
  </script>

  <script id="templates/search.html" type="text/ng-template">
    <ion-view view-title="Arama">
      <ion-content class="workspace mobile-shell-surface">
        <label class="mobile-search-scope" ng-if="vm.projects.length">
          <span>Proje kapsamında ara</span>
          <select ng-model="vm.selectedProjectId" ng-change="vm.changeProject()" ng-options="project.id as (project.key + ' · ' + project.name) for project in vm.projects" aria-label="Arama projesi"></select>
        </label>
        <form class="mobile-global-search" ng-if="vm.selectedProjectId" ng-submit="vm.search()">
          <label>
            <span class="sr-only">İşlerde ara</span>
            <i class="icon ion-search" aria-hidden="true"></i>
            <input type="search" ng-model="vm.query" minlength="2" maxlength="120" placeholder="Başlık veya içerik ara" autocomplete="off" enterkeyhint="search">
            <button type="button" class="button button-icon ion-close-circled" ng-if="vm.query" ng-click="vm.clear()" aria-label="Aramayı temizle"></button>
          </label>
          <button type="submit" class="button button-positive" ng-disabled="vm.loading">Ara</button>
        </form>
        <div class="mobile-state" ng-if="vm.projectLoading" aria-live="polite">Arama kapsamı yükleniyor...</div>
        <div class="mobile-degraded-state" ng-if="vm.degraded" role="status">Arama geçici olarak sınırlı. Sonuçlar güvenli yedek görünümden gösteriliyor.</div>
        <div class="mobile-state" ng-if="vm.loading && !vm.items.length" aria-live="polite">Sonuçlar aranıyor...</div>
        <div class="mobile-state is-error" ng-if="vm.error" role="alert">
          <span>{{vm.error}}</span>
          <button type="button" class="button button-small button-clear" ng-click="vm.error = ''">Kapat</button>
        </div>
        <section class="mobile-search-results" ng-if="vm.items.length" aria-label="Arama sonuçları">
          <header><strong>{{vm.items.length}} sonuç</strong><span ng-if="vm.hasMore">Devamı var</span></header>
          <button type="button" ng-repeat="task in vm.items track by task.id" ng-click="vm.openTask(task)">
            <span><strong>{{task.title}}</strong><small>{{task.type}} · {{task.status}} · {{task.priority}}</small></span>
            <i class="icon ion-chevron-right" aria-hidden="true"></i>
          </button>
          <button type="button" class="mobile-search-more" ng-if="vm.hasMore" ng-click="vm.loadMore()" ng-disabled="vm.loading">Daha fazla sonuç</button>
        </section>
        <section class="mobile-shell-empty" ng-if="vm.searched && !vm.loading && !vm.items.length && !vm.error">
          <i class="icon ion-search" aria-hidden="true"></i>
          <h3>Sonuç bulunamadı</h3>
          <p>Farklı veya daha genel bir ifadeyle yeniden arayın.</p>
        </section>
        <section class="mobile-shell-empty" ng-if="!vm.projectLoading && !vm.projects.length && !vm.error">
          <i class="icon ion-folder" aria-hidden="true"></i>
          <h3>Aranabilir proje yok</h3>
          <p>Arama yapmadan önce erişebildiğiniz bir proje oluşturun.</p>
          <button type="button" class="button button-stable" ui-sref="app.projects">Projelere git</button>
        </section>
        <section class="mobile-search-prompt" ng-if="vm.selectedProjectId && !vm.searched && !vm.loading && !vm.error">
          <span>Proje araması</span>
          <p>Seçili projedeki görev başlığı ve içeriğinde en az iki karakterle arayın.</p>
        </section>
      </ion-content>
    </ion-view>
  </script>

  <script id="templates/projects.html" type="text/ng-template">
    <ion-view view-title="Projeler">
      <ion-content class="workspace">
        <div class="segmented workspace-segments"><button ng-class="{active: vm.mode === 'projects'}" ng-click="vm.setMode('projects')">Projeler</button><button ng-class="{active: vm.mode === 'teams'}" ng-click="vm.setMode('teams')">Ekipler</button><button ng-class="{active: vm.mode === 'archive'}" ng-click="vm.setMode('archive')">Arşiv</button></div>
        <div class="mobile-feedback success" role="status" aria-live="polite" ng-if="vm.notice">{{vm.notice}}</div>
        <div class="mobile-feedback error" role="alert" aria-live="assertive" ng-if="vm.error">{{vm.error}}</div>
        <section ng-if="vm.mode === 'projects'">
          <form class="mobile-manage-form compact" ng-submit="vm.createProject()"><label><span>Anahtar</span><input type="text" ng-model="vm.projectDraft.key" aria-label="Yeni mobil proje anahtarı" maxlength="12" required></label><label><span>Proje adı</span><input type="text" ng-model="vm.projectDraft.name" aria-label="Yeni mobil proje adı" required></label><button class="button button-small button-positive" type="submit" ng-disabled="vm.saving">Proje oluştur</button></form>
          <ion-list><ion-item ng-repeat="project in vm.projects track by project.id" ng-click="vm.select(project)">
            <h2>{{project.key}} · {{project.name}}</h2>
            <p>{{project.members.length}} üye · {{project.visibility}}</p>
            <i class="icon ion-chevron-right icon-accessory"></i>
          </ion-item><ion-item ng-if="!vm.projects.length">Henüz proje yok.</ion-item></ion-list>
        </section>
        <section ng-if="vm.mode === 'teams'">
          <form class="mobile-manage-form compact" ng-submit="vm.createTeam()"><label><span>Ekip adı</span><input type="text" ng-model="vm.teamDraft.name" aria-label="Yeni mobil ekip adı" required></label><button class="button button-small button-positive" type="submit" ng-disabled="vm.saving">Ekip oluştur</button></form>
          <ion-list><ion-item ng-repeat="team in vm.teams track by team.id" ng-click="vm.selectTeam(team)"><h2>{{team.name}}</h2><p>{{team.members.length}} üye ve davet</p><i class="icon ion-chevron-right icon-accessory"></i></ion-item><ion-item ng-if="!vm.teams.length">Henüz ekip yok.</ion-item></ion-list>
        </section>
        <section ng-if="vm.mode === 'archive'">
          <div class="item item-divider">Projeler</div><div class="mobile-archive-row" ng-repeat="project in vm.archivedProjects track by project.id"><span>{{project.key}} · {{project.name}}</span><button class="button button-small button-stable" ng-click="vm.restoreProject(project)">Geri yükle</button></div><div class="item item-text-wrap" ng-if="!vm.archivedProjects.length">Arşivlenmiş proje yok.</div>
          <div class="item item-divider">Ekipler</div><div class="mobile-archive-row" ng-repeat="team in vm.archivedTeams track by team.id"><span>{{team.name}}</span><button class="button button-small button-stable" ng-click="vm.restoreTeam(team)">Geri yükle</button></div><div class="item item-text-wrap" ng-if="!vm.archivedTeams.length">Arşivlenmiş ekip yok.</div>
        </section>
      </ion-content>
    </ion-view>
  </script>

  <script id="templates/create-task.html" type="text/ng-template">
    <div class="mobile-create-task">
      <p class="mobile-feedback error" role="alert" aria-live="assertive" ng-if="vm.createError">{{vm.createError}}</p>
      <label><span>Başlık</span><input type="text" ng-model="vm.createDraft.title" maxlength="200" required></label>
      <label><span>Tür</span><select ng-model="vm.createDraft.type" ng-change="vm.createDraft.customFieldValues = {}" ng-options="type.key as type.name for type in vm.schema.issueTypes | filter:{active:true}"></select></label>
      <label><span>Öncelik</span><select ng-model="vm.createDraft.priority"><option>Critical</option><option>High</option><option>Medium</option><option>Low</option></select></label>
      <label ng-repeat="field in vm.customFieldsFor(vm.createDraft.type) track by field.key" ng-switch="field.type">
        <span>{{field.name}}<b ng-if="field.required"> *</b></span>
        <input ng-switch-when="Text" type="text" ng-model="vm.createDraft.customFieldValues[field.key]" maxlength="{{field.maxLength}}">
        <input ng-switch-when="Number" type="number" ng-model="vm.createDraft.customFieldValues[field.key]" min="{{field.minimum}}" max="{{field.maximum}}" step="any">
        <select ng-switch-when="Boolean" ng-model="vm.createDraft.customFieldValues[field.key]"><option value="">Seçin</option><option ng-value="true">Evet</option><option ng-value="false">Hayır</option></select>
        <input ng-switch-when="Date" type="date" ng-model="vm.createDraft.customFieldValues[field.key]">
        <select ng-switch-when="Select" ng-model="vm.createDraft.customFieldValues[field.key]" ng-options="option for option in field.options"><option value="">Seçin</option></select>
      </label>
    </div>
  </script>

  <script id="templates/create-sprint.html" type="text/ng-template">
    <div class="mobile-sprint-form">
      <label><span>Ad</span><input type="text" ng-model="vm.sprintDraft.name" maxlength="100" autocomplete="off"></label>
      <label><span>Hedef</span><textarea ng-model="vm.sprintDraft.goal" maxlength="500" rows="2"></textarea></label>
      <div><label><span>Başlangıç</span><input type="date" ng-model="vm.sprintDraft.startDate"></label><label><span>Bitiş</span><input type="date" ng-model="vm.sprintDraft.endDate"></label></div>
      <p class="mobile-field-error" ng-if="vm.sprintDraftError" role="alert">{{vm.sprintDraftError}}</p>
    </div>
  </script>

  <script id="templates/complete-sprint.html" type="text/ng-template">
    <div class="mobile-sprint-form"><p>Tamamlanmayan işleri nereye taşıyacağınızı seçin.</p><label><span>Devir hedefi</span><select ng-model="vm.carryoverSprintId"><option value="">Backlog'a taşı</option><option ng-repeat="sprint in vm.carryoverTargets()" value="{{sprint.id}}">{{sprint.name}} sprintine taşı</option></select></label></div>
  </script>

  <script id="templates/tasks.html" type="text/ng-template">
    <ion-view view-title="İşlerim">
      <ion-nav-buttons side="right">
        <button class="button button-icon ion-plus" ng-click="vm.quickAdd()" aria-label="Görev oluştur"></button>
      </ion-nav-buttons>
      <ion-content class="workspace" delegate-handle="taskWorkScroll">
        <div class="mobile-state" ng-if="vm.loading" aria-live="polite">İşler yükleniyor...</div>
        <div class="mobile-state is-error" ng-if="vm.loadError" role="alert"><span>{{vm.loadError}}</span><button type="button" class="button button-small" ng-click="vm.load()">Yeniden dene</button></div>
        <section class="mobile-shell-empty" ng-if="!vm.loading && vm.projectMissing && !vm.loadError"><i class="icon ion-folder" aria-hidden="true"></i><h3>Çalışma projesi yok</h3><p>İşleri görüntülemek için erişebildiğiniz bir proje oluşturun.</p><button type="button" class="button button-stable" ui-sref="app.projects">Projelere git</button></section>
        <div class="mobile-degraded-state" ng-if="vm.searchDegraded" role="status">Arama geçici olarak sınırlı. Görevler güvenli yedek görünümden gösteriliyor.</div>
        <div class="segmented work-mode-segments" role="tablist" aria-label="Mobil iş görünümü" ng-keydown="vm.handleModeKey($event)">
          <button role="tab" aria-selected="{{vm.mode === 'my'}}" tabindex="{{vm.mode === 'my' ? 0 : -1}}" ng-class="{active: vm.mode === 'my'}" ng-click="vm.setMode('my')">Benim</button>
          <button role="tab" aria-selected="{{vm.mode === 'backlog'}}" tabindex="{{vm.mode === 'backlog' ? 0 : -1}}" ng-class="{active: vm.mode === 'backlog'}" ng-click="vm.setMode('backlog')">Backlog</button>
          <button role="tab" aria-selected="{{vm.mode === 'sprint'}}" tabindex="{{vm.mode === 'sprint' ? 0 : -1}}" ng-class="{active: vm.mode === 'sprint'}" ng-click="vm.setMode('sprint')">Sprint</button>
          <button role="tab" aria-selected="{{vm.mode === 'board'}}" tabindex="{{vm.mode === 'board' ? 0 : -1}}" ng-class="{active: vm.mode === 'board'}" ng-click="vm.setMode('board')">Pano</button>
          <button role="tab" aria-selected="{{vm.mode === 'list'}}" tabindex="{{vm.mode === 'list' ? 0 : -1}}" ng-class="{active: vm.mode === 'list'}" ng-click="vm.setMode('list')">Liste</button>
        </div>
        <div class="segmented" ng-if="vm.mode === 'my'">
          <button ng-class="{active: vm.status === ''}" ng-click="vm.filter('')">Tümü</button>
          <button ng-class="{active: vm.status === 'To Do'}" ng-click="vm.filter('To Do')">Yapılacak</button>
          <button ng-class="{active: vm.status === 'In Progress'}" ng-click="vm.filter('In Progress')">Aktif</button>
          <button ng-class="{active: vm.status === 'Done'}" ng-click="vm.filter('Done')">Tamam</button>
        </div>
        <section class="mobile-planning" ng-if="vm.mode === 'backlog'">
          <div class="mobile-feedback error" ng-if="vm.planningError" role="alert" aria-live="assertive">{{vm.planningError}}</div>
          <div class="mobile-feedback success" ng-if="vm.planningSuccess" role="status">{{vm.planningSuccess}}</div>
          <header class="mobile-planning-head"><div><strong>Backlog</strong><small>{{vm.backlogItems.length}} iş<span ng-if="vm.backlogNextCursor"> · devamı var</span></small></div><button class="button button-small button-clear icon-left ion-plus" ng-if="vm.canEditTasks()" ng-click="vm.openCreateSprint()" ng-disabled="vm.planningBusy">Sprint</button></header>
          <label class="item item-input item-select mobile-sprint-select"><span class="input-label">Hedef sprint</span><select ng-model="vm.selectedSprintId" ng-change="vm.selectSprint()" aria-label="Backlog hedef sprinti" ng-options="sprint.id as (sprint.name + ' · ' + sprint.status) for sprint in vm.sprints"><option value="">Sprint seçin</option></select></label>
          <div class="mobile-sprint-brief" ng-if="vm.selectedSprint()"><strong>{{vm.selectedSprint().goal || 'Hedef belirtilmedi'}}</strong><small>{{vm.selectedSprint().startDate | date:'dd.MM'}} - {{vm.selectedSprint().endDate | date:'dd.MM'}} · {{vm.selectedSprint().status}}</small></div>
          <div class="mobile-planning-list"><article class="mobile-planning-row" ng-repeat="task in vm.backlogItems track by task.id"><button class="mobile-task-main" ng-click="vm.openTask(task)"><strong>{{task.title}}</strong><small>{{task.type}} · {{task.priority}} · {{task.estimatePoints}} puan</small></button><button class="button button-small mobile-plan-button" ng-if="vm.canEditTasks() && vm.selectedSprint().status === 'Planned'" ng-click="vm.planBacklogItem(task)" ng-disabled="vm.planningBusy" aria-label="{{task.title}} işini sprint kapsamına al"><i class="icon ion-arrow-right-c" aria-hidden="true"></i></button></article><p class="mobile-planning-empty" ng-if="!vm.backlogItems.length">Backlog boş.</p></div>
          <button class="button button-block button-stable" ng-if="vm.backlogNextCursor" ng-click="vm.loadMoreBacklog()" ng-disabled="vm.planningBusy">Daha fazla iş yükle</button>
        </section>
        <section ng-if="vm.mode === 'sprint'">
          <div class="mobile-feedback error" ng-if="vm.planningError" role="alert" aria-live="assertive">{{vm.planningError}}</div>
          <header class="mobile-planning-head"><div><strong>Sprint</strong><small>{{vm.sprintItems.length}} iş · {{vm.planningPoints()}} puan</small></div><button class="button button-small button-clear icon-left ion-plus" ng-if="vm.canEditTasks()" ng-click="vm.openCreateSprint()" ng-disabled="vm.planningBusy">Yeni</button></header>
          <label class="item item-input item-select mobile-sprint-select"><span class="input-label">Sprint</span><select ng-model="vm.selectedSprintId" ng-change="vm.selectSprint()" aria-label="Mobil sprint" ng-options="sprint.id as (sprint.name + ' · ' + sprint.status) for sprint in vm.sprints"><option value="">Sprint seçin</option></select></label>
          <div class="mobile-sprint-summary" ng-if="vm.selectedSprint()"><div><span>Hedef</span><strong>{{vm.selectedSprint().goal || 'Hedef belirtilmedi'}}</strong></div><div><span>Dönem</span><strong>{{vm.selectedSprint().startDate | date:'dd.MM'}} - {{vm.selectedSprint().endDate | date:'dd.MM'}}</strong></div><div><span>Taahhüt</span><strong>{{vm.selectedSprint().committedPoints}} puan</strong></div><div><span>Tamamlanan</span><strong>{{vm.selectedSprint().completedPoints}} puan</strong></div></div>
          <div class="mobile-sprint-actions" ng-if="vm.canEditTasks() && vm.selectedSprint()"><button class="button button-small button-positive icon-left ion-play" ng-if="vm.selectedSprint().status === 'Planned'" ng-click="vm.startSprint()" ng-disabled="vm.planningBusy">Başlat</button><button class="button button-small button-positive icon-left ion-checkmark" ng-if="vm.selectedSprint().status === 'Active'" ng-click="vm.completeSprint()" ng-disabled="vm.planningBusy">Tamamla</button></div>
          <div class="mobile-burndown" ng-if="vm.burndown.length"><span>Burndown</span><strong>{{vm.burndown[vm.burndown.length - 1].remainingPoints}} puan kaldı</strong><small>{{vm.burndown.length}} güncel nokta</small></div>
          <div class="mobile-planning-list"><article class="mobile-planning-row" ng-repeat="task in vm.sprintItems track by task.id"><button class="mobile-task-main" ng-click="vm.openTask(task)"><strong>{{task.title}}</strong><small>{{task.status}} · {{task.priority}} · {{task.estimatePoints}} puan</small></button><button class="button button-small mobile-plan-button" ng-if="vm.canEditTasks() && vm.selectedSprint().status === 'Planned'" ng-click="vm.unplanSprintItem(task)" ng-disabled="vm.planningBusy" aria-label="{{task.title}} işini backlog alanına taşı"><i class="icon ion-arrow-left-c" aria-hidden="true"></i></button></article><p class="mobile-planning-empty" ng-if="!vm.sprintItems.length">Bu sprintte iş yok.</p></div>
        </section>
        <section ng-if="vm.mode === 'board'">
          <label class="item item-input item-select"><span class="input-label">Pano</span><select ng-model="vm.selectedBoardId" ng-change="vm.selectBoard()" aria-label="Mobil pano" ng-options="board.id as board.name for board in vm.boards"></select></label>
          <div class="mobile-feedback error" ng-if="vm.moveError" role="alert" aria-live="assertive">{{vm.moveError}}</div>
          <div class="mobile-board-lane" ng-repeat="lane in vm.boardLanes track by lane.id" data-wip-state="{{lane.wipLimit && lane.tasks.length >= lane.wipLimit ? 'full' : 'open'}}"><h3>{{lane.name}} <span>{{lane.tasks.length}}<b ng-if="lane.wipLimit"> / {{lane.wipLimit}}</b></span></h3><article class="mobile-board-task" ng-repeat="task in lane.tasks track by task.id" ng-class="{pending: vm.movingTaskId === task.id}"><button class="mobile-task-main" ng-click="vm.openTask(task)"><strong>{{task.title}}</strong><small>{{task.priority}} · {{task.estimatePoints == null ? 'efor yok' : task.estimatePoints + ' puan'}}</small></button><div class="mobile-task-move" ng-if="vm.canEditTasks()"><button class="button button-small button-clear ion-arrow-left-c" ng-click="vm.moveTask(task, -1)" ng-disabled="!vm.canMoveTask(task, -1)" aria-label="{{task.title}} görevini önceki kolona taşı"></button><button class="button button-small button-clear ion-arrow-right-c" ng-click="vm.moveTask(task, 1)" ng-disabled="!vm.canMoveTask(task, 1)" aria-label="{{task.title}} görevini sonraki kolona taşı"></button></div></article><p ng-if="!lane.tasks.length">Boş</p></div>
        </section>
        <ion-list ng-if="vm.mode === 'my' || vm.mode === 'list'">
          <ion-item class="task-row" collection-repeat="task in vm.tasks" item-height="58px" item-width="100%" ng-click="vm.openTask(task)">
            <h2>{{task.title}}</h2>
            <p>{{task.type}} · {{task.status}} · {{task.priority}}</p>
          </ion-item>
        </ion-list>
        <ion-infinite-scroll ng-if="vm.mode === 'my' && vm.hasMore" on-infinite="vm.loadMore()" distance="10%"></ion-infinite-scroll>
      </ion-content>
    </ion-view>
  </script>

  <script id="templates/notifications.html" type="text/ng-template">
    <ion-view view-title="Gelen kutusu">
      <ion-content class="workspace">
        <ion-refresher pulling-text="Gelen kutusunu yenile" on-refresh="vm.refresh()"></ion-refresher>
        <div class="mobile-state" ng-if="vm.loading" aria-live="polite">Bildirimler yükleniyor...</div>
        <div class="mobile-state is-error" ng-if="vm.error" role="alert"><span>{{vm.error}}</span><button type="button" class="button button-small" ng-click="vm.load()">Yeniden dene</button></div>
        <div class="segmented mobile-inbox-segments" role="tablist" aria-label="Bildirim filtresi"><button role="tab" aria-selected="{{vm.mode==='unread'}}" tabindex="{{vm.mode==='unread' ? 0 : -1}}" ng-class="{active:vm.mode==='unread'}" ng-click="vm.setMode('unread')">Okunmamış</button><button role="tab" aria-selected="{{vm.mode==='actions'}}" tabindex="{{vm.mode==='actions' ? 0 : -1}}" ng-class="{active:vm.mode==='actions'}" ng-click="vm.setMode('actions')">Eylem</button><button role="tab" aria-selected="{{vm.mode==='all'}}" tabindex="{{vm.mode==='all' ? 0 : -1}}" ng-class="{active:vm.mode==='all'}" ng-click="vm.setMode('all')">Tümü</button></div>
        <ion-list>
          <ion-item ng-repeat="notification in vm.visibleNotifications()" ng-click="vm.read(notification)" role="button" tabindex="0" ng-keydown="$event.key === 'Enter' && vm.read(notification)" ng-attr-aria-busy="{{notification.reading ? 'true' : 'false'}}">
            <h2>{{notification.type}}</h2>
            <p>{{notification.message}}</p>
            <small>{{notification.createdAt | date:'dd MMM HH:mm'}}</small>
            <span class="badge badge-assertive" ng-if="!notification.read">yeni</span>
          </ion-item>
          <ion-item ng-if="!vm.loading && !vm.visibleNotifications().length">Bu filtrede bildirim yok.</ion-item>
        </ion-list>
      </ion-content>
    </ion-view>
  </script>

  <script id="templates/profile.html" type="text/ng-template">
    <ion-view view-title="Ayarlar">
      <ion-content class="workspace profile security-profile">
        <ion-refresher pulling-text="Güvenliği yenile" on-refresh="vm.load()"></ion-refresher>
        <header class="mobile-profile-heading">
          <img src="../shared/zumbo-mark.svg" alt="">
          <div><h2>{{shell.session.currentUser.username}}</h2><p>{{shell.session.currentUser.email}}</p><small>{{shell.organizationName()}}</small></div>
          <button class="button button-clear icon ion-ios-moon-outline" ng-click="shell.toggleTheme()" aria-label="Temayı değiştir"></button>
        </header>

        <div class="mobile-state" ng-if="vm.loading">Güvenlik bilgileri yükleniyor...</div>
        <div class="mobile-state is-error" ng-if="vm.error" role="alert"><span>{{vm.error}}</span><button class="button button-small" ng-click="vm.load()">Yeniden dene</button></div>

        <div ng-if="!vm.loading">
          <section class="mobile-settings-band mobile-integration-entry" ng-if="vm.canManageIntegrations()">
            <header><div><h3>Entegrasyonlar</h3><p>Webhook uç noktalarını ve teslimat sağlığını yönet</p></div><i class="icon ion-merge" aria-hidden="true"></i></header>
            <button class="button button-stable button-block icon-left ion-arrow-right-c" ui-sref="integration-center">Webhook yönetimini aç</button>
          </section>

          <section class="mobile-settings-band mobile-integration-entry" ng-if="vm.canManageOperations()">
            <header><div><h3>Operasyonlar</h3><p>Hizmet sağlığını ve kurtarma kuyruklarını incele</p></div><i class="icon ion-ios-pulse-strong" aria-hidden="true"></i></header>
            <button class="button button-stable button-block icon-left ion-arrow-right-c" ui-sref="operations-center">Operasyon merkezini aç</button>
          </section>

          <section class="mobile-settings-band">
            <header><div><h3>Bildirim tercihleri</h3><p>Kanalları ve sessize alınan türleri yönet</p></div><i class="icon ion-ios-bell-outline" aria-hidden="true"></i></header>
            <ion-toggle ng-model="vm.preferences.inAppEnabled">Uygulama içi bildirim</ion-toggle>
            <ion-toggle ng-model="vm.preferences.emailEnabled">E-posta bildirimi</ion-toggle>
            <label class="item item-input"><span class="input-label">Sessiz türler</span><input ng-model="vm.mutedTypesText" placeholder="Assignment, Mention" aria-label="Sessize alınan bildirim türleri"></label>
            <button class="button button-positive button-block icon-left ion-checkmark" ng-click="vm.savePreferences()" ng-disabled="vm.busy || shell.pwa.offline">Tercihleri kaydet</button>
          </section>

          <section class="mobile-settings-band">
            <header><div><h3>İki adımlı doğrulama</h3><p>{{vm.mfaStatus.enabled ? 'Etkin · ' + vm.mfaStatus.remainingRecoveryCodes + ' kurtarma kodu' : 'Devre dışı'}}</p></div><span class="mobile-status" ng-class="{active: vm.mfaStatus.enabled}">{{vm.mfaStatus.enabled ? 'Etkin' : 'Kapalı'}}</span></header>
            <div ng-if="!vm.mfaStatus.enabled">
              <label class="item item-input"><span class="input-label">Parola</span><input type="password" autocomplete="current-password" ng-model="vm.mfaDraft.password" aria-label="MFA kurulum parolası"></label>
              <button class="button button-stable button-block icon-left ion-locked" ng-click="vm.beginMfaSetup()" ng-disabled="vm.busy || shell.pwa.offline">Kurulumu başlat</button>
            </div>
            <div class="mobile-secret" ng-if="vm.mfaSetup">
              <strong>Doğrulayıcı sırrı</strong><code>{{vm.mfaSetup.secret}}</code><p>Bu sır yalnız kurulum sırasında gösterilir.</p>
              <label class="item item-input"><span class="input-label">Kod</span><input inputmode="numeric" ng-model="vm.mfaDraft.code" aria-label="MFA doğrulama kodu"></label>
              <button class="button button-positive button-block" ng-click="vm.confirmMfaSetup()" ng-disabled="vm.busy">Etkinleştir</button>
            </div>
            <div ng-if="vm.mfaStatus.enabled">
              <div class="mobile-security-form">
                <label class="item item-input"><span class="input-label">Parola</span><input type="password" autocomplete="current-password" ng-model="vm.recoveryDraft.password" aria-label="Kurtarma kodu yenileme parolası"></label>
                <label class="item item-input"><span class="input-label">Kod</span><input ng-model="vm.recoveryDraft.code" aria-label="Kurtarma kodu yenileme doğrulaması"></label>
                <button class="button button-stable button-block icon-left ion-loop" ng-click="vm.regenerateRecoveryCodes()" ng-disabled="vm.busy || shell.pwa.offline">Kurtarma kodlarını yenile</button>
              </div>
              <div class="mobile-secret" ng-if="vm.recoveryCodes.length">
                <div class="mobile-secret-heading"><strong>Yeni kurtarma kodları</strong><button class="button button-clear icon ion-close" ng-click="vm.dismissRecoveryCodes()" aria-label="Kurtarma kodlarını kapat"></button></div>
                <code ng-repeat="code in vm.recoveryCodes track by code">{{code}}</code>
                <button class="button button-small button-stable icon-left ion-clipboard" ng-click="vm.copyRecoveryCodes()">Tümünü kopyala</button>
                <p>Bu liste kapatıldıktan sonra yeniden gösterilmez.</p>
              </div>
              <div class="mobile-security-form">
                <label class="item item-input"><span class="input-label">Parola</span><input type="password" autocomplete="current-password" ng-model="vm.mfaDraft.password" aria-label="MFA kapatma parolası"></label>
                <label class="item item-input"><span class="input-label">Kod</span><input ng-model="vm.mfaDraft.code" aria-label="MFA kapatma doğrulaması"></label>
                <button class="button button-assertive button-outline button-block" ng-click="vm.disableMfa()" ng-disabled="vm.busy || shell.pwa.offline">İki adımlı doğrulamayı kapat</button>
              </div>
            </div>
          </section>

          <section class="mobile-settings-band">
            <header><div><h3>Aktif oturumlar</h3><p>Yalnız seçtiğin cihazın erişimini kapat</p></div><i class="icon ion-monitor" aria-hidden="true"></i></header>
            <div class="mobile-session-row" ng-repeat="session in vm.visibleSessions() track by session.id" ng-class="{current: session.isCurrent, inactive: !vm.sessionIsActive(session)}">
              <i class="icon ion-iphone" aria-hidden="true"></i>
              <div><strong>{{session.deviceName || 'Bilinmeyen cihaz'}}</strong><span>{{session.isCurrent ? 'Bu cihaz' : (session.revokedAt ? 'Kapatıldı' : 'Diğer cihaz')}}</span><small>Son kullanım {{session.lastSeenAt | date:'dd.MM.yyyy HH:mm'}}</small></div>
              <button class="button button-small" ng-if="vm.sessionIsActive(session)" ng-class="session.isCurrent ? 'button-assertive button-outline' : 'button-stable'" ng-click="vm.revokeSession(session)" ng-disabled="vm.busy || shell.pwa.offline" aria-label="{{session.isCurrent ? 'Bu cihaz oturumunu kapat' : 'Seçilen cihaz oturumunu kapat'}}"><i class="icon ion-log-out" aria-hidden="true"></i></button>
              <span class="mobile-status" ng-if="!vm.sessionIsActive(session)" aria-label="Oturum kapalı"><i class="icon ion-checkmark-circled" aria-hidden="true"></i></span>
            </div>
            <div class="mobile-state compact" ng-if="!vm.sessions.length">Gösterilecek oturum yok.</div>
          </section>

          <section class="mobile-settings-band mobile-privacy-band">
            <header><div><h3>Gizlilik ve hesap</h3><p>Verilerini aktar veya hesabını kalıcı olarak anonimleştir</p></div><i class="icon ion-ios-locked-outline" aria-hidden="true"></i></header>
            <button class="button button-stable button-block icon-left ion-archive" ng-click="vm.exportPrivacyData()" ng-disabled="vm.privacyBusy || shell.pwa.offline">Verilerimi NDJSON olarak aktar</button>
            <div class="mobile-privacy-error" ng-if="vm.privacyError" role="alert"><i class="icon ion-alert-circled" aria-hidden="true"></i><span>{{vm.privacyError}}</span></div>

            <div class="mobile-privacy-form" ng-if="!vm.privacyWorkflow">
              <p>Anonimleştirme hesap erişimini kapatır ve geri alınamaz. Devam etmek için parolanı ve tam onay ifadesini gir.</p>
              <label class="item item-input"><span class="input-label">Parola</span><input type="password" autocomplete="current-password" ng-model="vm.privacyDraft.password" aria-label="Anonimleştirme parolası"></label>
              <label class="item item-input"><span class="input-label">Onay</span><input ng-model="vm.privacyDraft.confirmation" placeholder="ANONYMIZE" aria-label="Anonimleştirme onayı"></label>
              <button class="button button-assertive button-outline button-block icon-left ion-person-stalker" ng-click="vm.anonymizeAccount()" ng-disabled="vm.privacyBusy || shell.pwa.offline || vm.privacyDraft.confirmation !== 'ANONYMIZE'">Hesabı anonimleştir</button>
            </div>

            <div class="mobile-privacy-workflow" ng-if="vm.privacyWorkflow">
              <div class="mobile-privacy-workflow-heading">
                <span class="mobile-privacy-state" ng-class="{failed: vm.privacyWorkflow.state === 'Failed', complete: vm.privacyTerminal(vm.privacyWorkflow)}"><i class="icon" ng-class="vm.privacyWorkflow.state === 'Failed' ? 'ion-alert-circled' : (vm.privacyTerminal(vm.privacyWorkflow) ? 'ion-checkmark-circled' : 'ion-load-c')" aria-hidden="true"></i></span>
                <div><strong>{{vm.privacyStateLabel(vm.privacyWorkflow.state)}}</strong><small>Anonimleştirme işi · {{vm.privacyWorkflow.updatedAt | date:'dd.MM.yyyy HH:mm'}}</small></div>
                <b>{{vm.privacyProgress(vm.privacyWorkflow)}}%</b>
              </div>
              <div class="mobile-progress-track" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="{{vm.privacyProgress(vm.privacyWorkflow)}}"><span ng-style="{width: vm.privacyProgress(vm.privacyWorkflow) + '%'}"></span></div>
              <p class="mobile-privacy-safe-error" ng-if="vm.privacyWorkflow.lastError">{{vm.privacyWorkflow.lastError}}</p>
              <small class="mobile-privacy-expiry" ng-if="vm.privacyWorkflow.expiresAt">Durum kaydı {{vm.privacyWorkflow.expiresAt | date:'dd.MM.yyyy HH:mm'}} tarihinde sona erer.</small>
              <div class="mobile-privacy-actions">
                <button class="button button-stable button-small icon-left ion-loop" ng-if="vm.privacyCanRetry(vm.privacyWorkflow)" ng-click="vm.retryPrivacyWorkflow()" ng-disabled="vm.privacyBusy || shell.pwa.offline">Yeniden dene</button>
                <button class="button button-stable button-small icon-left ion-shuffle" ng-if="vm.privacyCanReconcile(vm.privacyWorkflow)" ng-click="vm.reconcilePrivacyWorkflow()" ng-disabled="vm.privacyBusy || shell.pwa.offline">Uzlaştır</button>
                <button class="button button-clear button-small icon-left ion-close" ng-if="vm.privacyTerminal(vm.privacyWorkflow)" ng-click="vm.dismissPrivacyWorkflow()" aria-label="Gizlilik işi durumunu kapat">Kapat</button>
              </div>
            </div>
          </section>

          <button class="button button-stable button-block icon-left ion-log-out" ng-click="shell.logout()">Çıkış yap</button>
        </div>
      </ion-content>
    </ion-view>
  </script>

  <script id="templates/integration-center.html" type="text/ng-template">
    <ion-view view-title="Entegrasyonlar">
      <ion-nav-buttons side="left">
        <button class="button button-clear icon ion-chevron-left" ng-click="vm.back()" aria-label="Geri"></button>
      </ion-nav-buttons>
      <ion-content class="workspace mobile-integration-center">
        <ion-refresher pulling-text="Entegrasyonları yenile" on-refresh="vm.load()" ng-if="vm.view === 'list'"></ion-refresher>

        <header class="mobile-integration-heading">
          <div ng-if="vm.surface === 'webhooks'"><span>Kurumsal olay akışı</span><h2>{{vm.view === 'editor' ? (vm.editorMode === 'create' ? 'Yeni webhook' : 'Webhook düzenle') : (vm.view === 'detail' && vm.selected ? vm.selected.name : 'Webhook yönetimi')}}</h2></div>
          <div ng-if="vm.surface === 'development'"><span>Kaynak kodu bağlamı</span><h2>{{vm.view === 'development-editor' ? 'Yeni sağlayıcı' : (vm.view === 'development-detail' && vm.development.selected ? vm.development.selected.name : 'Geliştirme bağlantıları')}}</h2></div>
          <button class="button button-positive icon ion-plus" ng-if="vm.view === 'list' && !vm.forbidden && vm.surface === 'webhooks'" ng-click="vm.newSubscription()" ng-disabled="shell.pwa.offline" aria-label="Webhook ekle"></button>
          <button class="button button-positive icon ion-merge" ng-if="vm.view === 'list' && !vm.forbidden && vm.surface === 'development'" ng-click="vm.newDevelopment()" ng-disabled="shell.pwa.offline" aria-label="Sağlayıcı bağla"></button>
        </header>

        <nav class="mobile-integration-tabs" role="tablist" aria-label="Entegrasyon türü">
          <button role="tab" ng-class="{active: vm.surface === 'webhooks'}" ng-attr-aria-selected="{{vm.surface === 'webhooks'}}" ng-click="vm.openSurface('webhooks')"><i class="icon ion-merge" aria-hidden="true"></i><span>Webhook’lar</span></button>
          <button role="tab" ng-class="{active: vm.surface === 'development'}" ng-attr-aria-selected="{{vm.surface === 'development'}}" ng-click="vm.openSurface('development')"><i class="icon ion-fork-repo" aria-hidden="true"></i><span>Geliştirme</span></button>
        </nav>

        <div class="mobile-integration-offline" ng-if="shell.pwa.offline"><i class="icon ion-cloud" aria-hidden="true"></i><span>Çevrimdışıyken kayıtlar salt okunur.</span></div>
        <div class="mobile-state" ng-if="vm.loading">Entegrasyonlar yükleniyor...</div>
        <div class="mobile-state is-error" ng-if="vm.error" role="alert"><span>{{vm.error}}</span><button class="button button-small" ng-click="vm.error = ''">Kapat</button></div>
        <div class="mobile-state is-error" ng-if="vm.forbidden"><span>Bu alan için Entegrasyon Yönetimi izni gereklidir.</span><button class="button button-small" ui-sref="app.profile">Profile dön</button></div>

        <div ng-if="!vm.loading && !vm.forbidden">
          <dl class="mobile-integration-metrics" ng-if="vm.surface === 'webhooks' && vm.view === 'list' && vm.metrics">
            <div><dt>Sırada</dt><dd>{{vm.metrics.pending}}</dd></div>
            <div><dt>Teslim</dt><dd>{{vm.metrics.delivered}}</dd></div>
            <div ng-class="{attention: vm.metrics.deadLetter}"><dt>Müdahale</dt><dd>{{vm.metrics.deadLetter}}</dd></div>
          </dl>

          <section class="mobile-integration-list" ng-if="vm.surface === 'webhooks' && vm.view === 'list'">
            <button class="mobile-webhook-row" ng-repeat="subscription in vm.subscriptions track by subscription.id" ng-click="vm.select(subscription)">
              <span class="mobile-webhook-state" ng-class="{active: subscription.isActive}" aria-hidden="true"></span>
              <span><strong>{{subscription.name}}</strong><small>{{vm.targetLabel(subscription.targetUrl)}}</small><em>{{subscription.eventScopes.length}} olay · sır v{{subscription.secretVersion}}</em></span>
              <i class="icon ion-chevron-right" aria-hidden="true"></i>
            </button>
            <div class="mobile-integration-empty" ng-if="!vm.subscriptions.length"><i class="icon ion-merge" aria-hidden="true"></i><strong>Henüz webhook yok</strong><span>İlk kurumsal olay akışını oluştur.</span><button class="button button-positive button-small" ng-click="vm.newSubscription()" ng-disabled="shell.pwa.offline">Webhook ekle</button></div>
          </section>

          <form class="mobile-webhook-editor" ng-if="vm.surface === 'webhooks' && vm.view === 'editor'" ng-submit="vm.save()">
            <p>Yalnız gerekli olayları seç; hedef güvenlik denetiminden geçirilecektir.</p>
            <label class="item item-input item-stacked-label"><span class="input-label">Ad</span><input ng-model="vm.draft.name" maxlength="100" placeholder="Üretim iş akışı" required></label>
            <label class="item item-input item-stacked-label"><span class="input-label">HTTPS uç noktası</span><input type="url" ng-model="vm.draft.targetUrl" maxlength="2048" placeholder="https://hooks.example.com/zumbo" required></label>
            <fieldset><legend>Olaylar</legend><ion-checkbox ng-repeat="scope in vm.scopes track by scope.value" ng-checked="vm.scopeSelected(scope.value)" ng-click="vm.toggleScope(scope.value)">{{scope.label}}</ion-checkbox></fieldset>
            <div class="mobile-webhook-editor-actions"><button type="button" class="button button-stable" ng-click="vm.cancelEditor()">Vazgeç</button><button type="submit" class="button button-positive icon-left ion-checkmark" ng-disabled="vm.busy || shell.pwa.offline">{{vm.busy === 'save' ? 'Kaydediliyor…' : 'Kaydet'}}</button></div>
          </form>

          <section class="mobile-webhook-detail" ng-if="vm.surface === 'webhooks' && vm.view === 'detail' && vm.selected">
            <div class="mobile-webhook-secret" ng-if="vm.secretReceipt" role="status">
              <div><strong>Bu sır yalnız şimdi gösterilir</strong><button class="button button-clear icon ion-close" ng-click="vm.dismissSecret()" aria-label="Sırrı kapat"></button></div>
              <p>Alıcı imza doğrulamasına ekledikten sonra kapat.</p><code>{{vm.secretReceipt.secret}}</code><small>Parmak izi {{vm.secretReceipt.fingerprint}} · sürüm {{vm.secretReceipt.version}}</small>
              <button class="button button-small button-stable icon-left ion-clipboard" ng-click="vm.copySecret()">Kopyala</button>
            </div>

            <header><div><span class="mobile-webhook-status" ng-class="{active: vm.selected.isActive}">{{vm.selected.isActive ? 'Etkin' : 'Durduruldu'}}</span><p>{{vm.targetLabel(vm.selected.targetUrl)}}</p></div><button class="button button-clear icon ion-edit" ng-click="vm.editSubscription()" ng-disabled="shell.pwa.offline" aria-label="Webhook düzenle"></button></header>
            <div class="mobile-webhook-scopes"><span ng-repeat="scope in vm.selected.eventScopes track by scope">{{vm.scopeLabel(scope)}}</span></div>
            <dl><div><dt>Parmak izi</dt><dd>{{vm.selected.secretFingerprint}}</dd></div><div><dt>Sürüm</dt><dd>v{{vm.selected.secretVersion}}</dd></div><div><dt>Güncellendi</dt><dd>{{vm.selected.updatedAtUtc | date:'dd.MM HH:mm'}}</dd></div></dl>
            <div class="mobile-webhook-actions">
              <button class="button button-stable icon-left ion-paper-airplane" ng-click="vm.sendTest()" ng-disabled="!vm.selected.isActive || vm.busy || shell.pwa.offline">Test gönder</button>
              <button class="button button-stable icon-left ion-key" ng-click="vm.rotateSecret()" ng-disabled="vm.busy || shell.pwa.offline">Sırrı döndür</button>
              <button class="button button-outline icon-left" ng-class="vm.selected.isActive ? 'button-assertive ion-pause' : 'button-balanced ion-play'" ng-click="vm.setActive(!vm.selected.isActive)" ng-disabled="vm.busy || shell.pwa.offline">{{vm.selected.isActive ? 'Durdur' : 'Etkinleştir'}}</button>
            </div>

            <section class="mobile-delivery-register">
              <header><div><h3>Son teslimatlar</h3><p>Yük yerine güvenli özet ve sonuç gösterilir.</p></div><button class="button button-clear icon ion-loop" ng-click="vm.loadDeliveries(true)" aria-label="Teslimatları yenile"></button></header>
              <article class="mobile-delivery-row" ng-repeat="delivery in vm.deliveries track by delivery.id">
                <span class="mobile-delivery-state" data-tone="{{vm.deliveryState(delivery).tone}}"><i class="icon" ng-class="delivery.status === 'Delivered' ? 'ion-checkmark' : (delivery.status === 'DeadLetter' ? 'ion-alert' : 'ion-clock')" aria-hidden="true"></i></span>
                <div><strong>{{vm.deliveryState(delivery).label}}</strong><span>{{vm.scopeLabel(delivery.eventScope)}} · {{delivery.createdAtUtc | date:'dd.MM HH:mm'}}</span><small>SHA {{vm.shortHash(delivery.payloadSha256)}} · {{delivery.attempts}} deneme</small><p ng-if="delivery.lastErrorCode">{{vm.safeError(delivery.lastErrorCode)}}</p></div>
                <button class="button button-clear icon ion-loop" ng-if="vm.canReplay(delivery)" ng-click="vm.replay(delivery)" ng-disabled="vm.busy || shell.pwa.offline" aria-label="Teslimatı yeniden sırala"></button>
              </article>
              <div class="mobile-integration-empty compact" ng-if="!vm.deliveries.length"><span>Bu uç nokta için teslimat yok.</span></div>
              <button class="button button-stable button-small button-block" ng-if="vm.nextCursor" ng-click="vm.loadDeliveries(false)">Daha fazla göster</button>
            </section>
          </section>

          <section class="mobile-integration-list mobile-development-list" ng-if="vm.surface === 'development' && vm.view === 'list'">
            <button class="mobile-webhook-row mobile-development-row" ng-repeat="connection in vm.development.connections track by connection.id" ng-click="vm.selectDevelopment(connection)">
              <span class="mobile-provider-mark" data-provider="{{connection.provider}}" aria-hidden="true">{{connection.provider === 'GitHub' ? 'GH' : 'GL'}}</span>
              <span><strong>{{connection.name}}</strong><small>{{vm.developmentSafeUrl(connection.baseUrl)}}</small><em>{{vm.developmentHealthState(connection).label}} · sır v{{connection.webhookSecretVersion}}</em></span>
              <i class="icon ion-chevron-right" aria-hidden="true"></i>
            </button>
            <div class="mobile-integration-empty" ng-if="!vm.development.connections.length"><i class="icon ion-fork-repo" aria-hidden="true"></i><strong>Sağlayıcı bağlı değil</strong><span>İlk GitHub veya GitLab kaynağını bağla.</span><button class="button button-positive button-small" ng-click="vm.newDevelopment()" ng-disabled="shell.pwa.offline">Sağlayıcı bağla</button></div>
          </section>

          <form class="mobile-webhook-editor mobile-development-editor" ng-if="vm.surface === 'development' && vm.view === 'development-editor'" ng-submit="vm.saveDevelopment()">
            <p>Yalnız repository okuma, pull request ve commit durumu için gerekli en düşük kapsamları kullan.</p>
            <fieldset class="mobile-provider-choice"><legend>Sağlayıcı</legend><button type="button" ng-repeat="provider in vm.developmentProviders track by provider.value" ng-class="{active: vm.development.draft.provider === provider.value}" ng-click="vm.selectDevelopmentProvider(provider.value)" ng-attr-aria-pressed="{{vm.development.draft.provider === provider.value}}"><span class="mobile-provider-mark" data-provider="{{provider.value}}">{{provider.value === 'GitHub' ? 'GH' : 'GL'}}</span><span>{{provider.label}}</span></button></fieldset>
            <label class="item item-input item-stacked-label"><span class="input-label">Bağlantı adı</span><input ng-model="vm.development.draft.name" maxlength="100" placeholder="Ürün repository’leri" required></label>
            <label class="item item-input item-stacked-label"><span class="input-label">Sağlayıcı temel adresi</span><input type="url" ng-model="vm.development.draft.baseUrl" maxlength="2048" required></label>
            <label class="item item-input item-stacked-label"><span class="input-label">Erişim anahtarı</span><input type="password" ng-model="vm.development.draft.accessToken" minlength="16" maxlength="512" autocomplete="new-password" required></label>
            <div class="mobile-development-scope"><i class="icon ion-locked" aria-hidden="true"></i><span>{{vm.development.draft.provider === 'GitHub' ? 'metadata:read · pull_requests:read · commit_statuses:read' : 'read_api'}}</span></div>
            <div class="mobile-webhook-editor-actions"><button type="button" class="button button-stable" ng-click="vm.cancelDevelopmentEditor()">Vazgeç</button><button type="submit" class="button button-positive icon-left ion-link" ng-disabled="vm.busy || shell.pwa.offline">{{vm.busy === 'development-save' ? 'Bağlanıyor…' : 'Bağla'}}</button></div>
          </form>

          <section class="mobile-webhook-detail mobile-development-detail" ng-if="vm.surface === 'development' && vm.view === 'development-detail' && vm.development.selected">
            <div class="mobile-webhook-secret" ng-if="vm.development.secretReceipt" role="status">
              <div><strong>Webhook sırrı yalnız şimdi gösterilir</strong><button class="button button-clear icon ion-close" ng-click="vm.dismissSecret()" aria-label="Geliştirme webhook sırrını kapat"></button></div>
              <p>Sağlayıcı webhook’una güvenli imza doğrulaması için ekle.</p><code>{{vm.development.secretReceipt.secret}}</code><small>Parmak izi {{vm.development.secretReceipt.fingerprint}} · sürüm {{vm.development.secretReceipt.version}}</small>
              <button class="button button-small button-stable icon-left ion-clipboard" ng-click="vm.copySecret()">Kopyala</button>
            </div>

            <header><div><span class="mobile-webhook-status" data-tone="{{vm.developmentHealthState(vm.development.selected).tone}}" ng-class="{active: vm.development.selected.isConnected}">{{vm.developmentHealthState(vm.development.selected).label}}</span><p>{{vm.development.selected.provider}} · {{vm.developmentSafeUrl(vm.development.selected.baseUrl)}}</p></div><span class="mobile-provider-mark large" data-provider="{{vm.development.selected.provider}}" aria-hidden="true">{{vm.development.selected.provider === 'GitHub' ? 'GH' : 'GL'}}</span></header>
            <div class="mobile-webhook-scopes"><span ng-repeat="scope in vm.development.selected.requiredScopes track by scope">{{scope}}</span></div>
            <p class="mobile-development-error" ng-if="vm.development.selected.healthErrorCode">{{vm.developmentSafeHealthError(vm.development.selected.healthErrorCode)}}</p>
            <dl><div><dt>Erişim anahtarı</dt><dd>{{vm.developmentShortFingerprint(vm.development.selected.credentialFingerprint)}}</dd></div><div><dt>Webhook sırrı</dt><dd>v{{vm.development.selected.webhookSecretVersion}}</dd></div><div><dt>Denetim</dt><dd>{{vm.development.selected.healthCheckedAtUtc ? (vm.development.selected.healthCheckedAtUtc | date:'dd.MM HH:mm') : 'Yapılmadı'}}</dd></div></dl>
            <div class="mobile-webhook-actions mobile-development-actions">
              <button class="button button-stable icon-left ion-ios-pulse-strong" ng-click="vm.checkDevelopmentHealth()" ng-disabled="!vm.development.selected.isConnected || vm.busy || shell.pwa.offline">Sağlığı denetle</button>
              <button class="button button-stable icon-left ion-key" ng-click="vm.rotateDevelopmentSecret()" ng-disabled="!vm.development.selected.isConnected || vm.busy || shell.pwa.offline">Webhook sırrı</button>
              <button class="button button-outline button-assertive icon-left ion-power" ng-if="vm.development.selected.isConnected" ng-click="vm.disconnectDevelopment()" ng-disabled="vm.busy || shell.pwa.offline">Bağlantıyı kes</button>
            </div>

            <form class="mobile-development-credential" ng-submit="vm.rotateDevelopmentCredential()" ng-if="vm.development.selected.isConnected">
              <label><span>Yeni erişim anahtarı</span><input type="password" ng-model="vm.development.credentialDraft" minlength="16" maxlength="512" autocomplete="new-password" placeholder="En az 16 karakter"></label><button class="button button-small button-stable" type="submit" ng-disabled="!vm.development.credentialDraft || vm.busy || shell.pwa.offline">Anahtarı döndür</button>
            </form>

            <section class="mobile-development-mappings">
              <header><div><h3>Repository eşlemeleri</h3><p>Repository’yi bir Zumbo projesine bağla.</p></div><button class="button button-small button-stable icon-left ion-ios-search" ng-click="vm.discoverDevelopmentRepositories()" ng-disabled="!vm.development.selected.isConnected || vm.busy">{{vm.busy === 'development-repositories' ? 'Taranıyor…' : 'Getir'}}</button></header>
              <form class="mobile-development-mapping-form" ng-if="vm.development.repositories.length" ng-submit="vm.createDevelopmentMapping()">
                <label><span>Zumbo projesi</span><select ng-model="vm.development.mappingDraft.projectId" required><option value="">Proje seçin</option><option ng-repeat="project in vm.development.projects track by project.id" value="{{project.id}}">{{project.name}}</option></select></label>
                <label><span>Repository</span><select ng-model="vm.development.mappingDraft.repositoryId" required><option value="">Repository seçin</option><option ng-repeat="repository in vm.development.repositories track by repository.externalRepositoryId" value="{{repository.externalRepositoryId}}">{{repository.fullName}}</option></select></label>
                <button class="button button-positive button-block" type="submit" ng-disabled="vm.busy || shell.pwa.offline">Eşleştir</button>
                <p ng-if="vm.development.repositoryStatus === 'Partial'">İlk 100 repository gösteriliyor.</p>
              </form>
              <article class="mobile-development-mapping" ng-repeat="mapping in vm.development.mappings track by mapping.id"><i class="icon ion-fork-repo" aria-hidden="true"></i><span><strong>{{mapping.repositoryFullName}}</strong><small>{{mapping.projectKey}} · {{mapping.projectName}} · {{mapping.defaultBranch}}</small></span><button class="button button-clear icon ion-unlink" ng-click="vm.deleteDevelopmentMapping(mapping)" ng-disabled="vm.busy || shell.pwa.offline" aria-label="{{mapping.repositoryFullName}} eşlemesini kaldır"></button></article>
