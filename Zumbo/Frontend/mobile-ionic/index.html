      <ion-content class="workspace mobile-task-detail" data-loading="{{vm.loading}}">
        <div class="mobile-task-loading" ng-if="vm.loading" aria-busy="true" aria-label="Görev ayrıntıları yükleniyor">
          <span></span><span></span><span></span><span></span>
        </div>

        <section class="mobile-task-failure" ng-if="!vm.loading && vm.loadError" role="alert">
          <i class="ion-alert-circled" aria-hidden="true"></i>
          <h2>Görev açılamadı</h2>
          <p>{{vm.loadError}}</p>
          <button class="button button-small button-positive" type="button" ng-click="vm.load()">Yeniden dene</button>
        </section>

        <div ng-if="!vm.loading && !vm.loadError && vm.task">
          <header class="mobile-task-header">
            <div class="mobile-task-heading">
              <small>{{vm.task.key || vm.task.type}} · {{vm.task.status}}</small>
              <h1 ng-bind="vm.task.title"></h1>
            </div>
            <div class="mobile-task-collaboration" aria-label="Görev işbirliği">
              <button type="button" ng-class="{'active': vm.collaboration.watching}" ng-click="vm.toggleWatch()" ng-disabled="vm.actionBusy || shell.pwa.offline" aria-label="Görevi takip et" aria-pressed="{{vm.collaboration.watching}}"><i class="ion-eye" aria-hidden="true"></i><span>{{vm.collaboration.watcherCount}}</span></button>
              <button type="button" ng-class="{'active': vm.collaboration.voted}" ng-click="vm.toggleVote()" ng-disabled="vm.actionBusy || shell.pwa.offline" aria-label="Göreve oy ver" aria-pressed="{{vm.collaboration.voted}}"><i class="ion-arrow-up-c" aria-hidden="true"></i><span>{{vm.collaboration.voteCount}}</span></button>
            </div>
          </header>

          <div class="mobile-task-notice error" ng-if="vm.error" role="alert" aria-live="assertive"><i class="ion-alert-circled" aria-hidden="true"></i><span>{{vm.error}}</span></div>
          <div class="mobile-task-notice" ng-if="vm.partial" role="status"><i class="ion-cloud" aria-hidden="true"></i><span>Bazı ayrıntılar alınamadı. Kullanılabilen bilgiler gösteriliyor.</span></div>
          <div class="mobile-task-notice" ng-if="!vm.canEditTask()"><i class="ion-locked" aria-hidden="true"></i><span>Görev alanları salt okunur. Yorum, takip ve oy işlemleri kullanılabilir.</span></div>
          <div class="mobile-task-notice warning" ng-if="shell.pwa.offline"><i class="ion-wifi" aria-hidden="true"></i><span>Çevrimdışıyken değişiklikler devre dışıdır.</span></div>

          <nav class="mobile-task-view-tabs" aria-label="Görev detayı görünümü">
            <button type="button" ng-class="{'active': vm.detailView === 'detail'}" ng-click="vm.detailView = 'detail'">Detay</button>
            <button type="button" ng-class="{'active': vm.detailView === 'activity'}" ng-click="vm.detailView = 'activity'">Etkinlik <span>{{vm.streams.activity.totalCount}}</span></button>
          </nav>

          <div ng-if="vm.detailView === 'detail'">
            <section class="mobile-task-section mobile-task-description" aria-labelledby="mobile-description-heading">
              <h2 id="mobile-description-heading">Açıklama</h2>
              <p ng-bind="vm.task.description || 'Açıklama eklenmemiş.'"></p>
              <h3>Kabul ölçütleri</h3>
              <p ng-bind="vm.task.acceptanceCriteria || 'Kabul ölçütü eklenmemiş.'"></p>
            </section>

            <form class="mobile-task-section mobile-task-form" ng-if="vm.canEditTask()" ng-submit="vm.saveTask()">
              <div class="mobile-task-section-title"><h2>Özellikler</h2><span>{{vm.membership.role}}</span></div>
              <label><span>Başlık</span><input type="text" ng-model="vm.taskDraft.title" maxlength="200" required></label>
              <label><span>Açıklama</span><textarea ng-model="vm.taskDraft.description" rows="4"></textarea></label>
              <div class="mobile-task-form-grid">
                <label><span>Öncelik</span><select ng-model="vm.taskDraft.priority"><option>Critical</option><option>High</option><option>Medium</option><option>Low</option></select></label>
                <label><span>Son tarih</span><input type="date" ng-model="vm.taskDraft.dueDate"></label>
                <label><span>Sorumlu</span><select ng-model="vm.taskDraft.assigneeUserId"><option value="">Atanmamış</option><option ng-repeat="user in vm.users track by user.id" value="{{user.id}}">{{vm.userName(user.id)}}</option></select></label>
                <label><span>Ekip</span><select ng-model="vm.taskDraft.teamId"><option value="">Ekip yok</option><option ng-repeat="team in vm.teams track by team.id" value="{{team.id}}">{{team.name}}</option></select></label>
                <label><span>Sprint</span><select ng-model="vm.taskDraft.sprintId"><option value="">Backlog</option><option ng-repeat="sprint in vm.sprints track by sprint.id" value="{{sprint.id}}">{{sprint.name}}</option></select></label>
                <label><span>Tahmin</span><input type="number" min="0" step="1" ng-model="vm.taskDraft.estimatePoints"></label>
                <label class="wide"><span>Üst görev</span><select ng-model="vm.taskDraft.parentId"><option value="">Üst görev yok</option><option ng-repeat="candidate in vm.relationCandidates track by candidate.id" value="{{candidate.id}}">{{candidate.title}}</option></select></label>
              </div>
              <div class="mobile-task-custom-fields" ng-if="vm.customFieldsForTask().length">
                <label ng-repeat="field in vm.customFieldsForTask() track by field.key"><span>{{field.name}}</span><input ng-if="field.type === 'Text' || field.type === 'Number'" ng-attr-type="{{field.type === 'Number' ? 'number' : 'text'}}" ng-model="vm.taskDraft.customFieldValues[field.key]"><input ng-if="field.type === 'Date'" type="date" ng-model="vm.taskDraft.customFieldValues[field.key]"><select ng-if="field.type === 'Boolean'" ng-model="vm.taskDraft.customFieldValues[field.key]"><option ng-value="true">Evet</option><option ng-value="false">Hayır</option></select><select ng-if="field.type === 'Select'" ng-model="vm.taskDraft.customFieldValues[field.key]"><option value="">Seçin</option><option ng-repeat="option in field.options track by option.key" value="{{option.key}}">{{option.name}}</option></select></label>
              </div>
              <button class="button button-positive button-block" type="submit" ng-disabled="vm.saving || shell.pwa.offline">Değişiklikleri kaydet</button>
            </form>

            <section class="mobile-task-section" ng-if="!vm.canEditTask()">
              <div class="mobile-task-section-title"><h2>Özellikler</h2><span>{{vm.membership.role}}</span></div>
              <dl class="mobile-task-properties"><div><dt>Öncelik</dt><dd>{{vm.task.priority}}</dd></div><div><dt>Durum</dt><dd>{{vm.task.status}}</dd></div><div><dt>Son tarih</dt><dd>{{vm.task.dueDate ? (vm.task.dueDate | date:'dd MMM yyyy') : 'Belirtilmemiş'}}</dd></div><div><dt>Sorumlu</dt><dd>{{vm.userName(vm.task.assigneeUserId)}}</dd></div><div ng-repeat="value in vm.task.customFields track by value.fieldKey"><dt>{{vm.fieldDefinition(value).name}}</dt><dd>{{vm.customFieldValue(value)}}</dd></div></dl>
            </section>

            <section class="mobile-task-section" aria-labelledby="mobile-workflow-heading">
              <div class="mobile-task-section-title"><h2 id="mobile-workflow-heading">İş akışı</h2><span>{{vm.task.status}}</span></div>
              <div class="mobile-task-action-row" ng-if="vm.canEditTask() && vm.transitions.length"><button class="button button-small button-stable" type="button" ng-repeat="transition in vm.transitions" ng-click="vm.move(transition.toStatus)" ng-disabled="shell.pwa.offline">{{transition.toStatus}}</button></div>
              <p class="mobile-task-empty" ng-if="!vm.transitions.length">Kullanılabilir geçiş yok.</p>
            </section>

            <section class="mobile-task-section" aria-labelledby="mobile-checklist-heading">
              <div class="mobile-task-section-title"><h2 id="mobile-checklist-heading">Kontrol listesi</h2><span>{{vm.task.checklist.length || 0}}</span></div>
              <ion-checkbox ng-repeat="item in vm.task.checklist track by item.id" ng-checked="item.completed" ng-click="vm.toggleChecklist(item)" ng-disabled="!vm.canEditTask() || shell.pwa.offline">{{item.text}}</ion-checkbox>
              <div class="mobile-task-inline" ng-if="vm.canEditTask()"><input type="text" ng-model="vm.checklistText" placeholder="Yeni madde" aria-label="Yeni kontrol listesi maddesi"><button type="button" ng-click="vm.addChecklist()" ng-disabled="shell.pwa.offline" aria-label="Madde ekle"><i class="ion-plus" aria-hidden="true"></i></button></div>
            </section>

            <section class="mobile-task-section" aria-labelledby="mobile-labels-heading">
              <div class="mobile-task-section-title"><h2 id="mobile-labels-heading">Etiketler</h2><span>{{vm.task.labels.length || 0}}</span></div>
              <div class="mobile-task-chips"><span class="label-chip" ng-repeat="label in vm.task.labels track by $index">{{label}}</span><p class="mobile-task-empty" ng-if="!vm.task.labels.length">Etiket yok.</p></div>
              <div class="mobile-task-inline" ng-if="vm.canEditTask()"><input type="text" ng-model="vm.labelText" placeholder="Etiket" aria-label="Yeni etiket"><button type="button" ng-click="vm.addLabel()" ng-disabled="shell.pwa.offline" aria-label="Etiket ekle"><i class="ion-plus" aria-hidden="true"></i></button></div>
            </section>

            <section class="mobile-task-section" aria-labelledby="mobile-files-heading">
              <div class="mobile-task-section-title"><h2 id="mobile-files-heading">Dosyalar</h2><span>{{vm.streams.attachments.items.length}} / {{vm.streams.attachments.totalCount}}</span></div>
              <div class="mobile-task-file" ng-repeat="attachment in vm.streams.attachments.items track by attachment.id"><button type="button" ng-click="vm.download(attachment)"><i class="ion-document" aria-hidden="true"></i><span>{{attachment.fileName}}<small>{{attachment.contentType}}</small></span></button><button type="button" ng-if="vm.canUpload()" ng-click="vm.removeAttachment(attachment)" ng-disabled="shell.pwa.offline" aria-label="Dosyayı sil"><i class="ion-trash-a" aria-hidden="true"></i></button></div>
              <p class="mobile-task-empty" ng-if="!vm.streams.attachments.items.length">Dosya eklenmemiş.</p>
              <button class="mobile-task-more" type="button" ng-if="vm.streamHasMore('attachments')" ng-click="vm.loadMoreStream('attachments')">Daha fazla dosya</button>
              <div class="mobile-task-upload" ng-if="vm.canUpload()"><label><i class="ion-paperclip" aria-hidden="true"></i><span>{{vm.attachmentFile.name || 'Dosya seç'}}</span><input type="file" file-change="vm.attachmentFile = file" aria-label="Görev dosyası seç"></label><button type="button" aria-label="Dosya yükle" ng-click="vm.upload()" ng-disabled="!vm.attachmentFile || shell.pwa.offline || vm.actionBusy === 'upload'">Yükle</button></div>
            </section>

            <section class="mobile-task-section" aria-labelledby="mobile-relations-heading">
              <div class="mobile-task-section-title"><h2 id="mobile-relations-heading">İlişkiler</h2><span>{{vm.task.relations.length || 0}}</span></div>
              <div class="mobile-task-relation" ng-repeat="relation in vm.task.relations track by $index"><span><strong>{{relation.relationType}}</strong><small>{{vm.relationName(relation)}}</small></span><button type="button" ng-if="vm.canLink()" ng-click="vm.removeRelation(relation)" ng-disabled="shell.pwa.offline" aria-label="İlişkiyi kaldır"><i class="ion-close" aria-hidden="true"></i></button></div>
              <p class="mobile-task-empty" ng-if="!vm.task.relations.length">Bağlı görev yok.</p>
              <div class="mobile-task-relation-form" ng-if="vm.canLink()"><select ng-model="vm.relationDraft.relationType" aria-label="İlişki türü"><option>RelatesTo</option><option>Blocks</option><option>IsBlockedBy</option><option>Duplicates</option></select><select ng-model="vm.relationDraft.relatedWorkItemId" aria-label="İlişkili görev"><option value="">Görev seçin</option><option ng-repeat="candidate in vm.relationCandidates track by candidate.id" value="{{candidate.id}}">{{candidate.title}}</option></select><button type="button" ng-click="vm.addRelation()" ng-disabled="!vm.relationDraft.relatedWorkItemId || shell.pwa.offline">Bağla</button></div>
            </section>

            <section class="mobile-task-section" aria-labelledby="mobile-catalog-heading">
              <div class="mobile-task-section-title"><h2 id="mobile-catalog-heading">Proje bağlantıları</h2><span>{{vm.catalogLinks().length}}</span></div>
              <div class="mobile-task-catalog" ng-repeat="link in vm.catalogLinks() track by link.kind + link.id"><small>{{link.kind}}</small><strong>{{link.name}}</strong><span>{{link.meta}}</span></div>
              <p class="mobile-task-empty" ng-if="!vm.catalogLinks().length">Bağlantılı proje kaydı yok.</p>
            </section>
          </div>

          <div class="mobile-task-activity" ng-if="vm.detailView === 'activity'">
            <nav class="mobile-task-activity-tabs" aria-label="Etkinlik filtresi">
              <button type="button" ng-class="{'active': vm.activityTab === 'all'}" ng-click="vm.activityTab = 'all'">Tümü</button><button type="button" ng-class="{'active': vm.activityTab === 'comments'}" ng-click="vm.activityTab = 'comments'">Yorumlar</button><button type="button" ng-class="{'active': vm.activityTab === 'history'}" ng-click="vm.activityTab = 'history'">Geçmiş</button><button type="button" ng-class="{'active': vm.activityTab === 'worklogs'}" ng-click="vm.activityTab = 'worklogs'">Çalışma</button>
            </nav>

            <section class="mobile-task-section mobile-comment-composer" ng-if="vm.canComment()">
              <label><span>Yorum ekle</span><textarea ng-model="vm.commentBody" rows="4" maxlength="5000" placeholder="Ekiple paylaşın"></textarea></label>
              <div class="mobile-task-mentions" ng-if="vm.commentMentionIds.length"><button type="button" ng-repeat="userId in vm.commentMentionIds track by userId" ng-click="vm.removeCommentMention(userId)">@{{vm.userName(userId)}} <i class="ion-close" aria-hidden="true"></i></button></div>
              <div class="mobile-task-inline"><select ng-model="vm.commentMentionCandidate" aria-label="Yorumda bahsedilecek kişi"><option value="">Kişiden bahset</option><option ng-repeat="user in vm.commentMentionCandidates() track by user.id" value="{{user.id}}">{{vm.userName(user.id)}}</option></select><button type="button" ng-click="vm.addCommentMention()" ng-disabled="!vm.commentMentionCandidate" aria-label="Bahsetme ekle"><i class="ion-at" aria-hidden="true"></i></button></div>
              <button class="button button-positive button-block" type="button" ng-click="vm.addComment()" ng-disabled="!vm.commentBody.trim() || shell.pwa.offline">Yorumu gönder</button>
            </section>

            <section class="mobile-task-section mobile-activity-stream" aria-live="polite">
              <div class="mobile-activity-entry" ng-repeat="entry in vm.activityEntries() track by entry.id"><i class="ion-ios-pulse" aria-hidden="true"></i><div><strong>{{vm.activityLabel(entry.type || entry.action || entry.eventType)}}</strong><p ng-bind="entry.body || entry.note || entry.detail || entry.message || entry.description || 'Görev güncellendi.'"></p><small>{{vm.userName(entry.actorUserId || entry.userId || entry.authorUserId)}} · {{entry.createdAt || entry.occurredAt | date:'dd MMM HH:mm'}}</small></div></div>
              <p class="mobile-task-empty" ng-if="!vm.activityEntries().length">Bu filtrede etkinlik yok.</p>
              <button class="mobile-task-more" type="button" ng-if="vm.streamHasMore(vm.activityStreamName())" ng-click="vm.loadMoreStream(vm.activityStreamName())">Daha fazla etkinlik</button>
            </section>

            <section class="mobile-task-section" ng-if="vm.canLogWork() || vm.streams.worklogs.totalCount">
              <div class="mobile-task-section-title"><h2>Çalışma kayıtları</h2><span>{{vm.streams.worklogs.items.length}} / {{vm.streams.worklogs.totalCount}}</span></div>
              <div class="mobile-task-worklog" ng-repeat="log in vm.streams.worklogs.items track by log.id"><span>{{log.note || 'Not yok'}}</span><strong>{{log.hours}} sa</strong></div>
              <form class="mobile-task-worklog-form" ng-if="vm.canLogWork()" ng-submit="vm.addWorkLog()"><input type="number" min="0.25" step="0.25" ng-model="vm.workLogDraft.hours" placeholder="Saat" aria-label="Çalışma saati" required><input type="text" ng-model="vm.workLogDraft.note" placeholder="Not" aria-label="Çalışma notu"><button type="submit" ng-disabled="shell.pwa.offline">Ekle</button></form>
            </section>

            <section class="mobile-task-section" ng-if="vm.streams.approvals.totalCount">
              <div class="mobile-task-section-title"><h2>Onaylar</h2><span>{{vm.streams.approvals.items.length}} / {{vm.streams.approvals.totalCount}}</span></div>
              <label class="mobile-approval-note" ng-if="vm.canApprove()"><span>Karar notu</span><input type="text" ng-model="vm.approvalNote" maxlength="1000"></label>
              <div class="mobile-task-approval" ng-repeat="approval in vm.streams.approvals.items track by approval.id"><span><strong>{{approval.fromStatus}} → {{approval.toStatus}}</strong><small>{{approval.status}} · {{vm.userName(approval.requestedByUserId)}}</small></span><div ng-if="vm.canApprove() && approval.status === 'Pending'"><button type="button" ng-click="vm.decideApproval(approval, true)" ng-disabled="shell.pwa.offline" aria-label="Onayla"><i class="ion-checkmark" aria-hidden="true"></i></button><button type="button" ng-click="vm.decideApproval(approval, false)" ng-disabled="shell.pwa.offline" aria-label="Reddet"><i class="ion-close" aria-hidden="true"></i></button></div></div>
              <button class="mobile-task-more" type="button" ng-if="vm.streamHasMore('approvals')" ng-click="vm.loadMoreStream('approvals')">Daha fazla onay</button>
            </section>
          </div>
        </div>
      </ion-content>
    </ion-view>
  </script>

  <script id="templates/tabs.html" type="text/ng-template">
    <ion-tabs class="tabs-icon-top tabs-stable zumbo-primary-tabs" aria-label="Birincil gezinme">
      <ion-tab title="Ana sayfa" icon="ion-ios-home" href="#/app/dashboard">
        <ion-nav-view name="home"></ion-nav-view>
      </ion-tab>
      <ion-tab title="İşlerim" icon="ion-ios-checkmark" href="#/app/tasks">
        <ion-nav-view name="work"></ion-nav-view>
      </ion-tab>
      <ion-tab title="Oluştur" icon="ion-plus-round" href="#/app/create" class="zumbo-create-tab">
        <ion-nav-view name="create"></ion-nav-view>
      </ion-tab>
      <ion-tab title="Gelen kutusu" icon="ion-ios-bell" href="#/app/notifications">
        <ion-nav-view name="inbox"></ion-nav-view>

      <ion-tab title="Daha fazla" icon="ion-grid" href="#/app/more">
        <ion-nav-view name="more"></ion-nav-view>

  <script id="templates/dashboard.html" type="text/ng-template">
    <ion-view view-title="Ana sayfa">
      <ion-content class="workspace" delegate-handle="dashboardScroll">
        <ion-refresher pulling-text="Yenile" on-refresh="vm.refresh()"></ion-refresher>
        <div class="mobile-degraded-state" ng-if="vm.searchDegraded" role="status">Arama geçici olarak sınırlı. Görevler güvenli yedek görünümden gösteriliyor.</div>
        <nav class="mobile-home-actions" aria-label="Hızlı işlemler">
          <button type="button" ui-sref="app.projects"><i class="icon ion-folder" aria-hidden="true"></i><span>Projeler</span></button>
          <button type="button" ui-sref="app.search"><i class="icon ion-search" aria-hidden="true"></i><span>Ara</span></button>
          <button type="button" ui-sref="app.create"><i class="icon ion-plus-round" aria-hidden="true"></i><span>Oluştur</span></button>
        </nav>
        <section class="metric-band">
          <div>
            <strong>{{vm.summary.total || 0}}</strong>
            <span>Toplam</span>
          </div>
          <div>
            <strong>{{vm.summary.inProgress || 0}}</strong>
            <span>Aktif</span>
          </div>
          <div>
            <strong>{{vm.summary.done || 0}}</strong>
            <span>Tamam</span>
          </div>
          <div>
            <strong>{{vm.summary.overdue || 0}}</strong>
            <span>Geciken</span>
          </div>
        </section>
        <div class="segmented mobile-focus-segments" role="tablist" aria-label="Kişisel iş görünümü"><button role="tab" aria-selected="{{vm.mode==='assigned'}}" tabindex="{{vm.mode==='assigned' ? 0 : -1}}" ng-class="{active:vm.mode==='assigned'}" ng-click="vm.setMode('assigned')">Açık</button><button role="tab" aria-selected="{{vm.mode==='due'}}" tabindex="{{vm.mode==='due' ? 0 : -1}}" ng-class="{active:vm.mode==='due'}" ng-click="vm.setMode('due')">Tarihli</button><button role="tab" aria-selected="{{vm.mode==='blocked'}}" tabindex="{{vm.mode==='blocked' ? 0 : -1}}" ng-class="{active:vm.mode==='blocked'}" ng-click="vm.setMode('blocked')">Engelli</button><button role="tab" aria-selected="{{vm.mode==='recent'}}" tabindex="{{vm.mode==='recent' ? 0 : -1}}" ng-class="{active:vm.mode==='recent'}" ng-click="vm.setMode('recent')">Son</button></div>
        <div class="section-title">Kişisel işler</div>
        <ion-list>
          <ion-item class="task-row" ng-repeat="task in vm.visibleTasks()" ng-click="vm.openTask(task)">
            <h2>{{task.title}}</h2>
            <p>{{task.status}} · {{task.priority}}</p>
            <time ng-if="task.dueDate">{{task.dueDate | date:'dd MMM'}}</time>
            <span class="badge badge-balanced" ng-if="task.status === 'Done'">tamam</span>
          </ion-item>
          <ion-item ng-if="!vm.visibleTasks().length">Bu görünümde iş yok.</ion-item>
        </ion-list>
      </ion-content>
    </ion-view>
  </script>

  <script id="templates/create.html" type="text/ng-template">
    <ion-view view-title="Oluştur">
      <ion-content class="workspace mobile-shell-surface">
        <header class="mobile-shell-heading">
          <span>Yeni kayıt</span>
          <h2>Görev oluştur</h2>
          <p>İşi doğru bağlamda başlatmak için projeyi seçin.</p>
        </header>
        <div class="mobile-shell-offline" ng-if="shell.pwa.offline" role="status">
          <i class="icon ion-cloud" aria-hidden="true"></i>
          <span>Çevrimdışıyken oluşturma salt okunurdur.</span>
        </div>
        <div class="mobile-state" ng-if="vm.loading" aria-live="polite">Projeler yükleniyor...</div>
        <div class="mobile-state is-error" ng-if="vm.error" role="alert">
          <span>{{vm.error}}</span>
          <button type="button" class="button button-small button-clear" ng-click="vm.error = ''">Kapat</button>
        </div>
        <form class="mobile-create-entry" ng-if="!vm.loading && vm.projects.length" ng-submit="vm.continueToForm()">
          <label>
            <span>Proje</span>
            <select ng-model="vm.selectedProjectId" ng-options="project.id as (project.key + ' · ' + project.name) for project in vm.projects" required>
              <option value="">Proje seçin</option>
            </select>
          </label>
          <button type="submit" class="button button-block button-positive icon-right ion-arrow-right-c" ng-disabled="shell.pwa.offline">Görev ayrıntılarına geç</button>
        </form>
        <section class="mobile-shell-empty" ng-if="!vm.loading && !vm.projects.length && !vm.error">
          <i class="icon ion-folder" aria-hidden="true"></i>
          <h3>Kullanılabilir proje yok</h3>
          <p>Görev eklemeden önce erişebildiğiniz bir proje oluşturun.</p>
          <button type="button" class="button button-stable" ui-sref="app.projects">Projelere git</button>
        </section>
      </ion-content>
    </ion-view>
  </script>

  <script id="templates/more.html" type="text/ng-template">
    <ion-view view-title="Daha fazla">
      <ion-content class="workspace mobile-shell-surface">
        <header class="mobile-shell-heading mobile-more-heading">
          <span>{{shell.organizationName()}}</span>
          <h2>Daha fazla</h2>
          <p>{{vm.session.currentUser.displayName || vm.session.currentUser.username || 'Zumbo kullanıcısı'}}</p>
        </header>
        <nav class="mobile-more-nav" aria-label="İkincil gezinme">
          <button type="button" ui-sref="app.projects">
            <i class="icon ion-folder" aria-hidden="true"></i>
            <span><strong>Projeler ve ekipler</strong><small>Çalışma alanları, ekipler ve arşiv</small></span>
            <i class="icon ion-chevron-right" aria-hidden="true"></i>
          </button>
          <button type="button" ui-sref="app.search">
            <i class="icon ion-search" aria-hidden="true"></i>
            <span><strong>Arama</strong><small>Projelerde işe ulaşın</small></span>
            <i class="icon ion-chevron-right" aria-hidden="true"></i>
          </button>
          <button type="button" ui-sref="app.profile">
            <i class="icon ion-gear-a" aria-hidden="true"></i>
            <span><strong>Ayarlar</strong><small>Hesap, güvenlik ve yönetim</small></span>
            <i class="icon ion-chevron-right" aria-hidden="true"></i>
          </button>
        </nav>
      </ion-content>
    </ion-view>
  </script>

  <script id="templates/search.html" type="text/ng-template">
    <ion-view view-title="Arama">
      <ion-content class="workspace mobile-shell-surface">
        <label class="mobile-search-scope" ng-if="vm.projects.length">
          <span>Proje kapsamında ara</span>
          <select ng-model="vm.selectedProjectId" ng-change="vm.changeProject()" ng-options="project.id as (project.key + ' · ' + project.name) for project in vm.projects" aria-label="Arama projesi"></select>
        </label>
        <form class="mobile-global-search" ng-if="vm.selectedProjectId" ng-submit="vm.search()">
          <label>
            <span class="sr-only">İşlerde ara</span>
            <i class="icon ion-search" aria-hidden="true"></i>
            <input type="search" ng-model="vm.query" minlength="2" maxlength="120" placeholder="Başlık veya içerik ara" autocomplete="off" enterkeyhint="search">
            <button type="button" class="button button-icon ion-close-circled" ng-if="vm.query" ng-click="vm.clear()" aria-label="Aramayı temizle"></button>
          </label>
          <button type="submit" class="button button-positive" ng-disabled="vm.loading">Ara</button>
        </form>
        <div class="mobile-state" ng-if="vm.projectLoading" aria-live="polite">Arama kapsamı yükleniyor...</div>
        <div class="mobile-degraded-state" ng-if="vm.degraded" role="status">Arama geçici olarak sınırlı. Sonuçlar güvenli yedek görünümden gösteriliyor.</div>
        <div class="mobile-state" ng-if="vm.loading && !vm.items.length" aria-live="polite">Sonuçlar aranıyor...</div>
        <div class="mobile-state is-error" ng-if="vm.error" role="alert">
          <span>{{vm.error}}</span>
          <button type="button" class="button button-small button-clear" ng-click="vm.error = ''">Kapat</button>
        </div>
        <section class="mobile-search-results" ng-if="vm.items.length" aria-label="Arama sonuçları">
          <header><strong>{{vm.items.length}} sonuç</strong><span ng-if="vm.hasMore">Devamı var</span></header>
          <button type="button" ng-repeat="task in vm.items track by task.id" ng-click="vm.openTask(task)">
            <span><strong>{{task.title}}</strong><small>{{task.type}} · {{task.status}} · {{task.priority}}</small></span>
            <i class="icon ion-chevron-right" aria-hidden="true"></i>
          </button>
          <button type="button" class="mobile-search-more" ng-if="vm.hasMore" ng-click="vm.loadMore()" ng-disabled="vm.loading">Daha fazla sonuç</button>
        </section>
        <section class="mobile-shell-empty" ng-if="vm.searched && !vm.loading && !vm.items.length && !vm.error">
          <i class="icon ion-search" aria-hidden="true"></i>
          <h3>Sonuç bulunamadı</h3>
          <p>Farklı veya daha genel bir ifadeyle yeniden arayın.</p>
        </section>
        <section class="mobile-shell-empty" ng-if="!vm.projectLoading && !vm.projects.length && !vm.error">
          <i class="icon ion-folder" aria-hidden="true"></i>
          <h3>Aranabilir proje yok</h3>
          <p>Arama yapmadan önce erişebildiğiniz bir proje oluşturun.</p>
          <button type="button" class="button button-stable" ui-sref="app.projects">Projelere git</button>
        </section>
        <section class="mobile-search-prompt" ng-if="vm.selectedProjectId && !vm.searched && !vm.loading && !vm.error">
          <span>Proje araması</span>
          <p>Seçili projedeki görev başlığı ve içeriğinde en az iki karakterle arayın.</p>
        </section>
      </ion-content>
    </ion-view>
  </script>

  <script id="templates/projects.html" type="text/ng-template">
    <ion-view view-title="Projeler">
      <ion-content class="workspace">
        <div class="segmented workspace-segments"><button ng-class="{active: vm.mode === 'projects'}" ng-click="vm.setMode('projects')">Projeler</button><button ng-class="{active: vm.mode === 'teams'}" ng-click="vm.setMode('teams')">Ekipler</button><button ng-class="{active: vm.mode === 'archive'}" ng-click="vm.setMode('archive')">Arşiv</button></div>
        <div class="mobile-feedback success" role="status" aria-live="polite" ng-if="vm.notice">{{vm.notice}}</div>
        <div class="mobile-feedback error" role="alert" aria-live="assertive" ng-if="vm.error">{{vm.error}}</div>
        <section ng-if="vm.mode === 'projects'">
          <form class="mobile-manage-form compact" ng-submit="vm.createProject()"><label><span>Anahtar</span><input type="text" ng-model="vm.projectDraft.key" aria-label="Yeni mobil proje anahtarı" maxlength="12" required></label><label><span>Proje adı</span><input type="text" ng-model="vm.projectDraft.name" aria-label="Yeni mobil proje adı" required></label><button class="button button-small button-positive" type="submit" ng-disabled="vm.saving">Proje oluştur</button></form>
          <ion-list><ion-item ng-repeat="project in vm.projects track by project.id" ng-click="vm.select(project)">
            <h2>{{project.key}} · {{project.name}}</h2>
            <p>{{project.members.length}} üye · {{project.visibility}}</p>
            <i class="icon ion-chevron-right icon-accessory"></i>
          </ion-item><ion-item ng-if="!vm.projects.length">Henüz proje yok.</ion-item></ion-list>
        </section>
        <section ng-if="vm.mode === 'teams'">
          <form class="mobile-manage-form compact" ng-submit="vm.createTeam()"><label><span>Ekip adı</span><input type="text" ng-model="vm.teamDraft.name" aria-label="Yeni mobil ekip adı" required></label><button class="button button-small button-positive" type="submit" ng-disabled="vm.saving">Ekip oluştur</button></form>
          <ion-list><ion-item ng-repeat="team in vm.teams track by team.id" ng-click="vm.selectTeam(team)"><h2>{{team.name}}</h2><p>{{team.members.length}} üye ve davet</p><i class="icon ion-chevron-right icon-accessory"></i></ion-item><ion-item ng-if="!vm.teams.length">Henüz ekip yok.</ion-item></ion-list>
        </section>
        <section ng-if="vm.mode === 'archive'">
          <div class="item item-divider">Projeler</div><div class="mobile-archive-row" ng-repeat="project in vm.archivedProjects track by project.id"><span>{{project.key}} · {{project.name}}</span><button class="button button-small button-stable" ng-click="vm.restoreProject(project)">Geri yükle</button></div><div class="item item-text-wrap" ng-if="!vm.archivedProjects.length">Arşivlenmiş proje yok.</div>
          <div class="item item-divider">Ekipler</div><div class="mobile-archive-row" ng-repeat="team in vm.archivedTeams track by team.id"><span>{{team.name}}</span><button class="button button-small button-stable" ng-click="vm.restoreTeam(team)">Geri yükle</button></div><div class="item item-text-wrap" ng-if="!vm.archivedTeams.length">Arşivlenmiş ekip yok.</div>
        </section>
      </ion-content>
    </ion-view>
  </script>

  <script id="templates/create-task.html" type="text/ng-template">
    <div class="mobile-create-task">
      <p class="mobile-feedback error" role="alert" aria-live="assertive" ng-if="vm.createError">{{vm.createError}}</p>
      <label><span>Başlık</span><input type="text" ng-model="vm.createDraft.title" maxlength="200" required></label>
      <label><span>Tür</span><select ng-model="vm.createDraft.type" ng-change="vm.createDraft.customFieldValues = {}" ng-options="type.key as type.name for type in vm.schema.issueTypes | filter:{active:true}"></select></label>
      <label><span>Öncelik</span><select ng-model="vm.createDraft.priority"><option>Critical</option><option>High</option><option>Medium</option><option>Low</option></select></label>
      <label ng-repeat="field in vm.customFieldsFor(vm.createDraft.type) track by field.key" ng-switch="field.type">
        <span>{{field.name}}<b ng-if="field.required"> *</b></span>
        <input ng-switch-when="Text" type="text" ng-model="vm.createDraft.customFieldValues[field.key]" maxlength="{{field.maxLength}}">
        <input ng-switch-when="Number" type="number" ng-model="vm.createDraft.customFieldValues[field.key]" min="{{field.minimum}}" max="{{field.maximum}}" step="any">
        <select ng-switch-when="Boolean" ng-model="vm.createDraft.customFieldValues[field.key]"><option value="">Seçin</option><option ng-value="true">Evet</option><option ng-value="false">Hayır</option></select>
        <input ng-switch-when="Date" type="date" ng-model="vm.createDraft.customFieldValues[field.key]">
        <select ng-switch-when="Select" ng-model="vm.createDraft.customFieldValues[field.key]" ng-options="option for option in field.options"><option value="">Seçin</option></select>
      </label>
    </div>
  </script>

  <script id="templates/create-sprint.html" type="text/ng-template">
    <div class="mobile-sprint-form">
      <label><span>Ad</span><input type="text" ng-model="vm.sprintDraft.name" maxlength="100" autocomplete="off"></label>
      <label><span>Hedef</span><textarea ng-model="vm.sprintDraft.goal" maxlength="500" rows="2"></textarea></label>
      <div><label><span>Başlangıç</span><input type="date" ng-model="vm.sprintDraft.startDate"></label><label><span>Bitiş</span><input type="date" ng-model="vm.sprintDraft.endDate"></label></div>
      <p class="mobile-field-error" ng-if="vm.sprintDraftError" role="alert">{{vm.sprintDraftError}}</p>
    </div>
  </script>

  <script id="templates/complete-sprint.html" type="text/ng-template">
    <div class="mobile-sprint-form"><p>Tamamlanmayan işleri nereye taşıyacağınızı seçin.</p><label><span>Devir hedefi</span><select ng-model="vm.carryoverSprintId"><option value="">Backlog'a taşı</option><option ng-repeat="sprint in vm.carryoverTargets()" value="{{sprint.id}}">{{sprint.name}} sprintine taşı</option></select></label></div>
  </script>

  <script id="templates/tasks.html" type="text/ng-template">
    <ion-view view-title="İşlerim">
      <ion-nav-buttons side="right">
        <button class="button button-icon ion-plus" ng-click="vm.quickAdd()" aria-label="Görev oluştur"></button>
      </ion-nav-buttons>
      <ion-content class="workspace" delegate-handle="taskWorkScroll">
        <div class="mobile-state" ng-if="vm.loading" aria-live="polite">İşler yükleniyor...</div>
        <div class="mobile-state is-error" ng-if="vm.loadError" role="alert"><span>{{vm.loadError}}</span><button type="button" class="button button-small" ng-click="vm.load()">Yeniden dene</button></div>
        <section class="mobile-shell-empty" ng-if="!vm.loading && vm.projectMissing && !vm.loadError"><i class="icon ion-folder" aria-hidden="true"></i><h3>Çalışma projesi yok</h3><p>İşleri görüntülemek için erişebildiğiniz bir proje oluşturun.</p><button type="button" class="button button-stable" ui-sref="app.projects">Projelere git</button></section>
        <div class="mobile-degraded-state" ng-if="vm.searchDegraded" role="status">Arama geçici olarak sınırlı. Görevler güvenli yedek görünümden gösteriliyor.</div>
        <div class="segmented work-mode-segments" role="tablist" aria-label="Mobil iş görünümü" ng-keydown="vm.handleModeKey($event)">
          <button role="tab" aria-selected="{{vm.mode === 'my'}}" tabindex="{{vm.mode === 'my' ? 0 : -1}}" ng-class="{active: vm.mode === 'my'}" ng-click="vm.setMode('my')">Benim</button>
          <button role="tab" aria-selected="{{vm.mode === 'backlog'}}" tabindex="{{vm.mode === 'backlog' ? 0 : -1}}" ng-class="{active: vm.mode === 'backlog'}" ng-click="vm.setMode('backlog')">Backlog</button>
          <button role="tab" aria-selected="{{vm.mode === 'sprint'}}" tabindex="{{vm.mode === 'sprint' ? 0 : -1}}" ng-class="{active: vm.mode === 'sprint'}" ng-click="vm.setMode('sprint')">Sprint</button>
          <button role="tab" aria-selected="{{vm.mode === 'board'}}" tabindex="{{vm.mode === 'board' ? 0 : -1}}" ng-class="{active: vm.mode === 'board'}" ng-click="vm.setMode('board')">Pano</button>
          <button role="tab" aria-selected="{{vm.mode === 'list'}}" tabindex="{{vm.mode === 'list' ? 0 : -1}}" ng-class="{active: vm.mode === 'list'}" ng-click="vm.setMode('list')">Liste</button>
        </div>
        <div class="segmented" ng-if="vm.mode === 'my'">
          <button ng-class="{active: vm.status === ''}" ng-click="vm.filter('')">Tümü</button>
          <button ng-class="{active: vm.status === 'To Do'}" ng-click="vm.filter('To Do')">Yapılacak</button>
          <button ng-class="{active: vm.status === 'In Progress'}" ng-click="vm.filter('In Progress')">Aktif</button>
          <button ng-class="{active: vm.status === 'Done'}" ng-click="vm.filter('Done')">Tamam</button>
        </div>
        <section class="mobile-planning" ng-if="vm.mode === 'backlog'">
          <div class="mobile-feedback error" ng-if="vm.planningError" role="alert" aria-live="assertive">{{vm.planningError}}</div>
          <div class="mobile-feedback success" ng-if="vm.planningSuccess" role="status">{{vm.planningSuccess}}</div>
          <header class="mobile-planning-head"><div><strong>Backlog</strong><small>{{vm.backlogItems.length}} iş<span ng-if="vm.backlogNextCursor"> · devamı var</span></small></div><button class="button button-small button-clear icon-left ion-plus" ng-if="vm.canEditTasks()" ng-click="vm.openCreateSprint()" ng-disabled="vm.planningBusy">Sprint</button></header>
          <label class="item item-input item-select mobile-sprint-select"><span class="input-label">Hedef sprint</span><select ng-model="vm.selectedSprintId" ng-change="vm.selectSprint()" aria-label="Backlog hedef sprinti" ng-options="sprint.id as (sprint.name + ' · ' + sprint.status) for sprint in vm.sprints"><option value="">Sprint seçin</option></select></label>
          <div class="mobile-sprint-brief" ng-if="vm.selectedSprint()"><strong>{{vm.selectedSprint().goal || 'Hedef belirtilmedi'}}</strong><small>{{vm.selectedSprint().startDate | date:'dd.MM'}} - {{vm.selectedSprint().endDate | date:'dd.MM'}} · {{vm.selectedSprint().status}}</small></div>
          <div class="mobile-planning-list"><article class="mobile-planning-row" ng-repeat="task in vm.backlogItems track by task.id"><button class="mobile-task-main" ng-click="vm.openTask(task)"><strong>{{task.title}}</strong><small>{{task.type}} · {{task.priority}} · {{task.estimatePoints}} puan</small></button><button class="button button-small mobile-plan-button" ng-if="vm.canEditTasks() && vm.selectedSprint().status === 'Planned'" ng-click="vm.planBacklogItem(task)" ng-disabled="vm.planningBusy" aria-label="{{task.title}} işini sprint kapsamına al"><i class="icon ion-arrow-right-c" aria-hidden="true"></i></button></article><p class="mobile-planning-empty" ng-if="!vm.backlogItems.length">Backlog boş.</p></div>
          <button class="button button-block button-stable" ng-if="vm.backlogNextCursor" ng-click="vm.loadMoreBacklog()" ng-disabled="vm.planningBusy">Daha fazla iş yükle</button>
        </section>
        <section ng-if="vm.mode === 'sprint'">
          <div class="mobile-feedback error" ng-if="vm.planningError" role="alert" aria-live="assertive">{{vm.planningError}}</div>
          <header class="mobile-planning-head"><div><strong>Sprint</strong><small>{{vm.sprintItems.length}} iş · {{vm.planningPoints()}} puan</small></div><button class="button button-small button-clear icon-left ion-plus" ng-if="vm.canEditTasks()" ng-click="vm.openCreateSprint()" ng-disabled="vm.planningBusy">Yeni</button></header>
          <label class="item item-input item-select mobile-sprint-select"><span class="input-label">Sprint</span><select ng-model="vm.selectedSprintId" ng-change="vm.selectSprint()" aria-label="Mobil sprint" ng-options="sprint.id as (sprint.name + ' · ' + sprint.status) for sprint in vm.sprints"><option value="">Sprint seçin</option></select></label>
          <div class="mobile-sprint-summary" ng-if="vm.selectedSprint()"><div><span>Hedef</span><strong>{{vm.selectedSprint().goal || 'Hedef belirtilmedi'}}</strong></div><div><span>Dönem</span><strong>{{vm.selectedSprint().startDate | date:'dd.MM'}} - {{vm.selectedSprint().endDate | date:'dd.MM'}}</strong></div><div><span>Taahhüt</span><strong>{{vm.selectedSprint().committedPoints}} puan</strong></div><div><span>Tamamlanan</span><strong>{{vm.selectedSprint().completedPoints}} puan</strong></div></div>
          <div class="mobile-sprint-actions" ng-if="vm.canEditTasks() && vm.selectedSprint()"><button class="button button-small button-positive icon-left ion-play" ng-if="vm.selectedSprint().status === 'Planned'" ng-click="vm.startSprint()" ng-disabled="vm.planningBusy">Başlat</button><button class="button button-small button-positive icon-left ion-checkmark" ng-if="vm.selectedSprint().status === 'Active'" ng-click="vm.completeSprint()" ng-disabled="vm.planningBusy">Tamamla</button></div>
          <div class="mobile-burndown" ng-if="vm.burndown.length"><span>Burndown</span><strong>{{vm.burndown[vm.burndown.length - 1].remainingPoints}} puan kaldı</strong><small>{{vm.burndown.length}} güncel nokta</small></div>
          <div class="mobile-planning-list"><article class="mobile-planning-row" ng-repeat="task in vm.sprintItems track by task.id"><button class="mobile-task-main" ng-click="vm.openTask(task)"><strong>{{task.title}}</strong><small>{{task.status}} · {{task.priority}} · {{task.estimatePoints}} puan</small></button><button class="button button-small mobile-plan-button" ng-if="vm.canEditTasks() && vm.selectedSprint().status === 'Planned'" ng-click="vm.unplanSprintItem(task)" ng-disabled="vm.planningBusy" aria-label="{{task.title}} işini backlog alanına taşı"><i class="icon ion-arrow-left-c" aria-hidden="true"></i></button></article><p class="mobile-planning-empty" ng-if="!vm.sprintItems.length">Bu sprintte iş yok.</p></div>
        </section>
        <section ng-if="vm.mode === 'board'">
          <label class="item item-input item-select"><span class="input-label">Pano</span><select ng-model="vm.selectedBoardId" ng-change="vm.selectBoard()" aria-label="Mobil pano" ng-options="board.id as board.name for board in vm.boards"></select></label>
          <div class="mobile-feedback error" ng-if="vm.moveError" role="alert" aria-live="assertive">{{vm.moveError}}</div>
          <div class="mobile-board-lane" ng-repeat="lane in vm.boardLanes track by lane.id" data-wip-state="{{lane.wipLimit && lane.tasks.length >= lane.wipLimit ? 'full' : 'open'}}"><h3>{{lane.name}} <span>{{lane.tasks.length}}<b ng-if="lane.wipLimit"> / {{lane.wipLimit}}</b></span></h3><article class="mobile-board-task" ng-repeat="task in lane.tasks track by task.id" ng-class="{pending: vm.movingTaskId === task.id}"><button class="mobile-task-main" ng-click="vm.openTask(task)"><strong>{{task.title}}</strong><small>{{task.priority}} · {{task.estimatePoints == null ? 'efor yok' : task.estimatePoints + ' puan'}}</small></button><div class="mobile-task-move" ng-if="vm.canEditTasks()"><button class="button button-small button-clear ion-arrow-left-c" ng-click="vm.moveTask(task, -1)" ng-disabled="!vm.canMoveTask(task, -1)" aria-label="{{task.title}} görevini önceki kolona taşı"></button><button class="button button-small button-clear ion-arrow-right-c" ng-click="vm.moveTask(task, 1)" ng-disabled="!vm.canMoveTask(task, 1)" aria-label="{{task.title}} görevini sonraki kolona taşı"></button></div></article><p ng-if="!lane.tasks.length">Boş</p></div>
        </section>
        <ion-list ng-if="vm.mode === 'my' || vm.mode === 'list'">
          <ion-item class="task-row" collection-repeat="task in vm.tasks" item-height="58px" item-width="100%" ng-click="vm.openTask(task)">
            <h2>{{task.title}}</h2>
            <p>{{task.type}} · {{task.status}} · {{task.priority}}</p>
          </ion-item>
        </ion-list>
        <ion-infinite-scroll ng-if="vm.mode === 'my' && vm.hasMore" on-infinite="vm.loadMore()" distance="10%"></ion-infinite-scroll>
      </ion-content>
    </ion-view>
  </script>

  <script id="templates/notifications.html" type="text/ng-template">
    <ion-view view-title="Gelen kutusu">
      <ion-content class="workspace">
        <ion-refresher pulling-text="Gelen kutusunu yenile" on-refresh="vm.refresh()"></ion-refresher>
        <div class="mobile-state" ng-if="vm.loading" aria-live="polite">Bildirimler yükleniyor...</div>
        <div class="mobile-state is-error" ng-if="vm.error" role="alert"><span>{{vm.error}}</span><button type="button" class="button button-small" ng-click="vm.load()">Yeniden dene</button></div>
        <div class="segmented mobile-inbox-segments" role="tablist" aria-label="Bildirim filtresi"><button role="tab" aria-selected="{{vm.mode==='unread'}}" tabindex="{{vm.mode==='unread' ? 0 : -1}}" ng-class="{active:vm.mode==='unread'}" ng-click="vm.setMode('unread')">Okunmamış</button><button role="tab" aria-selected="{{vm.mode==='actions'}}" tabindex="{{vm.mode==='actions' ? 0 : -1}}" ng-class="{active:vm.mode==='actions'}" ng-click="vm.setMode('actions')">Eylem</button><button role="tab" aria-selected="{{vm.mode==='all'}}" tabindex="{{vm.mode==='all' ? 0 : -1}}" ng-class="{active:vm.mode==='all'}" ng-click="vm.setMode('all')">Tümü</button></div>
        <ion-list>
          <ion-item ng-repeat="notification in vm.visibleNotifications()" ng-click="vm.read(notification)" role="button" tabindex="0" ng-keydown="$event.key === 'Enter' && vm.read(notification)" ng-attr-aria-busy="{{notification.reading ? 'true' : 'false'}}">
            <h2>{{notification.type}}</h2>
            <p>{{notification.message}}</p>
            <small>{{notification.createdAt | date:'dd MMM HH:mm'}}</small>
            <span class="badge badge-assertive" ng-if="!notification.read">yeni</span>
          </ion-item>
          <ion-item ng-if="!vm.loading && !vm.visibleNotifications().length">Bu filtrede bildirim yok.</ion-item>
        </ion-list>
      </ion-content>
    </ion-view>
  </script>

  <script id="templates/profile.html" type="text/ng-template">
    <ion-view view-title="Ayarlar">
      <ion-content class="workspace profile security-profile">
        <ion-refresher pulling-text="Güvenliği yenile" on-refresh="vm.load()"></ion-refresher>
        <header class="mobile-profile-heading">
          <img src="../shared/zumbo-mark.svg" alt="">
          <div><h2>{{shell.session.currentUser.username}}</h2><p>{{shell.session.currentUser.email}}</p><small>{{shell.organizationName()}}</small></div>
          <button class="button button-clear icon ion-ios-moon-outline" ng-click="shell.toggleTheme()" aria-label="Temayı değiştir"></button>
        </header>

        <div class="mobile-state" ng-if="vm.loading">Güvenlik bilgileri yükleniyor...</div>
        <div class="mobile-state is-error" ng-if="vm.error" role="alert"><span>{{vm.error}}</span><button class="button button-small" ng-click="vm.load()">Yeniden dene</button></div>

        <div ng-if="!vm.loading">
          <section class="mobile-settings-band mobile-integration-entry" ng-if="vm.canManageIntegrations()">
            <header><div><h3>Entegrasyonlar</h3><p>Webhook uç noktalarını ve teslimat sağlığını yönet</p></div><i class="icon ion-merge" aria-hidden="true"></i></header>
            <button class="button button-stable button-block icon-left ion-arrow-right-c" ui-sref="integration-center">Webhook yönetimini aç</button>
          </section>

          <section class="mobile-settings-band mobile-integration-entry" ng-if="vm.canManageOperations()">
            <header><div><h3>Operasyonlar</h3><p>Hizmet sağlığını ve kurtarma kuyruklarını incele</p></div><i class="icon ion-ios-pulse-strong" aria-hidden="true"></i></header>
            <button class="button button-stable button-block icon-left ion-arrow-right-c" ui-sref="operations-center">Operasyon merkezini aç</button>
          </section>

          <section class="mobile-settings-band">
            <header><div><h3>Bildirim tercihleri</h3><p>Kanalları ve sessize alınan türleri yönet</p></div><i class="icon ion-ios-bell-outline" aria-hidden="true"></i></header>
            <ion-toggle ng-model="vm.preferences.inAppEnabled">Uygulama içi bildirim</ion-toggle>
            <ion-toggle ng-model="vm.preferences.emailEnabled">E-posta bildirimi</ion-toggle>
            <label class="item item-input"><span class="input-label">Sessiz türler</span><input ng-model="vm.mutedTypesText" placeholder="Assignment, Mention" aria-label="Sessize alınan bildirim türleri"></label>
            <button class="button button-positive button-block icon-left ion-checkmark" ng-click="vm.savePreferences()" ng-disabled="vm.busy || shell.pwa.offline">Tercihleri kaydet</button>
          </section>

          <section class="mobile-settings-band">
            <header><div><h3>İki adımlı doğrulama</h3><p>{{vm.mfaStatus.enabled ? 'Etkin · ' + vm.mfaStatus.remainingRecoveryCodes + ' kurtarma kodu' : 'Devre dışı'}}</p></div><span class="mobile-status" ng-class="{active: vm.mfaStatus.enabled}">{{vm.mfaStatus.enabled ? 'Etkin' : 'Kapalı'}}</span></header>
            <div ng-if="!vm.mfaStatus.enabled">
              <label class="item item-input"><span class="input-label">Parola</span><input type="password" autocomplete="current-password" ng-model="vm.mfaDraft.password" aria-label="MFA kurulum parolası"></label>
              <button class="button button-stable button-block icon-left ion-locked" ng-click="vm.beginMfaSetup()" ng-disabled="vm.busy || shell.pwa.offline">Kurulumu başlat</button>
            </div>
            <div class="mobile-secret" ng-if="vm.mfaSetup">
              <strong>Doğrulayıcı sırrı</strong><code>{{vm.mfaSetup.secret}}</code><p>Bu sır yalnız kurulum sırasında gösterilir.</p>
              <label class="item item-input"><span class="input-label">Kod</span><input inputmode="numeric" ng-model="vm.mfaDraft.code" aria-label="MFA doğrulama kodu"></label>
              <button class="button button-positive button-block" ng-click="vm.confirmMfaSetup()" ng-disabled="vm.busy">Etkinleştir</button>
            </div>
            <div ng-if="vm.mfaStatus.enabled">
              <div class="mobile-security-form">
                <label class="item item-input"><span class="input-label">Parola</span><input type="password" autocomplete="current-password" ng-model="vm.recoveryDraft.password" aria-label="Kurtarma kodu yenileme parolası"></label>
                <label class="item item-input"><span class="input-label">Kod</span><input ng-model="vm.recoveryDraft.code" aria-label="Kurtarma kodu yenileme doğrulaması"></label>
                <button class="button button-stable button-block icon-left ion-loop" ng-click="vm.regenerateRecoveryCodes()" ng-disabled="vm.busy || shell.pwa.offline">Kurtarma kodlarını yenile</button>
              </div>
              <div class="mobile-secret" ng-if="vm.recoveryCodes.length">
                <div class="mobile-secret-heading"><strong>Yeni kurtarma kodları</strong><button class="button button-clear icon ion-close" ng-click="vm.dismissRecoveryCodes()" aria-label="Kurtarma kodlarını kapat"></button></div>
                <code ng-repeat="code in vm.recoveryCodes track by code">{{code}}</code>
                <button class="button button-small button-stable icon-left ion-clipboard" ng-click="vm.copyRecoveryCodes()">Tümünü kopyala</button>
                <p>Bu liste kapatıldıktan sonra yeniden gösterilmez.</p>
              </div>
              <div class="mobile-security-form">
                <label class="item item-input"><span class="input-label">Parola</span><input type="password" autocomplete="current-password" ng-model="vm.mfaDraft.password" aria-label="MFA kapatma parolası"></label>
                <label class="item item-input"><span class="input-label">Kod</span><input ng-model="vm.mfaDraft.code" aria-label="MFA kapatma doğrulaması"></label>
                <button class="button button-assertive button-outline button-block" ng-click="vm.disableMfa()" ng-disabled="vm.busy || shell.pwa.offline">İki adımlı doğrulamayı kapat</button>
              </div>
            </div>
          </section>

          <section class="mobile-settings-band">
            <header><div><h3>Aktif oturumlar</h3><p>Yalnız seçtiğin cihazın erişimini kapat</p></div><i class="icon ion-monitor" aria-hidden="true"></i></header>
            <div class="mobile-session-row" ng-repeat="session in vm.visibleSessions() track by session.id" ng-class="{current: session.isCurrent, inactive: !vm.sessionIsActive(session)}">
              <i class="icon ion-iphone" aria-hidden="true"></i>
              <div><strong>{{session.deviceName || 'Bilinmeyen cihaz'}}</strong><span>{{session.isCurrent ? 'Bu cihaz' : (session.revokedAt ? 'Kapatıldı' : 'Diğer cihaz')}}</span><small>Son kullanım {{session.lastSeenAt | date:'dd.MM.yyyy HH:mm'}}</small></div>
              <button class="button button-small" ng-if="vm.sessionIsActive(session)" ng-class="session.isCurrent ? 'button-assertive button-outline' : 'button-stable'" ng-click="vm.revokeSession(session)" ng-disabled="vm.busy || shell.pwa.offline" aria-label="{{session.isCurrent ? 'Bu cihaz oturumunu kapat' : 'Seçilen cihaz oturumunu kapat'}}"><i class="icon ion-log-out" aria-hidden="true"></i></button>
              <span class="mobile-status" ng-if="!vm.sessionIsActive(session)" aria-label="Oturum kapalı"><i class="icon ion-checkmark-circled" aria-hidden="true"></i></span>
            </div>
            <div class="mobile-state compact" ng-if="!vm.sessions.length">Gösterilecek oturum yok.</div>
          </section>

          <section class="mobile-settings-band mobile-privacy-band">
            <header><div><h3>Gizlilik ve hesap</h3><p>Verilerini aktar veya hesabını kalıcı olarak anonimleştir</p></div><i class="icon ion-ios-locked-outline" aria-hidden="true"></i></header>
            <button class="button button-stable button-block icon-left ion-archive" ng-click="vm.exportPrivacyData()" ng-disabled="vm.privacyBusy || shell.pwa.offline">Verilerimi NDJSON olarak aktar</button>
            <div class="mobile-privacy-error" ng-if="vm.privacyError" role="alert"><i class="icon ion-alert-circled" aria-hidden="true"></i><span>{{vm.privacyError}}</span></div>

            <div class="mobile-privacy-form" ng-if="!vm.privacyWorkflow">
              <p>Anonimleştirme hesap erişimini kapatır ve geri alınamaz. Devam etmek için parolanı ve tam onay ifadesini gir.</p>
              <label class="item item-input"><span class="input-label">Parola</span><input type="password" autocomplete="current-password" ng-model="vm.privacyDraft.password" aria-label="Anonimleştirme parolası"></label>
              <label class="item item-input"><span class="input-label">Onay</span><input ng-model="vm.privacyDraft.confirmation" placeholder="ANONYMIZE" aria-label="Anonimleştirme onayı"></label>
              <button class="button button-assertive button-outline button-block icon-left ion-person-stalker" ng-click="vm.anonymizeAccount()" ng-disabled="vm.privacyBusy || shell.pwa.offline || vm.privacyDraft.confirmation !== 'ANONYMIZE'">Hesabı anonimleştir</button>
            </div>

            <div class="mobile-privacy-workflow" ng-if="vm.privacyWorkflow">
              <div class="mobile-privacy-workflow-heading">
                <span class="mobile-privacy-state" ng-class="{failed: vm.privacyWorkflow.state === 'Failed', complete: vm.privacyTerminal(vm.privacyWorkflow)}"><i class="icon" ng-class="vm.privacyWorkflow.state === 'Failed' ? 'ion-alert-circled' : (vm.privacyTerminal(vm.privacyWorkflow) ? 'ion-checkmark-circled' : 'ion-load-c')" aria-hidden="true"></i></span>
                <div><strong>{{vm.privacyStateLabel(vm.privacyWorkflow.state)}}</strong><small>Anonimleştirme işi · {{vm.privacyWorkflow.updatedAt | date:'dd.MM.yyyy HH:mm'}}</small></div>
                <b>{{vm.privacyProgress(vm.privacyWorkflow)}}%</b>
              </div>
              <div class="mobile-progress-track" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="{{vm.privacyProgress(vm.privacyWorkflow)}}"><span ng-style="{width: vm.privacyProgress(vm.privacyWorkflow) + '%'}"></span></div>
              <p class="mobile-privacy-safe-error" ng-if="vm.privacyWorkflow.lastError">{{vm.privacyWorkflow.lastError}}</p>
              <small class="mobile-privacy-expiry" ng-if="vm.privacyWorkflow.expiresAt">Durum kaydı {{vm.privacyWorkflow.expiresAt | date:'dd.MM.yyyy HH:mm'}} tarihinde sona erer.</small>
              <div class="mobile-privacy-actions">
                <button class="button button-stable button-small icon-left ion-loop" ng-if="vm.privacyCanRetry(vm.privacyWorkflow)" ng-click="vm.retryPrivacyWorkflow()" ng-disabled="vm.privacyBusy || shell.pwa.offline">Yeniden dene</button>
                <button class="button button-stable button-small icon-left ion-shuffle" ng-if="vm.privacyCanReconcile(vm.privacyWorkflow)" ng-click="vm.reconcilePrivacyWorkflow()" ng-disabled="vm.privacyBusy || shell.pwa.offline">Uzlaştır</button>
                <button class="button button-clear button-small icon-left ion-close" ng-if="vm.privacyTerminal(vm.privacyWorkflow)" ng-click="vm.dismissPrivacyWorkflow()" aria-label="Gizlilik işi durumunu kapat">Kapat</button>
              </div>
            </div>
          </section>

          <button class="button button-stable button-block icon-left ion-log-out" ng-click="shell.logout()">Çıkış yap</button>
        </div>
      </ion-content>
    </ion-view>
  </script>

  <script id="templates/integration-center.html" type="text/ng-template">
    <ion-view view-title="Entegrasyonlar">
      <ion-nav-buttons side="left">
        <button class="button button-clear icon ion-chevron-left" ng-click="vm.back()" aria-label="Geri"></button>
      </ion-nav-buttons>
      <ion-content class="workspace mobile-integration-center">
        <ion-refresher pulling-text="Entegrasyonları yenile" on-refresh="vm.load()" ng-if="vm.view === 'list'"></ion-refresher>

        <header class="mobile-integration-heading">
          <div><span>Kurumsal olay akışı</span><h2>{{vm.view === 'editor' ? (vm.editorMode === 'create' ? 'Yeni webhook' : 'Webhook düzenle') : (vm.view === 'detail' && vm.selected ? vm.selected.name : 'Webhook yönetimi')}}</h2></div>
          <button class="button button-positive icon ion-plus" ng-if="vm.view === 'list' && !vm.forbidden" ng-click="vm.newSubscription()" ng-disabled="shell.pwa.offline" aria-label="Webhook ekle"></button>
        </header>

        <div class="mobile-integration-offline" ng-if="shell.pwa.offline"><i class="icon ion-cloud" aria-hidden="true"></i><span>Çevrimdışıyken kayıtlar salt okunur.</span></div>
        <div class="mobile-state" ng-if="vm.loading">Entegrasyonlar yükleniyor...</div>
        <div class="mobile-state is-error" ng-if="vm.error" role="alert"><span>{{vm.error}}</span><button class="button button-small" ng-click="vm.error = ''">Kapat</button></div>
        <div class="mobile-state is-error" ng-if="vm.forbidden"><span>Bu alan için Entegrasyon Yönetimi izni gereklidir.</span><button class="button button-small" ui-sref="app.profile">Profile dön</button></div>

        <div ng-if="!vm.loading && !vm.forbidden">
          <dl class="mobile-integration-metrics" ng-if="vm.view === 'list' && vm.metrics">
            <div><dt>Sırada</dt><dd>{{vm.metrics.pending}}</dd></div>
            <div><dt>Teslim</dt><dd>{{vm.metrics.delivered}}</dd></div>
            <div ng-class="{attention: vm.metrics.deadLetter}"><dt>Müdahale</dt><dd>{{vm.metrics.deadLetter}}</dd></div>
          </dl>

          <section class="mobile-integration-list" ng-if="vm.view === 'list'">
            <button class="mobile-webhook-row" ng-repeat="subscription in vm.subscriptions track by subscription.id" ng-click="vm.select(subscription)">
              <span class="mobile-webhook-state" ng-class="{active: subscription.isActive}" aria-hidden="true"></span>
              <span><strong>{{subscription.name}}</strong><small>{{vm.targetLabel(subscription.targetUrl)}}</small><em>{{subscription.eventScopes.length}} olay · sır v{{subscription.secretVersion}}</em></span>
              <i class="icon ion-chevron-right" aria-hidden="true"></i>
            </button>
            <div class="mobile-integration-empty" ng-if="!vm.subscriptions.length"><i class="icon ion-merge" aria-hidden="true"></i><strong>Henüz webhook yok</strong><span>İlk kurumsal olay akışını oluştur.</span><button class="button button-positive button-small" ng-click="vm.newSubscription()" ng-disabled="shell.pwa.offline">Webhook ekle</button></div>
          </section>

          <form class="mobile-webhook-editor" ng-if="vm.view === 'editor'" ng-submit="vm.save()">
            <p>Yalnız gerekli olayları seç; hedef güvenlik denetiminden geçirilecektir.</p>
            <label class="item item-input item-stacked-label"><span class="input-label">Ad</span><input ng-model="vm.draft.name" maxlength="100" placeholder="Üretim iş akışı" required></label>
            <label class="item item-input item-stacked-label"><span class="input-label">HTTPS uç noktası</span><input type="url" ng-model="vm.draft.targetUrl" maxlength="2048" placeholder="https://hooks.example.com/zumbo" required></label>
            <fieldset><legend>Olaylar</legend><ion-checkbox ng-repeat="scope in vm.scopes track by scope.value" ng-checked="vm.scopeSelected(scope.value)" ng-click="vm.toggleScope(scope.value)">{{scope.label}}</ion-checkbox></fieldset>
            <div class="mobile-webhook-editor-actions"><button type="button" class="button button-stable" ng-click="vm.cancelEditor()">Vazgeç</button><button type="submit" class="button button-positive icon-left ion-checkmark" ng-disabled="vm.busy || shell.pwa.offline">{{vm.busy === 'save' ? 'Kaydediliyor…' : 'Kaydet'}}</button></div>
          </form>

          <section class="mobile-webhook-detail" ng-if="vm.view === 'detail' && vm.selected">
            <div class="mobile-webhook-secret" ng-if="vm.secretReceipt" role="status">
              <div><strong>Bu sır yalnız şimdi gösterilir</strong><button class="button button-clear icon ion-close" ng-click="vm.dismissSecret()" aria-label="Sırrı kapat"></button></div>
              <p>Alıcı imza doğrulamasına ekledikten sonra kapat.</p><code>{{vm.secretReceipt.secret}}</code><small>Parmak izi {{vm.secretReceipt.fingerprint}} · sürüm {{vm.secretReceipt.version}}</small>
              <button class="button button-small button-stable icon-left ion-clipboard" ng-click="vm.copySecret()">Kopyala</button>
            </div>

            <header><div><span class="mobile-webhook-status" ng-class="{active: vm.selected.isActive}">{{vm.selected.isActive ? 'Etkin' : 'Durduruldu'}}</span><p>{{vm.targetLabel(vm.selected.targetUrl)}}</p></div><button class="button button-clear icon ion-edit" ng-click="vm.editSubscription()" ng-disabled="shell.pwa.offline" aria-label="Webhook düzenle"></button></header>
            <div class="mobile-webhook-scopes"><span ng-repeat="scope in vm.selected.eventScopes track by scope">{{vm.scopeLabel(scope)}}</span></div>
            <dl><div><dt>Parmak izi</dt><dd>{{vm.selected.secretFingerprint}}</dd></div><div><dt>Sürüm</dt><dd>v{{vm.selected.secretVersion}}</dd></div><div><dt>Güncellendi</dt><dd>{{vm.selected.updatedAtUtc | date:'dd.MM HH:mm'}}</dd></div></dl>
            <div class="mobile-webhook-actions">
              <button class="button button-stable icon-left ion-paper-airplane" ng-click="vm.sendTest()" ng-disabled="!vm.selected.isActive || vm.busy || shell.pwa.offline">Test gönder</button>
              <button class="button button-stable icon-left ion-key" ng-click="vm.rotateSecret()" ng-disabled="vm.busy || shell.pwa.offline">Sırrı döndür</button>
              <button class="button button-outline icon-left" ng-class="vm.selected.isActive ? 'button-assertive ion-pause' : 'button-balanced ion-play'" ng-click="vm.setActive(!vm.selected.isActive)" ng-disabled="vm.busy || shell.pwa.offline">{{vm.selected.isActive ? 'Durdur' : 'Etkinleştir'}}</button>
            </div>

            <section class="mobile-delivery-register">
              <header><div><h3>Son teslimatlar</h3><p>Yük yerine güvenli özet ve sonuç gösterilir.</p></div><button class="button button-clear icon ion-loop" ng-click="vm.loadDeliveries(true)" aria-label="Teslimatları yenile"></button></header>
              <article class="mobile-delivery-row" ng-repeat="delivery in vm.deliveries track by delivery.id">
                <span class="mobile-delivery-state" data-tone="{{vm.deliveryState(delivery).tone}}"><i class="icon" ng-class="delivery.status === 'Delivered' ? 'ion-checkmark' : (delivery.status === 'DeadLetter' ? 'ion-alert' : 'ion-clock')" aria-hidden="true"></i></span>
                <div><strong>{{vm.deliveryState(delivery).label}}</strong><span>{{vm.scopeLabel(delivery.eventScope)}} · {{delivery.createdAtUtc | date:'dd.MM HH:mm'}}</span><small>SHA {{vm.shortHash(delivery.payloadSha256)}} · {{delivery.attempts}} deneme</small><p ng-if="delivery.lastErrorCode">{{vm.safeError(delivery.lastErrorCode)}}</p></div>
                <button class="button button-clear icon ion-loop" ng-if="vm.canReplay(delivery)" ng-click="vm.replay(delivery)" ng-disabled="vm.busy || shell.pwa.offline" aria-label="Teslimatı yeniden sırala"></button>
              </article>
              <div class="mobile-integration-empty compact" ng-if="!vm.deliveries.length"><span>Bu uç nokta için teslimat yok.</span></div>
              <button class="button button-stable button-small button-block" ng-if="vm.nextCursor" ng-click="vm.loadDeliveries(false)">Daha fazla göster</button>
            </section>
          </section>
        </div>
      </ion-content>
    </ion-view>
  </script>

  <script id="templates/operations-center.html" type="text/ng-template">
    <ion-view view-title="Operasyonlar">
      <ion-nav-buttons side="left"><button class="button button-clear icon ion-chevron-left" ng-click="vm.back()" aria-label="Geri"></button></ion-nav-buttons>
      <ion-content class="workspace mobile-operations-center">
        <ion-refresher pulling-text="Operasyonları yenile" on-refresh="vm.load()" ng-if="!vm.forbidden"></ion-refresher>
        <header class="mobile-operations-heading"><div><span>Sistem görünürlüğü</span><h2>Operasyon merkezi</h2></div><b class="mobile-operations-state" data-tone="{{vm.overallState().tone}}">{{vm.overallState().label}}</b></header>
        <div class="mobile-operations-offline" ng-if="shell.pwa.offline"><i class="icon ion-cloud" aria-hidden="true"></i><span>Çevrimdışıyken kurtarma eylemleri devre dışıdır.</span></div>
        <div class="mobile-state" ng-if="vm.loading">Operasyon durumu yükleniyor...</div>
        <div class="mobile-state is-error" ng-if="vm.error" role="alert"><span>{{vm.error}}</span><button class="button button-small" ng-click="vm.error = ''">Kapat</button></div>
        <div class="mobile-state is-error" ng-if="vm.forbidden"><span>Bu alan için sistem operasyonu izni gereklidir.</span><button class="button button-small" ui-sref="app.profile">Profile dön</button></div>

        <div ng-if="!vm.loading && !vm.forbidden">
          <section class="mobile-operations-panel">
            <header><div><h3>Hizmet sağlığı</h3><p>Güvenli, bağlantı bilgisiz durum özeti</p></div></header>
            <p class="mobile-operations-error" ng-if="vm.sectionErrors.dependencies">{{vm.sectionErrors.dependencies}}</p>
            <article class="mobile-dependency-row" ng-repeat="dependency in vm.dependencies track by dependency.dependency"><i data-tone="{{vm.dependencyState(dependency).tone}}" aria-hidden="true"></i><span><strong>{{vm.dependencyLabel(dependency.dependency)}}</strong><small>{{dependency.executions}} işlem · {{dependency.averageLatencyMilliseconds | number:0}} ms</small></span><b>{{vm.dependencyState(dependency).label}}</b></article>
            <p class="mobile-operations-empty" ng-if="!vm.dependencies.length && !vm.sectionErrors.dependencies">Henüz sağlık sinyali yok.</p>
          </section>

          <section class="mobile-operations-panel">
                <header><div><h3>Sistem olayları</h3><p>İçerik gösterilmeden güvenli yeniden deneme</p></div></header>
            <p class="mobile-operations-error" ng-if="vm.sectionErrors.messaging || vm.sectionErrors.messageDeadLetters">{{vm.sectionErrors.messaging || vm.sectionErrors.messageDeadLetters}}</p>
            <dl class="mobile-operations-metrics" ng-if="vm.messaging"><div><dt>Sırada</dt><dd>{{vm.messaging.pending}}</dd></div><div><dt>İşleniyor</dt><dd>{{vm.messaging.processing}}</dd></div><div ng-class="{attention: vm.messaging.deadLetter}"><dt>Müdahale</dt><dd>{{vm.messaging.deadLetter}}</dd></div></dl>
            <div class="mobile-operations-list"><h4>Son kayıtlar</h4><article class="mobile-operations-row" ng-repeat="item in vm.messageDeadLetters track by item.id"><span><strong>{{vm.eventLabel(item.eventType)}}</strong><small>{{item.attempts}} deneme · {{item.deadLetteredAtUtc | date:'dd.MM HH:mm'}}</small></span><button class="button button-clear icon ion-loop" ng-click="vm.replayMessage(item)" ng-disabled="vm.busy || shell.pwa.offline" aria-label="Sistem olayını yeniden sırala"></button></article><p class="mobile-operations-empty" ng-if="!vm.messageDeadLetters.length">Müdahale bekleyen olay yok.</p></div>
          </section>

          <section class="mobile-operations-panel">
            <header><div><h3>Bildirim teslimatı</h3><p>Alıcı bilgisi gösterilmeden durum takibi</p></div></header>
            <p class="mobile-operations-error" ng-if="vm.sectionErrors.notifications || vm.sectionErrors.notificationDeadLetters">{{vm.sectionErrors.notifications || vm.sectionErrors.notificationDeadLetters}}</p>
            <dl class="mobile-operations-metrics" ng-if="vm.notifications"><div><dt>Sırada</dt><dd>{{vm.notifications.pending}}</dd></div><div><dt>Gönderildi</dt><dd>{{vm.notifications.sent}}</dd></div><div ng-class="{attention: vm.notifications.deadLetter}"><dt>Müdahale</dt><dd>{{vm.notifications.deadLetter}}</dd></div></dl>
            <div class="mobile-operations-list"><h4>Başarısız teslimatlar</h4><article class="mobile-operations-row" ng-repeat="item in vm.notificationDeadLetters track by item.id"><span><strong>{{vm.notificationLabel(item.type)}}</strong><small>{{item.attempts}} deneme · {{item.deadLetteredAt | date:'dd.MM HH:mm'}}</small></span><button class="button button-clear icon ion-loop" ng-click="vm.replayNotification(item)" ng-disabled="vm.busy || shell.pwa.offline" aria-label="Bildirim teslimatını yeniden sırala"></button></article><p class="mobile-operations-empty" ng-if="!vm.notificationDeadLetters.length">Müdahale bekleyen bildirim yok.</p></div>
          </section>

          <section class="mobile-operations-panel">
            <header><div><h3>Dosya güvenliği</h3><p>Karantina içeriği ve nesne anahtarı gizli kalır</p></div><button class="button button-small button-stable icon-left ion-ios-search" ng-click="vm.runStorageMaintenance()" ng-disabled="vm.busy || shell.pwa.offline">Denetle</button></header>
            <p class="mobile-operations-error" ng-if="vm.sectionErrors.storage">{{vm.sectionErrors.storage}}</p>
            <dl class="mobile-operations-metrics" ng-if="vm.storage"><div ng-class="{attention: vm.storage.quarantined}"><dt>Karantina</dt><dd>{{vm.storage.quarantined}}</dd></div><div><dt>Temiz</dt><dd>{{vm.storage.clean}}</dd></div><div ng-class="{attention: vm.storage.rejected}"><dt>Reddedildi</dt><dd>{{vm.storage.rejected}}</dd></div></dl>
          </section>

          <section class="mobile-operations-panel">
                <header><div><h3>Arama görünümü</h3><p>Güncel kayıtlarla sınırlı kapsamda uzlaştırma</p></div><button class="button button-small button-stable icon-left ion-shuffle" ng-click="vm.reconcileSearch()" ng-disabled="vm.busy || shell.pwa.offline">Uzlaştır</button></header>
            <p class="mobile-operations-result" ng-if="vm.searchResult">{{vm.searchResult.indexed}} kayıt indekslendi · {{vm.searchResult.removed}} kayıt kaldırıldı.</p>
            <p class="mobile-operations-empty" ng-if="!vm.searchResult">Yalnız gerek duyulduğunda açık onayla çalıştır.</p>
          </section>
        </div>
      </ion-content>
    </ion-view>
  </script>
