  <script id="templates/bulk-job-center.html" type="text/ng-template">
    <ion-view view-title="{{vm.project.name || 'İş merkezi'}}">
      <ion-content class="workspace mobile-job-center" data-loading="{{vm.loading}}" data-busy="{{vm.busy}}" data-mode="{{vm.mode}}">
        <ion-refresher pulling-text="İş geçmişini yenile" on-refresh="vm.load()"></ion-refresher>
        <header class="mobile-job-head">
          <div><small>{{vm.project.key || 'Proje'}} · {{vm.total}} iş</small><h2>İş merkezi</h2><p>İçe ve dışa aktarımları uygulamadan ayrılmadan izleyin.</p></div>
          <button type="button" ng-click="vm.load()" ng-disabled="vm.loading" aria-label="İş merkezini yenile"><i class="ion-refresh" aria-hidden="true"></i></button>
        </header>

        <nav class="mobile-job-tabs" role="tablist" aria-label="İş merkezi alanları">
          <button type="button" role="tab" aria-selected="{{vm.mode==='launch'}}" ng-class="{active:vm.mode==='launch'}" ng-click="vm.setMode('launch')">Yeni iş</button>
          <button type="button" role="tab" aria-selected="{{vm.mode==='history'}}" ng-class="{active:vm.mode==='history'}" ng-click="vm.setMode('history')">Geçmiş <span>{{vm.total}}</span></button>
        </nav>

        <div class="mobile-job-skeleton" ng-if="vm.loading" role="status" aria-label="İş merkezi yükleniyor"><span></span><span></span><span></span></div>
        <div class="mobile-feedback success" role="status" aria-live="polite" ng-if="!vm.loading && vm.notice">{{vm.notice}}</div>
        <div class="mobile-feedback error" role="alert" aria-live="assertive" ng-if="!vm.loading && vm.error">{{vm.error}}</div>
        <div class="mobile-job-offline" ng-if="vm.pwa.offline"><i class="ion-wifi" aria-hidden="true"></i><span>Çevrimdışıyken yeni iş başlatılamaz ve sonuç dosyaları indirilemez.</span></div>

        <div ng-if="!vm.loading && vm.project && vm.mode==='launch'">
          <section class="mobile-job-section" aria-labelledby="mobile-import-heading">
            <header><div><h3 id="mobile-import-heading">JSON ile içe aktar</h3><p>En fazla 5 MB ve 5000 satır</p></div><i class="ion-ios-upload-outline" aria-hidden="true"></i></header>
            <div class="mobile-job-permission" ng-if="!vm.canEdit() && !vm.pwa.offline"><i class="ion-eye" aria-hidden="true"></i><span>Bu projede içe aktarım yetkiniz yok.</span></div>
            <div ng-if="vm.canEdit()">
              <label class="mobile-job-file">
                <i class="ion-document-text" aria-hidden="true"></i>
                <span><strong>{{vm.importFile ? vm.importFile.name : 'JSON dosyası seç'}}</strong><small ng-if="!vm.importFile">Satırlar gönderilmeden önce yerel olarak doğrulanır.</small></span>
                <input type="file" accept=".json,application/json" file-change="vm.chooseImportFile(file)" aria-label="İçe aktarım JSON dosyası seç">
              </label>
              <div class="mobile-job-validation" ng-if="vm.importParsed" data-valid="{{vm.importParsed.valid}}">
                <strong>{{vm.importParsed.rows.length}} geçerli satır</strong>
                <span ng-if="vm.importParsed.totalErrors">{{vm.importParsed.totalErrors}} hata</span>
                <p ng-repeat="error in vm.importParsed.errors | limitTo:3 track by $index">{{error}}</p>
              </div>
              <div class="mobile-job-actions">
                <button class="button button-small button-stable" type="button" ng-click="vm.submitImport(true)" ng-disabled="vm.busy || !vm.importParsed.valid"><i class="ion-search" aria-hidden="true"></i> Önizle</button>
                <button class="button button-small button-positive" type="button" ng-click="vm.submitImport(false)" ng-disabled="vm.busy || !vm.importParsed.valid"><i class="ion-play" aria-hidden="true"></i> İçe aktar</button>
              </div>
            </div>
          </section>

          <section class="mobile-job-section" aria-labelledby="mobile-export-heading">
            <header><div><h3 id="mobile-export-heading">Proje verisini dışa aktar</h3><p>Sonuç dosyası iş tamamlanınca hazırlanır.</p></div><i class="ion-ios-download-outline" aria-hidden="true"></i></header>
            <ion-toggle ng-model="vm.exportDraft.includeArchived" ng-disabled="vm.pwa.offline">Arşivlenmiş işleri dahil et</ion-toggle>
            <div class="mobile-job-actions">
              <button class="button button-small button-stable" type="button" ng-click="vm.submitExport(true)" ng-disabled="vm.busy || vm.pwa.offline"><i class="ion-search" aria-hidden="true"></i> Kapsamı doğrula</button>
              <button class="button button-small button-positive" type="button" ng-click="vm.submitExport(false)" ng-disabled="vm.busy || vm.pwa.offline"><i class="ion-archive" aria-hidden="true"></i> Dışa aktar</button>
            </div>
          </section>
        </div>

        <div ng-if="!vm.loading && vm.project && vm.mode==='history'">
          <section class="mobile-job-register" aria-labelledby="mobile-job-history-heading">
            <header><h3 id="mobile-job-history-heading">İş geçmişi</h3><span>Yalnız sizin başlattığınız işler</span></header>
            <button class="mobile-job-row" type="button" ng-repeat="job in vm.jobs track by job.id" ng-click="vm.select(job)" ng-class="{selected:vm.selected && vm.selected.id===job.id}">
              <i class="{{job.type==='Import' ? 'ion-ios-upload-outline' : 'ion-ios-download-outline'}}" aria-hidden="true"></i>
              <span><strong>{{vm.jobTypeLabel(job)}}</strong><small>{{job.processedItems}} / {{job.totalItems}} işlendi · {{job.createdAt | date:'dd MMM HH:mm'}}</small><progress max="100" value="{{vm.jobProgress(job)}}">{{vm.jobProgress(job)}}%</progress></span>
              <b data-tone="{{vm.jobState(job).tone}}">{{vm.jobState(job).label}}</b>
            </button>
            <p class="mobile-job-empty" ng-if="!vm.jobs.length">Bu projede henüz kalıcı iş başlatılmadı.</p>
          </section>

          <section class="mobile-job-detail" ng-if="vm.selected" aria-live="polite">
            <header><div><small>{{vm.selected.id | limitTo:8}}</small><h3>{{vm.jobTypeLabel(vm.selected)}}</h3></div><b data-tone="{{vm.jobState(vm.selected).tone}}">{{vm.jobState(vm.selected).label}}</b></header>
            <dl><div><dt>İşlenen</dt><dd>{{vm.selected.processedItems}} / {{vm.selected.totalItems}}</dd></div><div><dt>Başarılı</dt><dd>{{vm.selected.succeededItems}}</dd></div><div><dt>Başarısız</dt><dd>{{vm.selected.failedItems}}</dd></div><div><dt>Dosya süresi</dt><dd>{{vm.selected.artifactsExpireAt ? (vm.selected.artifactsExpireAt | date:'dd MMM yyyy HH:mm') : 'İş tamamlanınca başlar'}}</dd></div></dl>
            <p class="mobile-job-error-detail" ng-if="vm.selected.lastErrorMessage">{{vm.selected.lastErrorCode}} · {{vm.selected.lastErrorMessage}}</p>
            <p class="mobile-job-expired" ng-if="vm.artifactsExpired(vm.selected)">Bu işin sonuç dosyalarının saklama süresi doldu.</p>
            <div class="mobile-job-actions">
              <button class="button button-small button-stable" type="button" ng-if="vm.selected.hasResult && !vm.artifactsExpired(vm.selected)" ng-click="vm.download(vm.selected,false)" ng-disabled="vm.pwa.offline"><i class="ion-ios-download-outline" aria-hidden="true"></i> Sonuç</button>
              <button class="button button-small button-stable" type="button" ng-if="vm.selected.hasErrorFile && !vm.artifactsExpired(vm.selected)" ng-click="vm.download(vm.selected,true)" ng-disabled="vm.pwa.offline"><i class="ion-alert-circled" aria-hidden="true"></i> Hatalar</button>
              <button class="button button-small button-stable" type="button" ng-if="vm.canEdit() && vm.canRetry(vm.selected)" ng-click="vm.retry(vm.selected)" ng-disabled="vm.busy"><i class="ion-loop" aria-hidden="true"></i> Başarısızları yinele</button>
              <button class="button button-small button-assertive button-outline" type="button" ng-if="vm.canEdit() && vm.canCancel(vm.selected) && vm.cancelCandidateId!==vm.selected.id" ng-click="vm.requestCancel(vm.selected)" ng-disabled="vm.busy"><i class="ion-stop" aria-hidden="true"></i> İptal et</button>
            </div>
            <div class="mobile-job-confirm" ng-if="vm.cancelCandidateId===vm.selected.id">
              <span>Çalışan işi iptal etmek istiyor musunuz?</span>
              <button type="button" ng-click="vm.cancel(vm.selected)">İptal et</button>
              <button type="button" ng-click="vm.dismissCancel()">Vazgeç</button>
            </div>
          </section>
        </div>
      </ion-content>
    </ion-view>
  </script>

  <script id="templates/project-planning.html" type="text/ng-template">
    <ion-view view-title="{{vm.project.name || 'Proje planı'}}">
      <ion-content class="workspace mobile-plan-surface" data-loading="{{vm.loading}}">
        <header class="mobile-plan-head"><div><h2>{{vm.project.name || 'Proje planı'}}</h2><p>{{vm.timeZone}}</p></div><span><strong>{{vm.model.totals.tasks}} iş</strong><small>%{{vm.model.totals.progress}} tamamlandı</small></span></header>
        <nav class="mobile-plan-modes" aria-label="Plan görünümü"><button ng-class="{active: vm.mode === 'calendar'}" ng-click="vm.setMode('calendar')">Takvim</button><button ng-class="{active: vm.mode === 'timeline'}" ng-click="vm.setMode('timeline')">Zaman</button><button ng-class="{active: vm.mode === 'roadmap'}" ng-click="vm.setMode('roadmap')">Yol haritası</button></nav>
        <div class="mobile-plan-filters"><input type="search" ng-model="vm.filters.query" ng-change="vm.applyFilters()" placeholder="Plan içinde ara" aria-label="Plan içinde ara"><select ng-model="vm.filters.type" ng-change="vm.applyFilters()" ng-options="type for type in vm.typeOptions()" aria-label="İş türü"><option value="">Tüm türler</option></select></div>
        <div class="mobile-plan-window"><button ng-click="vm.shift(-1)" aria-label="Önceki tarih aralığı"><i class="ion-chevron-left" aria-hidden="true"></i></button><span><strong>{{vm.windowLabel()}}</strong><button class="button button-small button-clear" ng-click="vm.today()">Bugün</button></span><button ng-click="vm.shift(1)" aria-label="Sonraki tarih aralığı"><i class="ion-chevron-right" aria-hidden="true"></i></button></div>
        <div class="mobile-plan-zoom" ng-if="vm.mode !== 'calendar'" role="group" aria-label="Zaman ölçeği"><button ng-class="{active: vm.zoom === 'week'}" ng-click="vm.setZoom('week')">Hafta</button><button ng-class="{active: vm.zoom === 'month'}" ng-click="vm.setZoom('month')">Ay</button><button ng-class="{active: vm.zoom === 'quarter'}" ng-click="vm.setZoom('quarter')">Çeyrek</button></div>
        <p class="mobile-plan-scope" data-complete="{{vm.scopeComplete}}" role="status"><strong>{{vm.scopeComplete ? 'Tüm proje kapsamı' : 'Kısmi proje kapsamı'}}</strong> · {{vm.tasks.length}} iş, {{vm.sprints.length}} sprint</p>
        <p class="mobile-plan-feedback error" ng-if="vm.error" role="alert">{{vm.error}}</p><p class="mobile-plan-feedback success" ng-if="vm.notice" role="status">{{vm.notice}}</p>

        <section ng-if="vm.mode === 'calendar'" aria-labelledby="mobile-calendar-heading"><header class="mobile-plan-section-head"><h3 id="mobile-calendar-heading">Plan ajandası</h3><span>{{vm.calendarEvents().length}} tarihli kayıt</span></header><div class="mobile-plan-list"><article class="mobile-plan-row" ng-repeat="event in vm.calendarEvents() track by event.id"><time datetime="{{event.key}}">{{vm.dateLabel(event.key)}}</time><button ng-click="vm.openTask(event.task)" ng-disabled="!event.task"><strong>{{event.title}}</strong><small>{{event.kind}}<span ng-if="event.task"> · {{event.task.status}}</span></small></button><input ng-if="event.task && vm.canEdit()" type="date" ng-model="event.inputDate" ng-change="vm.reschedule(event.task, event.inputDate)" ng-disabled="vm.mutationTaskId" aria-label="{{event.title}} bitiş tarihi"></article><p class="mobile-plan-empty" ng-if="!vm.calendarEvents().length">Bu aralıkta tarihli kayıt yok.</p></div></section>

        <section ng-if="vm.mode === 'timeline'" aria-labelledby="mobile-timeline-heading"><header class="mobile-plan-section-head"><h3 id="mobile-timeline-heading">İş zaman çizelgesi</h3><span>{{vm.model.dependencies.length}} bağımlılık · {{vm.model.dependencyRisks.length}} risk</span></header><div class="mobile-plan-list"><article class="mobile-plan-row mobile-plan-summary-row" ng-repeat="row in vm.model.timelineRows track by row.id" data-risk="{{row.dependencyRisk}}"><button ng-click="vm.openTask(row.task)"><strong>{{row.title}}</strong><small>{{row.source}}</small></button><span><strong>{{vm.dateLabel(row.startKey)}}</strong><small>{{vm.dateLabel(row.endKey)}} · {{row.blockedBy.length}} engel</small></span></article><p class="mobile-plan-empty" ng-if="!vm.model.timelineRows.length">Planlanmış iş yok.</p></div></section>

        <section ng-if="vm.mode === 'roadmap'" aria-labelledby="mobile-roadmap-heading"><header class="mobile-plan-section-head"><h3 id="mobile-roadmap-heading">Teslimat yol haritası</h3><span>{{vm.model.totals.overdue}} geciken iş</span></header><div class="mobile-plan-list"><article class="mobile-plan-row mobile-plan-summary-row" ng-repeat="row in vm.model.roadmapRows track by row.id"><span><strong>{{row.title}}</strong><small>{{row.kind}} · {{row.status}} · {{vm.dateLabel(row.startKey)}}</small></span><span class="mobile-plan-progress"><strong>%{{row.progress}}</strong><progress max="100" value="{{row.progress}}">%{{row.progress}}</progress><small>{{row.progressSource}}</small></span></article><p class="mobile-plan-empty" ng-if="!vm.model.roadmapRows.length">Yol haritası teslimatı yok.</p></div></section>

        <section class="mobile-plan-unscheduled"><button ng-click="vm.unscheduledOpen = !vm.unscheduledOpen" aria-expanded="{{vm.unscheduledOpen}}"><i class="{{vm.unscheduledOpen ? 'ion-chevron-down' : 'ion-chevron-right'}}" aria-hidden="true"></i> Tarihsiz işler ({{vm.model.unscheduledTasks.length}})</button><div ng-if="vm.unscheduledOpen"><article class="mobile-plan-row" ng-repeat="task in vm.model.unscheduledTasks track by task.id"><button ng-click="vm.openTask(task)"><strong>{{task.title}}</strong><small>{{task.status}} · {{task.priority}}</small></button><input type="date" ng-model="task.mobilePlanningDue" ng-change="vm.reschedule(task, task.mobilePlanningDue)" ng-disabled="!vm.canEdit() || vm.mutationTaskId" aria-label="{{task.title}} bitiş tarihi ata"></article><p class="mobile-plan-empty" ng-if="!vm.model.unscheduledTasks.length">Tüm filtrelenmiş işlerin bitiş tarihi var.</p></div></section>
      </ion-content>
    </ion-view>
  </script>

  <script id="templates/project-reporting.html" type="text/ng-template">
    <ion-view view-title="{{vm.project.name || 'Proje içgörüleri'}}">
      <ion-content class="workspace mobile-report-surface" data-loading="{{vm.loading}}">
        <header class="mobile-report-head"><div><h2>{{vm.project.name || 'Proje içgörüleri'}}</h2><p>{{vm.mode==='dashboards' ? 'Kaydedilmiş karar görünümleri' : 'İş yükü ve teslimat sinyalleri'}}</p></div><select class="mobile-report-range" ng-if="vm.mode!=='dashboards'" ng-model="vm.rangeDays" ng-change="vm.setRange(vm.rangeDays)" aria-label="Rapor dönemi"><option ng-value="30">30 gün</option><option ng-value="90">90 gün</option><option ng-value="180">180 gün</option></select><div class="mobile-dashboard-head-actions" ng-if="vm.mode==='dashboards'"><button type="button" ng-click="vm.newDashboard()" aria-label="Yeni dashboard" title="Yeni dashboard"><i class="ion-plus-round" aria-hidden="true"></i></button><button type="button" ng-click="vm.load()" ng-disabled="vm.dashboardBusy" aria-label="Dashboardları yenile" title="Dashboardları yenile"><i class="ion-refresh" aria-hidden="true"></i></button></div></header>
        <nav class="segmented" role="tablist" aria-label="Mobil içgörü görünümü"><button role="tab" aria-selected="{{vm.mode==='workload'}}" ng-class="{active:vm.mode==='workload'}" ng-click="vm.setMode('workload')">İş yükü</button><button role="tab" aria-selected="{{vm.mode==='reports'}}" ng-class="{active:vm.mode==='reports'}" ng-click="vm.setMode('reports')">Raporlar</button><button role="tab" aria-selected="{{vm.mode==='dashboards'}}" ng-class="{active:vm.mode==='dashboards'}" ng-click="vm.setMode('dashboards')">Dashboardlar</button></nav>
        <p class="mobile-report-fresh" ng-if="vm.mode!=='dashboards'" data-stale="{{vm.freshness.stale}}" role="status"><span ng-if="vm.freshness.generatedAt">Veri {{vm.freshness.generatedAt | date:'dd MMM HH:mm'}} · en fazla {{vm.freshness.maxAgeSeconds | number:0}} sn yaşında</span><span ng-if="!vm.freshness.generatedAt">Freshness bilgisi bekleniyor.</span></p>
        <div class="mobile-feedback error" role="alert" ng-if="vm.error">{{vm.error}}</div>
        <div class="mobile-feedback success" role="status" ng-if="vm.notice">{{vm.notice}}</div>
        <div class="mobile-report-metrics" ng-if="vm.mode!=='dashboards'"><div><span>Açık iş</span><strong>{{vm.workloadModel.totals.openItems}}</strong></div><div><span>Geciken</span><strong>{{vm.workloadModel.totals.overdueItems}}</strong></div><div><span>Loglanan</span><strong>{{vm.workloadModel.totals.loggedHours | number:1}} sa</strong></div><div><span>Tahminsiz</span><strong>{{vm.workloadModel.totals.unestimatedItems === null ? '—' : vm.workloadModel.totals.unestimatedItems}}</strong></div></div>
        <section ng-if="vm.mode==='workload'" aria-labelledby="mobile-workload-heading"><h3 id="mobile-workload-heading" class="section-title">Proje iş yükü</h3><p class="mobile-capacity-note"><strong>Kapasite eşiği yapılandırılmadı.</strong> Açık iş sayısı kişileri sıralamak için kullanılmaz; tahminsiz iş sıfır efor değildir.</p><div ng-repeat="row in vm.workloadModel.rows track by row.id"><button class="mobile-workload-row" ng-click="vm.toggleWorkload(row)" aria-expanded="{{vm.expandedId===row.id}}"><span><strong>{{row.label}}</strong><b>{{row.openItems}} açık</b></span><small>{{row.overdueItems}} geciken · {{row.estimatedPoints}} puan · {{row.unestimatedItems}} tahminsiz</small><i class="mobile-workload-bar" aria-hidden="true"><i ng-style="{width:row.relativeWidth+'%'}"></i></i></button><div ng-if="vm.expandedId===row.id"><button class="mobile-report-row" ng-repeat="task in row.tasks | limitTo:vm.rowLimits[row.id] track by task.id" ng-click="vm.openTask(task)"><span><strong>{{task.title}}</strong><b>{{task.estimatePoints ? task.estimatePoints + ' p' : '—'}}</b></span><small>{{task.status}} · {{task.priority}}</small></button><button class="button button-small button-stable button-block" ng-if="vm.rowLimits[row.id] < row.tasks.length" ng-click="vm.showMoreWorkload(row)">Daha fazla iş göster</button></div></div><p class="mobile-report-empty" ng-if="!vm.workloadModel.rows.length">Atanmış açık iş yükü yok.</p></section>
        <section ng-if="vm.mode==='reports'" aria-labelledby="mobile-reports-heading"><h3 id="mobile-reports-heading" class="section-title">Teslimat raporları</h3><div class="mobile-report-section"><h3>Durum dağılımı</h3><div class="mobile-report-status" ng-repeat="row in vm.reportingModel.status track by row.status"><span>{{row.status}}</span><span class="report-bar-track"><i ng-style="{width:row.relativeWidth+'%'}"></i></span><strong>{{row.count}}</strong></div></div><div class="mobile-report-section"><h3>Akış ve tamamlama</h3><div class="mobile-report-metrics"><div><span>Tamamlanma</span><strong>%{{vm.reportingModel.completion.completionRatePercent}}</strong><small>{{vm.reportingModel.completion.completedItems}} / {{vm.reportingModel.completion.createdItems}} iş</small></div><div><span>Medyan lead</span><strong>{{vm.reportingModel.flow.medianLeadTimeHours / 24 | number:1}} gün</strong></div><div><span>Medyan cycle</span><strong>{{vm.reportingModel.flow.medianCycleTimeHours === null ? 'Veri yok' : ((vm.reportingModel.flow.medianCycleTimeHours / 24 | number:1) + ' gün')}}</strong></div><div><span>Örnek</span><strong>{{vm.reportingModel.flow.completedItems}}</strong></div></div></div><div class="mobile-report-section"><h3>Ekip teslimat özeti</h3><p class="mobile-capacity-note">Alfabetik görünüm; kişi performansı sıralaması değildir.</p><div class="mobile-report-row" ng-repeat="team in vm.reportingModel.teams track by team.teamId"><span><strong>{{team.teamName}}</strong><b>%{{team.completionRatePercent}}</b></span><small>{{team.completedItems}} / {{team.assignedItems}} tamamlanan · {{team.loggedHours | number:1}} sa</small></div></div><div class="mobile-report-section"><h3>Yakın riskler</h3><button class="mobile-report-row" ng-repeat="risk in vm.reportingModel.risks | limitTo:10 track by risk.id" ng-click="vm.openTask({id:risk.id})"><span><strong>{{risk.title}}</strong><time>{{risk.dueDate | date:'dd MMM'}}</time></span><small>{{risk.status}}</small></button><p class="mobile-report-empty" ng-if="!vm.reportingModel.risks.length">Yakın teslimat riski yok.</p></div></section>
        <section class="mobile-dashboard" ng-if="vm.mode==='dashboards'" aria-labelledby="mobile-dashboard-heading">
          <h3 id="mobile-dashboard-heading" class="section-title">Dashboardlar</h3>
          <nav class="mobile-dashboard-register" aria-label="Kaydedilmiş dashboardlar"><button type="button" ng-repeat="item in vm.dashboards track by item.id" ng-class="{active:vm.dashboardDraft && vm.dashboardDraft.id===item.id}" ng-click="vm.selectDashboard(item)"><strong>{{item.name}}</strong><small>{{vm.dashboardScopeLabel(item.scope)}} · {{item.widgets.length}} widget</small></button><p ng-if="!vm.dashboards.length && !vm.dashboardBusy">Henüz kaydedilmiş dashboard yok.</p></nav>
          <form class="mobile-dashboard-editor" ng-if="vm.dashboardDraft && vm.dashboardDraft.canEdit" ng-submit="vm.saveDashboard()">
            <label><span>Ad</span><input type="text" ng-model="vm.dashboardDraft.name" maxlength="120" required></label>
            <label><span>Kapsam</span><select ng-model="vm.dashboardDraft.scope" ng-change="vm.dashboardScopeChanged()"><option value="Personal">Kişisel</option><option value="Project">Proje</option><option value="Portfolio">Portföy</option></select></label>
            <label ng-if="vm.dashboardDraft.scope==='Project'"><span>Proje</span><select ng-model="vm.dashboardProjectId" ng-change="vm.setDashboardProject(vm.dashboardProjectId)" ng-options="project.id as project.name for project in vm.projects" required></select></label>
            <label ng-if="vm.dashboardDraft.scope!=='Project'"><span>Projeler</span><select class="mobile-dashboard-multiple" multiple ng-model="vm.dashboardDraft.projectIds" ng-options="project.id as project.name for project in vm.projects" required aria-describedby="mobile-dashboard-project-help"></select><small id="mobile-dashboard-project-help">{{vm.dashboardDraft.scope==='Portfolio' ? 'Portföy için en az iki proje seçin.' : 'Kişisel görünümde kullanılacak projeleri seçin.'}}</small></label>
            <label><span>Açıklama</span><textarea ng-model="vm.dashboardDraft.description" maxlength="500" rows="2"></textarea></label>
            <div class="mobile-dashboard-numbers"><label><span>Dönem</span><input type="number" min="1" max="366" ng-model="vm.dashboardDraft.filter.rangeDays"></label><label><span>Risk günü</span><input type="number" min="1" max="90" ng-model="vm.dashboardDraft.filter.dueRiskDays"></label></div>
            <div class="mobile-dashboard-add"><select ng-model="vm.dashboardWidgetType" ng-options="item.type as item.label for item in vm.dashboardCatalog" aria-label="Widget türü"></select><button type="button" ng-click="vm.addDashboardWidget()" ng-disabled="vm.dashboardDraft.widgets.length>=12"><i class="ion-plus-round" aria-hidden="true"></i><span>Widget ekle</span></button></div>
            <ol class="mobile-dashboard-widgets"><li ng-repeat="widget in vm.dashboardDraft.widgets track by widget.id"><label><span class="sr-only">Widget başlığı</span><input type="text" ng-model="widget.title" maxlength="120" aria-label="Widget başlığı"></label><small>{{vm.dashboardWidgetLabel(widget.type)}}</small><div><button type="button" ng-click="vm.moveDashboardWidget($index,-1)" ng-disabled="$first" aria-label="Widgetı yukarı taşı"><i class="ion-arrow-up-b" aria-hidden="true"></i></button><button type="button" ng-click="vm.moveDashboardWidget($index,1)" ng-disabled="$last" aria-label="Widgetı aşağı taşı"><i class="ion-arrow-down-b" aria-hidden="true"></i></button><button type="button" ng-click="vm.removeDashboardWidget(widget)" ng-disabled="vm.dashboardDraft.widgets.length===1" aria-label="Widgetı kaldır"><i class="ion-trash-b" aria-hidden="true"></i></button></div></li></ol>
            <label><span>Paylaşılacak kişiler</span><select class="mobile-dashboard-multiple" multiple ng-model="vm.dashboardDraft.viewerUserIds" ng-options="user.id as vm.userName(user.id) for user in vm.users"></select><small>Paylaşılan kişiler yalnız erişebildikleri kaynak projeleri görebilir.</small></label>
            <div class="mobile-dashboard-actions"><button class="button button-positive" type="submit" ng-disabled="vm.dashboardBusy"><i class="ion-checkmark-round" aria-hidden="true"></i><span>Kaydet</span></button><button class="button button-stable" type="button" ng-click="vm.shareDashboard()" ng-disabled="!vm.dashboardDraft.id || vm.dashboardBusy"><i class="ion-person-add" aria-hidden="true"></i><span>Paylaş</span></button><button class="button button-stable" type="button" ng-click="vm.renderDashboard()" ng-disabled="!vm.dashboardDraft.id || vm.dashboardBusy"><i class="ion-refresh" aria-hidden="true"></i><span>Yenile</span></button><button class="button button-stable" type="button" ng-click="vm.exportDashboard()" ng-disabled="!vm.dashboardDraft.id"><i class="ion-archive" aria-hidden="true"></i><span>Dışa aktar</span></button><button class="button button-assertive button-outline" type="button" ng-click="vm.archiveDashboard()" ng-disabled="!vm.dashboardDraft.id || vm.dashboardBusy"><i class="ion-trash-b" aria-hidden="true"></i><span>Arşivle</span></button></div>
          </form>
          <div class="mobile-dashboard-readonly" ng-if="vm.dashboardDraft && !vm.dashboardDraft.canEdit"><i class="ion-locked" aria-hidden="true"></i><span>Bu paylaşılan dashboard salt okunurdur. Kaynak izinleri her yenilemede doğrulanır.</span><button class="button button-stable" type="button" ng-click="vm.exportDashboard()">Dışa aktar</button></div>
          <p class="mobile-dashboard-fresh" ng-if="vm.dashboardRender" data-stale="{{vm.dashboardRender.stale}}" role="status">Veri {{vm.dashboardRender.generatedAt | date:'dd MMM HH:mm'}} · {{vm.dashboardRender.partial ? 'Bazı kaynaklar kullanılamıyor' : 'Tüm kaynaklar hazır'}}</p>
          <article class="mobile-dashboard-widget" ng-repeat="widget in vm.dashboardRender.widgets track by widget.id" data-status="{{widget.status}}"><header><div><h4>{{widget.title}}</h4><small>{{vm.dashboardWidgetLabel(widget.type)}}</small></div><span>{{vm.dashboardStatusLabel(widget.status)}}</span></header><div class="mobile-dashboard-table-wrap" ng-repeat="source in widget.sources track by source.projectId"><table><caption>{{widget.title}} · {{vm.dashboardProjectName(source.projectId)}}</caption><thead><tr><th scope="col" ng-repeat="column in source.columns track by column.key">{{column.label}}</th></tr></thead><tbody><tr ng-repeat="row in source.rows track by $index"><td ng-repeat="column in source.columns track by column.key">{{vm.dashboardCellValue(row, column)}}</td></tr></tbody></table><p class="mobile-report-empty" ng-if="!source.rows.length">Bu filtrede veri yok.</p></div><p class="mobile-dashboard-degraded" ng-if="widget.status==='Degraded'" role="status">Bu widgetın kaynağı geçici olarak kullanılamıyor.</p></article>
        </section>
      </ion-content>
    </ion-view>
  </script>

  <script id="templates/team-detail.html" type="text/ng-template">
    <ion-view view-title="{{vm.team.name || 'Ekip'}}">
      <ion-content class="workspace" data-team-saving="{{vm.saving ? 'true' : 'false'}}">
        <div class="mobile-feedback success" role="status" aria-live="polite" ng-if="vm.notice">{{vm.notice}}</div>
        <div class="mobile-feedback error" role="alert" aria-live="assertive" ng-if="vm.error">{{vm.error}}</div>
        <form class="mobile-manage-form" ng-if="vm.team && vm.canManage" ng-submit="vm.save()"><label><span>Ekip adı</span><input type="text" ng-model="vm.teamDraft.name" aria-label="Mobil ekip adı" required></label><div class="mobile-form-actions"><button class="button button-small button-positive" type="submit" ng-disabled="vm.saving">Ekibi kaydet</button><button class="button button-small button-assertive button-outline" type="button" ng-if="vm.canArchive" ng-click="vm.archive()" ng-disabled="vm.saving">Arşivle</button></div></form>
        <div class="mobile-permission" ng-if="vm.team && !vm.canManage"><i class="ion-locked"></i> Bu ekipte yönetim yetkiniz yok.</div>
        <div class="item item-divider">Üyeler ve davetler</div>
        <div class="mobile-member-row" ng-repeat="member in vm.team.members track by member.id"><span><strong>{{member.email}}</strong><small>{{member.role}} · {{member.status}}</small></span><button class="button button-small button-assertive button-clear ion-trash-a" ng-if="vm.canManage && member.role !== 'Owner'" ng-click="vm.removeMember(member)" aria-label="Mobil ekip üyesini kaldır"></button></div>
        <form class="mobile-manage-form compact" ng-if="vm.canManage" ng-submit="vm.invite()"><label><span>E-posta</span><input type="email" ng-model="vm.inviteDraft.email" aria-label="Mobil ekip davet e-postası" required></label><label><span>Rol</span><select ng-model="vm.inviteDraft.role" aria-label="Mobil ekip davet rolü"><option>Member</option><option>Admin</option></select></label><button class="button button-small button-positive" type="submit" ng-disabled="vm.saving">Davet et</button></form>
        <div class="item item-divider">Ekip etkinliği</div>
        <div class="mobile-timeline"><p ng-repeat="entry in vm.audit | limitTo:8"><strong>{{entry.action}}</strong><span>{{entry.createdAt | date:'dd.MM HH:mm'}}</span></p><p ng-if="!vm.audit.length">Henüz etkinlik yok.</p></div>
      </ion-content>
    </ion-view>
  </script>

  <script id="templates/task-detail.html" type="text/ng-template">
    <ion-view view-title="{{vm.task.title || 'Görev detayı'}}">
      <ion-content class="workspace mobile-task-detail" data-loading="{{vm.loading}}">
        <div class="mobile-task-loading" ng-if="vm.loading" aria-busy="true" aria-label="Görev ayrıntıları yükleniyor">
          <span></span><span></span><span></span><span></span>
        </div>

        <section class="mobile-task-failure" ng-if="!vm.loading && vm.loadError" role="alert">
          <i class="ion-alert-circled" aria-hidden="true"></i>
          <h2>Görev açılamadı</h2>
          <p>{{vm.loadError}}</p>
          <button class="button button-small button-positive" type="button" ng-click="vm.load()">Yeniden dene</button>
        </section>

        <div ng-if="!vm.loading && !vm.loadError && vm.task">
          <header class="mobile-task-header">
            <div class="mobile-task-heading">
              <small>{{vm.task.key || vm.task.type}} · {{vm.task.status}}</small>
              <h1 ng-bind="vm.task.title"></h1>
            </div>
            <div class="mobile-task-collaboration" aria-label="Görev işbirliği">
              <button type="button" ng-class="{'active': vm.collaboration.watching}" ng-click="vm.toggleWatch()" ng-disabled="vm.actionBusy || shell.pwa.offline" aria-label="Görevi takip et" aria-pressed="{{vm.collaboration.watching}}"><i class="ion-eye" aria-hidden="true"></i><span>{{vm.collaboration.watcherCount}}</span></button>
              <button type="button" ng-class="{'active': vm.collaboration.voted}" ng-click="vm.toggleVote()" ng-disabled="vm.actionBusy || shell.pwa.offline" aria-label="Göreve oy ver" aria-pressed="{{vm.collaboration.voted}}"><i class="ion-arrow-up-c" aria-hidden="true"></i><span>{{vm.collaboration.voteCount}}</span></button>
            </div>
          </header>

          <div class="mobile-task-notice error" ng-if="vm.error" role="alert" aria-live="assertive"><i class="ion-alert-circled" aria-hidden="true"></i><span>{{vm.error}}</span></div>
          <div class="mobile-task-notice" ng-if="vm.partial" role="status"><i class="ion-cloud" aria-hidden="true"></i><span>Bazı ayrıntılar alınamadı. Kullanılabilen bilgiler gösteriliyor.</span></div>
          <div class="mobile-task-notice" ng-if="!vm.canEditTask()"><i class="ion-locked" aria-hidden="true"></i><span>Görev alanları salt okunur. Yorum, takip ve oy işlemleri kullanılabilir.</span></div>
          <div class="mobile-task-notice warning" ng-if="shell.pwa.offline"><i class="ion-wifi" aria-hidden="true"></i><span>Çevrimdışıyken değişiklikler devre dışıdır.</span></div>

          <nav class="mobile-task-view-tabs" aria-label="Görev detayı görünümü">
            <button type="button" ng-class="{'active': vm.detailView === 'detail'}" ng-click="vm.detailView = 'detail'">Detay</button>
            <button type="button" ng-class="{'active': vm.detailView === 'activity'}" ng-click="vm.detailView = 'activity'">Etkinlik <span>{{vm.streams.activity.totalCount}}</span></button>
          </nav>

          <div ng-if="vm.detailView === 'detail'">
            <section class="mobile-task-section mobile-task-description" aria-labelledby="mobile-description-heading">
              <h2 id="mobile-description-heading">Açıklama</h2>
              <p ng-bind="vm.task.description || 'Açıklama eklenmemiş.'"></p>
              <h3>Kabul ölçütleri</h3>
              <p ng-bind="vm.task.acceptanceCriteria || 'Kabul ölçütü eklenmemiş.'"></p>
            </section>

            <form class="mobile-task-section mobile-task-form" ng-if="vm.canEditTask()" ng-submit="vm.saveTask()">
              <div class="mobile-task-section-title"><h2>Özellikler</h2><span>{{vm.membership.role}}</span></div>
              <label><span>Başlık</span><input type="text" ng-model="vm.taskDraft.title" maxlength="200" required></label>
              <label><span>Açıklama</span><textarea ng-model="vm.taskDraft.description" rows="4"></textarea></label>
              <div class="mobile-task-form-grid">
                <label><span>Öncelik</span><select ng-model="vm.taskDraft.priority"><option>Critical</option><option>High</option><option>Medium</option><option>Low</option></select></label>
                <label><span>Son tarih</span><input type="date" ng-model="vm.taskDraft.dueDate"></label>
                <label><span>Sorumlu</span><select ng-model="vm.taskDraft.assigneeUserId"><option value="">Atanmamış</option><option ng-repeat="user in vm.users track by user.id" value="{{user.id}}">{{vm.userName(user.id)}}</option></select></label>
                <label><span>Ekip</span><select ng-model="vm.taskDraft.teamId"><option value="">Ekip yok</option><option ng-repeat="team in vm.teams track by team.id" value="{{team.id}}">{{team.name}}</option></select></label>
                <label><span>Sprint</span><select ng-model="vm.taskDraft.sprintId"><option value="">Backlog</option><option ng-repeat="sprint in vm.sprints track by sprint.id" value="{{sprint.id}}">{{sprint.name}}</option></select></label>
                <label><span>Tahmin</span><input type="number" min="0" step="1" ng-model="vm.taskDraft.estimatePoints"></label>
                <label class="wide"><span>Üst görev</span><select ng-model="vm.taskDraft.parentId"><option value="">Üst görev yok</option><option ng-repeat="candidate in vm.relationCandidates track by candidate.id" value="{{candidate.id}}">{{candidate.title}}</option></select></label>
              </div>
              <div class="mobile-task-custom-fields" ng-if="vm.customFieldsForTask().length">
                <label ng-repeat="field in vm.customFieldsForTask() track by field.key"><span>{{field.name}}</span><input ng-if="field.type === 'Text' || field.type === 'Number'" ng-attr-type="{{field.type === 'Number' ? 'number' : 'text'}}" ng-model="vm.taskDraft.customFieldValues[field.key]"><input ng-if="field.type === 'Date'" type="date" ng-model="vm.taskDraft.customFieldValues[field.key]"><select ng-if="field.type === 'Boolean'" ng-model="vm.taskDraft.customFieldValues[field.key]"><option ng-value="true">Evet</option><option ng-value="false">Hayır</option></select><select ng-if="field.type === 'Select'" ng-model="vm.taskDraft.customFieldValues[field.key]"><option value="">Seçin</option><option ng-repeat="option in field.options track by option.key" value="{{option.key}}">{{option.name}}</option></select></label>
              </div>
              <button class="button button-positive button-block" type="submit" ng-disabled="vm.saving || shell.pwa.offline">Değişiklikleri kaydet</button>
            </form>

            <section class="mobile-task-section" ng-if="!vm.canEditTask()">
              <div class="mobile-task-section-title"><h2>Özellikler</h2><span>{{vm.membership.role}}</span></div>
              <dl class="mobile-task-properties"><div><dt>Öncelik</dt><dd>{{vm.task.priority}}</dd></div><div><dt>Durum</dt><dd>{{vm.task.status}}</dd></div><div><dt>Son tarih</dt><dd>{{vm.task.dueDate ? (vm.task.dueDate | date:'dd MMM yyyy') : 'Belirtilmemiş'}}</dd></div><div><dt>Sorumlu</dt><dd>{{vm.userName(vm.task.assigneeUserId)}}</dd></div><div ng-repeat="value in vm.task.customFields track by value.fieldKey"><dt>{{vm.fieldDefinition(value).name}}</dt><dd>{{vm.customFieldValue(value)}}</dd></div></dl>
            </section>

            <section class="mobile-task-section" aria-labelledby="mobile-workflow-heading">
              <div class="mobile-task-section-title"><h2 id="mobile-workflow-heading">İş akışı</h2><span>{{vm.task.status}}</span></div>
              <div class="mobile-task-action-row" ng-if="vm.canEditTask() && vm.transitions.length"><button class="button button-small button-stable" type="button" ng-repeat="transition in vm.transitions" ng-click="vm.move(transition.toStatus)" ng-disabled="shell.pwa.offline">{{transition.toStatus}}</button></div>
              <p class="mobile-task-empty" ng-if="!vm.transitions.length">Kullanılabilir geçiş yok.</p>
            </section>

            <section class="mobile-task-section" aria-labelledby="mobile-checklist-heading">
              <div class="mobile-task-section-title"><h2 id="mobile-checklist-heading">Kontrol listesi</h2><span>{{vm.task.checklist.length || 0}}</span></div>
              <ion-checkbox ng-repeat="item in vm.task.checklist track by item.id" ng-checked="item.completed" ng-click="vm.toggleChecklist(item)" ng-disabled="!vm.canEditTask() || shell.pwa.offline">{{item.text}}</ion-checkbox>
              <div class="mobile-task-inline" ng-if="vm.canEditTask()"><input type="text" ng-model="vm.checklistText" placeholder="Yeni madde" aria-label="Yeni kontrol listesi maddesi"><button type="button" ng-click="vm.addChecklist()" ng-disabled="shell.pwa.offline" aria-label="Madde ekle"><i class="ion-plus" aria-hidden="true"></i></button></div>
            </section>

            <section class="mobile-task-section" aria-labelledby="mobile-labels-heading">
              <div class="mobile-task-section-title"><h2 id="mobile-labels-heading">Etiketler</h2><span>{{vm.task.labels.length || 0}}</span></div>
              <div class="mobile-task-chips"><span class="label-chip" ng-repeat="label in vm.task.labels track by $index">{{label}}</span><p class="mobile-task-empty" ng-if="!vm.task.labels.length">Etiket yok.</p></div>
              <div class="mobile-task-inline" ng-if="vm.canEditTask()"><input type="text" ng-model="vm.labelText" placeholder="Etiket" aria-label="Yeni etiket"><button type="button" ng-click="vm.addLabel()" ng-disabled="shell.pwa.offline" aria-label="Etiket ekle"><i class="ion-plus" aria-hidden="true"></i></button></div>
            </section>

            <section class="mobile-task-section" aria-labelledby="mobile-files-heading">
              <div class="mobile-task-section-title"><h2 id="mobile-files-heading">Dosyalar</h2><span>{{vm.streams.attachments.items.length}} / {{vm.streams.attachments.totalCount}}</span></div>
              <div class="mobile-task-file" ng-repeat="attachment in vm.streams.attachments.items track by attachment.id"><button type="button" ng-click="vm.download(attachment)"><i class="ion-document" aria-hidden="true"></i><span>{{attachment.fileName}}<small>{{attachment.contentType}}</small></span></button><button type="button" ng-if="vm.canUpload()" ng-click="vm.removeAttachment(attachment)" ng-disabled="shell.pwa.offline" aria-label="Dosyayı sil"><i class="ion-trash-a" aria-hidden="true"></i></button></div>
              <p class="mobile-task-empty" ng-if="!vm.streams.attachments.items.length">Dosya eklenmemiş.</p>
              <button class="mobile-task-more" type="button" ng-if="vm.streamHasMore('attachments')" ng-click="vm.loadMoreStream('attachments')">Daha fazla dosya</button>
              <div class="mobile-task-upload" ng-if="vm.canUpload()"><label><i class="ion-paperclip" aria-hidden="true"></i><span>{{vm.attachmentFile.name || 'Dosya seç'}}</span><input type="file" file-change="vm.attachmentFile = file" aria-label="Görev dosyası seç"></label><button type="button" aria-label="Dosya yükle" ng-click="vm.upload()" ng-disabled="!vm.attachmentFile || shell.pwa.offline || vm.actionBusy === 'upload'">Yükle</button></div>
            </section>

            <section class="mobile-task-section" aria-labelledby="mobile-relations-heading">
              <div class="mobile-task-section-title"><h2 id="mobile-relations-heading">İlişkiler</h2><span>{{vm.task.relations.length || 0}}</span></div>
              <div class="mobile-task-relation" ng-repeat="relation in vm.task.relations track by $index"><span><strong>{{relation.relationType}}</strong><small>{{vm.relationName(relation)}}</small></span><button type="button" ng-if="vm.canLink()" ng-click="vm.removeRelation(relation)" ng-disabled="shell.pwa.offline" aria-label="İlişkiyi kaldır"><i class="ion-close" aria-hidden="true"></i></button></div>
              <p class="mobile-task-empty" ng-if="!vm.task.relations.length">Bağlı görev yok.</p>
              <div class="mobile-task-relation-form" ng-if="vm.canLink()"><select ng-model="vm.relationDraft.relationType" aria-label="İlişki türü"><option>RelatesTo</option><option>Blocks</option><option>IsBlockedBy</option><option>Duplicates</option></select><select ng-model="vm.relationDraft.relatedWorkItemId" aria-label="İlişkili görev"><option value="">Görev seçin</option><option ng-repeat="candidate in vm.relationCandidates track by candidate.id" value="{{candidate.id}}">{{candidate.title}}</option></select><button type="button" ng-click="vm.addRelation()" ng-disabled="!vm.relationDraft.relatedWorkItemId || shell.pwa.offline">Bağla</button></div>
            </section>

            <section class="mobile-task-section mobile-task-development" aria-labelledby="mobile-development-heading">
              <div class="mobile-task-section-title"><h2 id="mobile-development-heading">Geliştirme</h2><span>{{vm.development.links.length}}</span></div>
              <p class="mobile-task-error" ng-if="vm.development.error" role="alert">{{vm.development.error}}</p>
              <div class="mobile-development-link-loading" ng-if="vm.development.loading" aria-label="Geliştirme bağlantıları yükleniyor"><span></span><span></span></div>
              <article class="mobile-task-development-link" ng-repeat="link in vm.development.links track by link.id" data-tone="{{vm.developmentState(link).tone}}">
                <i class="icon" ng-class="link.kind === 'PullRequest' ? 'ion-pull-request' : (link.kind === 'Commit' ? 'ion-merge' : (link.kind === 'Branch' ? 'ion-fork-repo' : 'ion-ios-pulse-strong'))" aria-hidden="true"></i><span><a ng-href="{{link.url}}" target="_blank" rel="noopener noreferrer">{{link.title}}</a><small>{{link.repositoryFullName}} · {{vm.developmentKind(link.kind)}} · {{vm.developmentState(link).label}}</small><em>{{link.source === 'Webhook' || link.source === 'Automatic' ? 'Webhook ile eşleştirildi' : 'Elle bağlandı'}}<b ng-if="!link.connectionActive"> · Sağlayıcı bağlantısı kesildi</b></em></span><button type="button" ng-if="vm.canLink() && link.source === 'Manual'" ng-click="vm.deleteDevelopmentLink(link)" ng-disabled="shell.pwa.offline || vm.actionBusy" aria-label="{{link.title}} geliştirme bağlantısını kaldır"><i class="ion-unlink" aria-hidden="true"></i></button>
              </article>
              <p class="mobile-task-empty" ng-if="!vm.development.loading && !vm.development.links.length">Bu görevle eşleşen branch, commit, pull request veya build yok.</p>

              <form class="mobile-task-development-form" ng-if="vm.development.editorOpen" ng-submit="vm.createDevelopmentLink()">
                <div><strong>Geliştirme bağlantısı ekle</strong><button type="button" ng-click="vm.closeDevelopmentEditor()" aria-label="Geliştirme bağlantısı formunu kapat"><i class="ion-close" aria-hidden="true"></i></button></div>
                <label><span>Repository</span><select ng-model="vm.development.draft.mappingId" required><option value="">Repository seçin</option><option ng-repeat="mapping in vm.development.mappings track by mapping.id" value="{{mapping.id}}">{{mapping.repositoryFullName}}</option></select></label>
                <div class="mobile-task-development-grid"><label><span>Tür</span><select ng-model="vm.development.draft.kind" required><option value="PullRequest">Pull request</option><option value="Commit">Commit</option><option value="Branch">Dal</option><option value="Build">Build</option></select></label><label><span>Durum</span><select ng-model="vm.development.draft.status" required><option>Open</option><option>Merged</option><option>Closed</option><option>Success</option><option>Failed</option><option>Pending</option><option>Running</option><option>Pushed</option><option>Unknown</option></select></label></div>
                <label><span>Harici kimlik</span><input type="text" ng-model="vm.development.draft.externalId" maxlength="300" placeholder="PR-142 veya commit SHA" required></label>
                <label><span>Başlık</span><input type="text" ng-model="vm.development.draft.title" maxlength="200" required></label>
                <label><span>HTTPS bağlantısı</span><input type="url" ng-model="vm.development.draft.url" maxlength="2048" required></label>
                <div class="mobile-task-development-grid"><label><span>Dal</span><input type="text" ng-model="vm.development.draft.branch" maxlength="255"></label><label><span>Commit SHA</span><input type="text" ng-model="vm.development.draft.commitSha" maxlength="128"></label></div>
                <button class="button button-positive button-block" type="submit" ng-disabled="vm.actionBusy || shell.pwa.offline">Bağlantıyı ekle</button>
              </form>
              <button class="button button-small button-stable icon-left ion-link mobile-development-link-add" ng-if="vm.canLink() && !vm.development.editorOpen && vm.development.mappings.length" ng-click="vm.openDevelopmentEditor()" ng-disabled="shell.pwa.offline">Geliştirme bağlantısı ekle</button>
              <p class="mobile-task-empty" ng-if="vm.canLink() && !vm.development.mappings.length && !vm.development.loading">Bu proje için etkin repository eşlemesi yok.</p>
            </section>

            <section class="mobile-task-section" aria-labelledby="mobile-catalog-heading">
              <div class="mobile-task-section-title"><h2 id="mobile-catalog-heading">Proje bağlantıları</h2><span>{{vm.catalogLinks().length}}</span></div>
              <div class="mobile-task-catalog" ng-repeat="link in vm.catalogLinks() track by link.kind + link.id"><small>{{link.kind}}</small><strong>{{link.name}}</strong><span>{{link.meta}}</span></div>
              <p class="mobile-task-empty" ng-if="!vm.catalogLinks().length">Bağlantılı proje kaydı yok.</p>
            </section>
          </div>

          <div class="mobile-task-activity" ng-if="vm.detailView === 'activity'">
            <nav class="mobile-task-activity-tabs" aria-label="Etkinlik filtresi">
              <button type="button" ng-class="{'active': vm.activityTab === 'all'}" ng-click="vm.activityTab = 'all'">Tümü</button><button type="button" ng-class="{'active': vm.activityTab === 'comments'}" ng-click="vm.activityTab = 'comments'">Yorumlar</button><button type="button" ng-class="{'active': vm.activityTab === 'history'}" ng-click="vm.activityTab = 'history'">Geçmiş</button><button type="button" ng-class="{'active': vm.activityTab === 'worklogs'}" ng-click="vm.activityTab = 'worklogs'">Çalışma</button>
            </nav>

            <section class="mobile-task-section mobile-comment-composer" ng-if="vm.canComment()">
              <label><span>Yorum ekle</span><textarea ng-model="vm.commentBody" rows="4" maxlength="5000" placeholder="Ekiple paylaşın"></textarea></label>
              <div class="mobile-task-mentions" ng-if="vm.commentMentionIds.length"><button type="button" ng-repeat="userId in vm.commentMentionIds track by userId" ng-click="vm.removeCommentMention(userId)">@{{vm.userName(userId)}} <i class="ion-close" aria-hidden="true"></i></button></div>
              <div class="mobile-task-inline"><select ng-model="vm.commentMentionCandidate" aria-label="Yorumda bahsedilecek kişi"><option value="">Kişiden bahset</option><option ng-repeat="user in vm.commentMentionCandidates() track by user.id" value="{{user.id}}">{{vm.userName(user.id)}}</option></select><button type="button" ng-click="vm.addCommentMention()" ng-disabled="!vm.commentMentionCandidate" aria-label="Bahsetme ekle"><i class="ion-at" aria-hidden="true"></i></button></div>
              <button class="button button-positive button-block" type="button" ng-click="vm.addComment()" ng-disabled="!vm.commentBody.trim() || shell.pwa.offline">Yorumu gönder</button>
            </section>

            <section class="mobile-task-section mobile-activity-stream" aria-live="polite">
              <div class="mobile-activity-entry" ng-repeat="entry in vm.activityEntries() track by entry.id"><i class="ion-ios-pulse" aria-hidden="true"></i><div><strong>{{vm.activityLabel(entry.type || entry.action || entry.eventType)}}</strong><p ng-bind="entry.body || entry.note || entry.detail || entry.message || entry.description || 'Görev güncellendi.'"></p><small>{{vm.userName(entry.actorUserId || entry.userId || entry.authorUserId)}} · {{entry.createdAt || entry.occurredAt | date:'dd MMM HH:mm'}}</small></div></div>
              <p class="mobile-task-empty" ng-if="!vm.activityEntries().length">Bu filtrede etkinlik yok.</p>
              <button class="mobile-task-more" type="button" ng-if="vm.streamHasMore(vm.activityStreamName())" ng-click="vm.loadMoreStream(vm.activityStreamName())">Daha fazla etkinlik</button>
            </section>

            <section class="mobile-task-section" ng-if="vm.canLogWork() || vm.streams.worklogs.totalCount">
              <div class="mobile-task-section-title"><h2>Çalışma kayıtları</h2><span>{{vm.streams.worklogs.items.length}} / {{vm.streams.worklogs.totalCount}}</span></div>
              <div class="mobile-task-worklog" ng-repeat="log in vm.streams.worklogs.items track by log.id"><span>{{log.note || 'Not yok'}}</span><strong>{{log.hours}} sa</strong></div>
              <form class="mobile-task-worklog-form" ng-if="vm.canLogWork()" ng-submit="vm.addWorkLog()"><input type="number" min="0.25" step="0.25" ng-model="vm.workLogDraft.hours" placeholder="Saat" aria-label="Çalışma saati" required><input type="text" ng-model="vm.workLogDraft.note" placeholder="Not" aria-label="Çalışma notu"><button type="submit" ng-disabled="shell.pwa.offline">Ekle</button></form>
            </section>

            <section class="mobile-task-section" ng-if="vm.streams.approvals.totalCount">
              <div class="mobile-task-section-title"><h2>Onaylar</h2><span>{{vm.streams.approvals.items.length}} / {{vm.streams.approvals.totalCount}}</span></div>
              <label class="mobile-approval-note" ng-if="vm.canApprove()"><span>Karar notu</span><input type="text" ng-model="vm.approvalNote" maxlength="1000"></label>
              <div class="mobile-task-approval" ng-repeat="approval in vm.streams.approvals.items track by approval.id"><span><strong>{{approval.fromStatus}} → {{approval.toStatus}}</strong><small>{{approval.status}} · {{vm.userName(approval.requestedByUserId)}}</small></span><div ng-if="vm.canApprove() && approval.status === 'Pending'"><button type="button" ng-click="vm.decideApproval(approval, true)" ng-disabled="shell.pwa.offline" aria-label="Onayla"><i class="ion-checkmark" aria-hidden="true"></i></button><button type="button" ng-click="vm.decideApproval(approval, false)" ng-disabled="shell.pwa.offline" aria-label="Reddet"><i class="ion-close" aria-hidden="true"></i></button></div></div>
              <button class="mobile-task-more" type="button" ng-if="vm.streamHasMore('approvals')" ng-click="vm.loadMoreStream('approvals')">Daha fazla onay</button>
            </section>
          </div>
        </div>
      </ion-content>
    </ion-view>
  </script>

  <script id="templates/tabs.html" type="text/ng-template">
    <ion-tabs class="tabs-icon-top tabs-stable zumbo-primary-tabs" aria-label="Birincil gezinme">
      <ion-tab title="Ana sayfa" icon="ion-ios-home" href="#/app/dashboard">
        <ion-nav-view name="home"></ion-nav-view>
      </ion-tab>
      <ion-tab title="İşlerim" icon="ion-ios-checkmark" href="#/app/tasks">
        <ion-nav-view name="work"></ion-nav-view>
      </ion-tab>
      <ion-tab title="Oluştur" icon="ion-plus-round" href="#/app/create" class="zumbo-create-tab">
        <ion-nav-view name="create"></ion-nav-view>
      </ion-tab>
      <ion-tab title="Gelen kutusu" icon="ion-ios-bell" href="#/app/notifications">
        <ion-nav-view name="inbox"></ion-nav-view>
      </ion-tab>
      <ion-tab title="Daha fazla" icon="ion-grid" href="#/app/more">
        <ion-nav-view name="more"></ion-nav-view>
      </ion-tab>

  </script>

  <script id="templates/dashboard.html" type="text/ng-template">
    <ion-view view-title="Ana sayfa">
      <ion-content class="workspace" delegate-handle="dashboardScroll">
        <ion-refresher pulling-text="Yenile" on-refresh="vm.refresh()"></ion-refresher>
        <div class="mobile-degraded-state" ng-if="vm.searchDegraded" role="status">Arama geçici olarak sınırlı. Görevler güvenli yedek görünümden gösteriliyor.</div>
        <nav class="mobile-home-actions" aria-label="Hızlı işlemler">
          <button type="button" ui-sref="app.projects"><i class="icon ion-folder" aria-hidden="true"></i><span>Projeler</span></button>
          <button type="button" ui-sref="app.search"><i class="icon ion-search" aria-hidden="true"></i><span>Ara</span></button>
          <button type="button" ui-sref="app.create"><i class="icon ion-plus-round" aria-hidden="true"></i><span>Oluştur</span></button>
        </nav>
        <section class="metric-band">
          <div>
            <strong>{{vm.summary.total || 0}}</strong>
            <span>Toplam</span>
          </div>
          <div>
            <strong>{{vm.summary.inProgress || 0}}</strong>
            <span>Aktif</span>
          </div>
          <div>
            <strong>{{vm.summary.done || 0}}</strong>
            <span>Tamam</span>
          </div>
          <div>
            <strong>{{vm.summary.overdue || 0}}</strong>
            <span>Geciken</span>
          </div>
        </section>
        <div class="segmented mobile-focus-segments" role="tablist" aria-label="Kişisel iş görünümü"><button role="tab" aria-selected="{{vm.mode==='assigned'}}" tabindex="{{vm.mode==='assigned' ? 0 : -1}}" ng-class="{active:vm.mode==='assigned'}" ng-click="vm.setMode('assigned')">Açık</button><button role="tab" aria-selected="{{vm.mode==='due'}}" tabindex="{{vm.mode==='due' ? 0 : -1}}" ng-class="{active:vm.mode==='due'}" ng-click="vm.setMode('due')">Tarihli</button><button role="tab" aria-selected="{{vm.mode==='blocked'}}" tabindex="{{vm.mode==='blocked' ? 0 : -1}}" ng-class="{active:vm.mode==='blocked'}" ng-click="vm.setMode('blocked')">Engelli</button><button role="tab" aria-selected="{{vm.mode==='recent'}}" tabindex="{{vm.mode==='recent' ? 0 : -1}}" ng-class="{active:vm.mode==='recent'}" ng-click="vm.setMode('recent')">Son</button></div>
        <div class="section-title">Kişisel işler</div>
        <ion-list>
          <ion-item class="task-row" ng-repeat="task in vm.visibleTaskItems track by task.id" ng-click="vm.openTask(task)">
            <h2>{{task.title}}</h2>
            <p>{{task.status}} · {{task.priority}}</p>
            <time ng-if="task.dueDate">{{task.dueDate | date:'dd MMM'}}</time>
            <span class="badge badge-balanced" ng-if="task.status === 'Done'">tamam</span>
          </ion-item>
          <ion-item ng-if="!vm.visibleTaskItems.length">Bu görünümde iş yok.</ion-item>
        </ion-list>
      </ion-content>
    </ion-view>
  </script>

  <script id="templates/create.html" type="text/ng-template">
    <ion-view view-title="Oluştur">
      <ion-content class="workspace mobile-shell-surface">
        <header class="mobile-shell-heading">
          <span>Yeni kayıt</span>
          <h2>Görev oluştur</h2>
          <p>İşi doğru bağlamda başlatmak için projeyi seçin.</p>
        </header>
        <div class="mobile-shell-offline" ng-if="shell.pwa.offline" role="status">
          <i class="icon ion-cloud" aria-hidden="true"></i>
          <span>Çevrimdışıyken oluşturma salt okunurdur.</span>
        </div>
        <div class="mobile-state" ng-if="vm.loading" aria-live="polite">Projeler yükleniyor...</div>
        <div class="mobile-state is-error" ng-if="vm.error" role="alert">
          <span>{{vm.error}}</span>
          <button type="button" class="button button-small button-clear" ng-click="vm.error = ''">Kapat</button>
        </div>
        <form class="mobile-create-entry" ng-if="!vm.loading && vm.projects.length" ng-submit="vm.continueToForm()">
          <label>
            <span>Proje</span>
            <select ng-model="vm.selectedProjectId" ng-options="project.id as (project.key + ' · ' + project.name) for project in vm.projects" required>
              <option value="">Proje seçin</option>
            </select>
          </label>
          <button type="submit" class="button button-block button-positive icon-right ion-arrow-right-c" ng-disabled="shell.pwa.offline">Görev ayrıntılarına geç</button>
        </form>
        <section class="mobile-shell-empty" ng-if="!vm.loading && !vm.projects.length && !vm.error">
          <i class="icon ion-folder" aria-hidden="true"></i>
          <h3>Kullanılabilir proje yok</h3>
          <p>Görev eklemeden önce erişebildiğiniz bir proje oluşturun.</p>
          <button type="button" class="button button-stable" ui-sref="app.projects">Projelere git</button>
        </section>
      </ion-content>
    </ion-view>
  </script>

  <script id="templates/more.html" type="text/ng-template">
    <ion-view view-title="Daha fazla">
      <ion-content class="workspace mobile-shell-surface">
        <header class="mobile-shell-heading mobile-more-heading">
          <span>{{shell.organizationName()}}</span>
          <h2>Daha fazla</h2>
          <p>{{vm.session.currentUser.displayName || vm.session.currentUser.username || 'Zumbo kullanıcısı'}}</p>
        </header>
        <nav class="mobile-more-nav" aria-label="İkincil gezinme">
          <button type="button" ui-sref="app.projects">
            <i class="icon ion-folder" aria-hidden="true"></i>
            <span><strong>Projeler ve ekipler</strong><small>Çalışma alanları, ekipler ve arşiv</small></span>
            <i class="icon ion-chevron-right" aria-hidden="true"></i>
          </button>
          <button type="button" ui-sref="portfolio-center">
            <i class="icon ion-map" aria-hidden="true"></i>
            <span><strong>Portföyler</strong><small>Initiative, sağlık ve çapraz proje planı</small></span>
            <i class="icon ion-chevron-right" aria-hidden="true"></i>
          </button>
          <button type="button" ui-sref="goal-center">
            <i class="icon ion-ios-circle-filled" aria-hidden="true"></i>
            <span><strong>Hedefler</strong><small>Key result, ilerleme ve güven geçmişi</small></span>
            <i class="icon ion-chevron-right" aria-hidden="true"></i>
          </button>
          <button type="button" ui-sref="capacity-center">
            <i class="icon ion-speedometer" aria-hidden="true"></i>
            <span><strong>Kapasite</strong><small>Kişi, proje ve senaryo tahsisleri</small></span>
            <i class="icon ion-chevron-right" aria-hidden="true"></i>
          </button>
          <button type="button" ui-sref="knowledge-center">
            <i class="icon ion-ios-book" aria-hidden="true"></i>
            <span><strong>Bilgi</strong><small>Proje kararları, sürümler ve yorumlar</small></span>
            <i class="icon ion-chevron-right" aria-hidden="true"></i>
          </button>
          <button type="button" ui-sref="app.search">
            <i class="icon ion-search" aria-hidden="true"></i>
            <span><strong>Arama</strong><small>Projelerde işe ulaşın</small></span>
            <i class="icon ion-chevron-right" aria-hidden="true"></i>
          </button>
          <button type="button" ui-sref="app.profile">
            <i class="icon ion-gear-a" aria-hidden="true"></i>
            <span><strong>Ayarlar</strong><small>Hesap, güvenlik ve yönetim</small></span>
            <i class="icon ion-chevron-right" aria-hidden="true"></i>
          </button>
        </nav>
      </ion-content>
    </ion-view>

  <script id="templates/goals.html" type="text/ng-template">
    <ion-view view-title="Hedefler">
      <ion-content class="workspace mobile-goal">
        <ion-refresher pulling-text="Yenile" on-refresh="vm.load()"></ion-refresher>
        <header class="mobile-goal-head"><div><small>Sonuç odaklı planlama</small><h2>{{vm.goal ? vm.goal.name : 'Hedefler'}}</h2></div><button type="button" ng-click="vm.newGoal()" aria-label="Hedef oluştur" title="Hedef oluştur"><i class="icon ion-plus-round" aria-hidden="true"></i></button></header>
        <div class="mobile-feedback success" ng-if="vm.notice" role="status">{{vm.notice}}</div>
        <div class="mobile-feedback error" ng-if="vm.error" role="alert">{{vm.error}}</div>
        <div class="mobile-state" ng-if="vm.loading && !vm.goal">Hedefler yükleniyor...</div>
        <nav class="mobile-goal-register" ng-if="vm.goals.length" aria-label="Hedef listesi"><button type="button" ng-repeat="item in vm.goals track by item.id" ng-class="{active:vm.goal.id===item.id}" ng-click="vm.select(item)"><strong>{{item.name}}</strong><small>{{vm.statusLabel(item.status)}} · {{item.progress}}%</small></button></nav>

        <form class="mobile-goal-form" ng-if="!vm.goal || vm.mode==='definition'" ng-submit="vm.saveGoal()">
          <label><span>Hedef adı</span><input type="text" ng-model="vm.goalDraft.name" maxlength="160" required ng-disabled="vm.goal && !vm.goal.canEdit"></label>
          <label><span>Açıklama</span><textarea ng-model="vm.goalDraft.description" maxlength="2000" rows="3" ng-disabled="vm.goal && !vm.goal.canEdit"></textarea></label>
          <div class="mobile-goal-fields"><label><span>Dönem başlangıcı</span><input type="date" ng-model="vm.goalDraft.periodStart" required ng-disabled="vm.goal && !vm.goal.canEdit"></label><label><span>Dönem bitişi</span><input type="date" ng-model="vm.goalDraft.periodEnd" required ng-disabled="vm.goal && !vm.goal.canEdit"></label></div>
          <label><span>Görüntüleyiciler</span><select multiple ng-model="vm.goalDraft.viewerUserIds" ng-options="user.id as vm.userName(user.id) for user in vm.users" ng-disabled="vm.goal && !vm.goal.canEdit"></select></label>
          <label><span>Initiative bağlantıları</span><select multiple ng-model="vm.initiativeKeys" ng-options="item.key as item.label for item in vm.initiativeOptions" ng-disabled="vm.goal && !vm.goal.canEdit"></select></label>
          <label><span>Proje bağlantıları</span><select multiple ng-model="vm.goalDraft.projectIds" ng-options="project.id as (project.key + ' · ' + project.name) for project in vm.projects" ng-disabled="vm.goal && !vm.goal.canEdit"></select></label>
          <button class="button button-positive button-block" type="submit" ng-if="!vm.goal || vm.goal.canEdit" ng-disabled="vm.saving || shell.pwa.offline">{{vm.goal ? 'Hedefi kaydet' : 'Hedefi oluştur'}}</button>
          <button class="button button-assertive button-outline button-block" type="button" ng-if="vm.goal && vm.goal.canEdit" ng-click="vm.archiveGoal()" ng-disabled="vm.saving || shell.pwa.offline">Hedefi arşivle</button>
        </form>

        <section ng-if="vm.goal && vm.mode!=='definition'">
          <div class="mobile-goal-readonly" ng-if="!vm.goal.canEdit" role="status"><i class="icon ion-eye" aria-hidden="true"></i><span>Hedef salt okunur; sahibi olduğunuz key result ilerlemesini güncelleyebilirsiniz.</span></div>
          <div class="mobile-goal-metrics"><div><strong>{{vm.goal.progress}}%</strong><span>İlerleme</span></div><div><strong>{{vm.statusLabel(vm.goal.status)}}</strong><span>Durum</span></div><div><strong>{{vm.goal.confidence == null ? 'Yok' : vm.goal.confidence + '%'}}</strong><span>Güven</span></div></div>
          <div class="mobile-goal-partial" ng-if="vm.rollup.sourceStatus==='Partial'" role="status">{{vm.rollup.unavailableSources.length}} bağlantı erişilemedi. İlerleme explicit key result ölçümlerinden hesaplanır.</div>
          <nav class="mobile-goal-tabs" role="tablist" aria-label="Hedef alanları"><button role="tab" aria-selected="{{vm.mode==='key-results'}}" ng-class="{active:vm.mode==='key-results'}" ng-click="vm.setMode('key-results')">Sonuçlar</button><button role="tab" aria-selected="{{vm.mode==='updates'}}" ng-class="{active:vm.mode==='updates'}" ng-click="vm.setMode('updates')">Durum</button><button role="tab" aria-selected="{{vm.mode==='sources'}}" ng-class="{active:vm.mode==='sources'}" ng-click="vm.setMode('sources')">Bağlar</button><button role="tab" aria-selected="{{vm.mode==='definition'}}" ng-class="{active:vm.mode==='definition'}" ng-click="vm.setMode('definition')">Tanım</button></nav>

          <div ng-if="vm.mode==='key-results'">
            <button class="button button-small button-stable button-block" ng-if="vm.goal.canEdit" ng-click="vm.newKeyResult(); vm.setMode('key-result-form')">Key result ekle</button>
            <div class="mobile-goal-list"><article class="mobile-goal-row" ng-repeat="item in vm.goal.keyResults track by item.id"><header><span><strong>{{item.name}}</strong><small>{{vm.userName(item.ownerUserId)}} · {{vm.directionLabel(item.direction)}}</small></span><b>{{item.progress}}%</b></header><div class="mobile-goal-progress" aria-label="{{item.progress}} yüzde tamamlandı"><i ng-style="{width:item.progress+'%'}"></i></div><footer><span>{{item.currentValue}} / {{item.targetValue}} {{item.unit}}</span><span><button class="button button-icon icon ion-edit" ng-if="vm.goal.canEdit" ng-click="vm.editKeyResult(item)" aria-label="Key result düzenle"></button><button class="button button-icon icon ion-arrow-graph-up-right" ng-if="item.canUpdate" ng-click="vm.prepareProgress(item)" aria-label="İlerleme güncelle"></button></span></footer><div class="mobile-goal-history" ng-if="item.progressUpdates.length"><small>En yeni {{item.progressUpdateRetentionLimit}} ilerleme kaydı korunur.</small><article ng-repeat="update in item.progressUpdates track by update.id"><p>{{update.note}}</p><small>{{update.previousValue}} → {{update.currentValue}} {{item.unit}} · {{update.createdAt | date:'dd MMM HH:mm'}}</small></article></div></article><p class="mobile-state" ng-if="!vm.goal.keyResults.length">Henüz key result yok.</p></div>
          </div>

          <form class="mobile-goal-form" ng-if="vm.mode==='key-result-form' && vm.goal.canEdit" ng-submit="vm.saveKeyResult()">
            <label><span>Key result</span><input ng-model="vm.keyResultDraft.name" maxlength="160" required></label>
            <label><span>Sahip</span><select ng-model="vm.keyResultDraft.ownerUserId" ng-options="user.id as vm.userName(user.id) for user in vm.users" required></select></label>
            <div class="mobile-goal-fields"><label><span>Yön</span><select ng-model="vm.keyResultDraft.direction"><option value="Increase">Artış</option><option value="Decrease">Azalış</option></select></label><label><span>Birim</span><input ng-model="vm.keyResultDraft.unit" maxlength="32" required></label></div>
            <div class="mobile-goal-fields"><label><span>Baseline</span><input type="number" step="any" ng-model="vm.keyResultDraft.baselineValue" required></label><label><span>Target</span><input type="number" step="any" ng-model="vm.keyResultDraft.targetValue" required></label></div>
            <label><span>{{vm.keyResultDraft.id ? 'Güncel değer' : 'Başlangıç değeri'}}</span><input type="number" step="any" ng-model="vm.keyResultDraft.initialValue" required ng-disabled="vm.keyResultDraft.id"></label>
            <label><span>Açıklama</span><textarea ng-model="vm.keyResultDraft.description" maxlength="1000" rows="3"></textarea></label>
            <button class="button button-positive button-block" type="submit" ng-disabled="vm.saving || shell.pwa.offline">Key result'ı kaydet</button>
            <button class="button button-stable button-block" type="button" ng-click="vm.setMode('key-results')">İptal</button>
          </form>

          <form class="mobile-goal-form" ng-if="vm.mode==='progress-form' && vm.activeKeyResult.canUpdate" ng-submit="vm.saveProgress()">
            <h3>{{vm.activeKeyResult.name}}</h3>
            <div class="mobile-goal-fields"><label><span>Güncel değer</span><input type="number" step="any" ng-model="vm.progressDraft.currentValue" required></label><label><span>Güven</span><input type="number" min="0" max="100" ng-model="vm.progressDraft.confidence"></label></div>
            <label><span>İlerleme notu</span><textarea ng-model="vm.progressDraft.note" maxlength="1000" rows="4" required></textarea></label>
            <button class="button button-positive button-block" type="submit" ng-disabled="vm.saving || shell.pwa.offline">İlerlemeyi yayınla</button>
            <button class="button button-stable button-block" type="button" ng-click="vm.setMode('key-results')">İptal</button>
          </form>

          <div ng-if="vm.mode==='updates'">
            <form class="mobile-goal-form" ng-if="vm.goal.canUpdateStatus" ng-submit="vm.saveStatus()"><div class="mobile-goal-fields"><label><span>Durum</span><select ng-model="vm.statusDraft.status"><option>Draft</option><option>Active</option><option>Paused</option><option>Completed</option><option>Cancelled</option></select></label><label><span>Sağlık</span><select ng-model="vm.statusDraft.health"><option>NoUpdate</option><option>OnTrack</option><option>AtRisk</option><option>OffTrack</option></select></label></div><label><span>Güven</span><input type="number" min="0" max="100" ng-model="vm.statusDraft.confidence"></label><label><span>Durum notu</span><textarea ng-model="vm.statusDraft.note" maxlength="1000" rows="4" required></textarea></label><button class="button button-positive button-block" type="submit" ng-disabled="vm.saving || shell.pwa.offline">Durumu yayınla</button></form>
            <div class="mobile-goal-history"><small>En yeni {{vm.goal.statusUpdateRetentionLimit}} durum kaydı korunur.</small><article ng-repeat="update in vm.goal.statusUpdates track by update.id"><p>{{update.note}}</p><small>{{vm.statusLabel(update.status)}} · {{vm.healthLabel(update.health)}} · {{update.confidence == null ? 'Güven yok' : update.confidence + '%'}} · {{update.createdAt | date:'dd MMM HH:mm'}}</small></article><p class="mobile-state" ng-if="!vm.goal.statusUpdates.length">Henüz durum güncellemesi yok.</p></div>
          </div>

          <div class="mobile-goal-sources" ng-if="vm.mode==='sources'"><h3>Initiative'ler</h3><div class="mobile-goal-source" ng-repeat="item in vm.rollup.initiatives track by (item.portfolioId + ':' + item.id)"><span><strong>{{item.name}}</strong><small>{{vm.statusLabel(item.status)}}</small></span><b class="mobile-goal-health" data-health="{{item.health}}">{{vm.healthLabel(item.health)}}</b></div><p ng-if="!vm.rollup.initiatives.length">Bağlı initiative yok.</p><h3>Projeler</h3><div class="mobile-goal-source" ng-repeat="item in vm.rollup.projects track by item.id"><span><strong>{{item.name}}</strong><small>{{item.key}}</small></span><i class="icon ion-folder" aria-hidden="true"></i></div><p ng-if="!vm.rollup.projects.length">Bağlı proje yok.</p></div>
        </section>
      </ion-content>
    </ion-view>
  </script>

  <script id="templates/knowledge.html" type="text/ng-template">
    <ion-view view-title="Bilgi">
      <ion-content class="workspace mobile-knowledge">
        <ion-refresher pulling-text="Yenile" on-refresh="vm.load()"></ion-refresher>
        <header class="mobile-knowledge-head"><div><small>Proje bağlamı</small><h2>{{vm.document ? vm.document.title : 'Bilgi'}}</h2></div><button type="button" ng-if="vm.canCreate()" ng-click="vm.newDocument()" aria-label="Doküman oluştur" title="Doküman oluştur"><i class="icon ion-plus-round" aria-hidden="true"></i></button></header>
        <form class="mobile-knowledge-search" ng-submit="vm.load()"><label class="sr-only" for="mobile-knowledge-search">Dokümanlarda ara</label><input id="mobile-knowledge-search" type="search" ng-model="vm.query" maxlength="100" placeholder="Başlık, içerik veya etiket"><button class="button button-stable button-icon icon ion-search" type="submit" ng-disabled="vm.loading" aria-label="Ara"></button></form>
        <div class="mobile-feedback success" role="status" aria-live="polite" ng-if="vm.notice">{{vm.notice}}</div>
        <div class="mobile-feedback error" role="alert" aria-live="assertive" ng-if="vm.error">{{vm.error}}</div>
        <div class="mobile-state" ng-if="vm.loading && !vm.document">Dokümanlar yükleniyor...</div>
        <div class="mobile-knowledge-partial" ng-if="vm.sourceStatus==='Partial'" role="status">Arama ilk 1.000 erişilebilir adayla sınırlıdır.</div>
        <nav class="mobile-knowledge-register" ng-if="vm.documents.length" aria-label="Bilgi dokümanı listesi"><button type="button" ng-repeat="item in vm.documents track by item.id" ng-class="{active:vm.document && vm.document.id===item.id}" ng-click="vm.select(item)"><strong>{{item.title}}</strong><small>{{item.scopeName}} · v{{item.currentContentVersion}}</small></button></nav>
        <div class="mobile-state" ng-if="!vm.loading && !vm.document && !vm.canCreate()">Yönetebildiğiniz proje veya initiative olmadığından doküman oluşturamazsınız.</div>

        <form class="mobile-knowledge-form" ng-if="(!vm.document && vm.canCreate()) || (vm.document && vm.mode==='edit' && vm.document.canEdit)" ng-submit="vm.save()">
          <label><span>Bağlam</span><select ng-model="vm.draft.scopeKey" ng-options="scope.key as scope.label group by scope.type for scope in vm.scopes" ng-change="vm.scopeChanged()" required ng-disabled="vm.document"><option value="">Proje veya initiative seçin</option></select></label>
          <label><span>Başlık</span><input type="text" ng-model="vm.draft.title" maxlength="160" required></label>
          <label><span>İçerik · sınırlı Markdown</span><textarea class="content" ng-model="vm.draft.contentMarkdown" maxlength="40000" rows="12"></textarea></label>
          <label><span>Etiketler · virgülle ayırın</span><input type="text" ng-model="vm.draft.tagsText" maxlength="660" placeholder="karar, güvenlik, runbook"></label>
          <label><span>Bağlı işler · {{vm.draft.workItemIds.length}}/50</span><select multiple ng-model="vm.draft.workItemIds" ng-options="item.id as item.label for item in vm.linkOptions.workItems"></select></label>
          <label><span>İlgili kullanıcılar · {{vm.draft.userIds.length}}/30</span><select multiple ng-model="vm.draft.userIds" ng-options="item.id as item.label for item in vm.linkOptions.users"></select></label>
          <div class="mobile-knowledge-partial" ng-if="vm.linkOptions.sourceStatus==='Partial'" role="status">Bağlantı seçenekleri ilk 100 sonuçla sınırlıdır.</div>
          <label><span>Sürüm özeti</span><input type="text" ng-model="vm.draft.changeSummary" maxlength="500" required placeholder="Bu sürümde ne değişti?"></label>
          <button class="button button-positive button-block" type="submit" ng-disabled="vm.saving || shell.pwa.offline">{{vm.document ? 'Yeni sürümü kaydet' : 'Dokümanı oluştur'}}</button>
          <button class="button button-stable button-block" type="button" ng-if="vm.document" ng-click="vm.showCurrent()">İptal</button>
          <button class="button button-assertive button-outline button-block" type="button" ng-if="vm.document" ng-click="vm.archive()" ng-disabled="vm.saving || shell.pwa.offline">Dokümanı arşivle</button>
        </form>

        <section ng-if="vm.document && vm.mode!=='edit'">
          <div class="mobile-knowledge-readonly" ng-if="!vm.document.canEdit" role="status"><i class="icon ion-eye" aria-hidden="true"></i><span>Bu doküman salt okunur. Yorum yetkiniz bağlam rolünüze göre belirlenir.</span></div>
          <nav class="mobile-knowledge-tabs" role="tablist" aria-label="Doküman alanları"><button role="tab" aria-selected="{{vm.mode==='content'}}" ng-class="{active:vm.mode==='content'}" ng-click="vm.mode='content'">İçerik</button><button role="tab" aria-selected="{{vm.mode==='history'}}" ng-class="{active:vm.mode==='history'}" ng-click="vm.mode='history'">Geçmiş</button><button role="tab" aria-selected="{{vm.mode==='comments'}}" ng-class="{active:vm.mode==='comments'}" ng-click="vm.mode='comments'">Yorumlar</button><button role="tab" aria-selected="{{vm.mode==='links'}}" ng-class="{active:vm.mode==='links'}" ng-click="vm.mode='links'">Bağlar</button></nav>

          <article class="mobile-knowledge-content" ng-if="vm.mode==='content'">
            <header><small>{{vm.document.scopeName}}</small><h2>{{vm.previewVersion ? vm.previewVersion.title : vm.document.title}}</h2></header>
            <div class="mobile-knowledge-preview" ng-if="vm.previewVersion" role="status">v{{vm.previewVersion.number}} geçmiş sürümü. <button class="button button-small button-stable" type="button" ng-click="vm.showCurrent()">Güncele dön</button></div>
            <div class="mobile-knowledge-meta"><div><span>Sürüm</span><strong>v{{vm.previewVersion ? vm.previewVersion.number : vm.document.currentContentVersion}}</strong></div><div><span>Güncelleme</span><strong>{{(vm.previewVersion ? vm.previewVersion.createdAt : vm.document.updatedAt) | date:'dd MMM HH:mm'}}</strong></div></div>
            <button class="button button-small button-stable icon-left ion-edit" type="button" ng-if="vm.document.canEdit" ng-click="vm.mode='edit'; vm.draft.changeSummary=''">Yeni sürüm</button>
