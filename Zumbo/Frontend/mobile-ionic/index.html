<!doctype html>
<html lang="tr" ng-app="zumboMobile" ng-csp="no-unsafe-eval;no-inline-style">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#173f46">
  <title>Zumbo Mobile</title>
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="icon" href="../shared/zumbo-mark.svg" type="image/svg+xml">
  <link rel="stylesheet" href="../vendor/ionic/css/ionic.min.css">
  <link rel="stylesheet" href="../shared/design-system.css">
  <link rel="stylesheet" href="./styles.css">
  <link rel="stylesheet" href="./planning-views.css">
  <link rel="stylesheet" href="./reporting-views.css">
  <link rel="stylesheet" href="./project-catalog.css">
  <link rel="stylesheet" href="./intake-center.css">
  <link rel="stylesheet" href="./work-automation.css">
  <link rel="stylesheet" href="./bulk-job-center.css">
  <link rel="stylesheet" href="./privacy-center.css">
  <link rel="stylesheet" href="./integration-center.css">
  <link rel="stylesheet" href="./operations-center.css">
</head>
<body ng-controller="ShellController as shell" ng-class="{'theme-dark': shell.theme === 'dark', 'pwa-state-active': shell.pwa.offline || shell.pwa.updateReady || shell.pwa.installError, 'session-restoring': shell.sessionRestoring}" ng-attr-aria-busy="{{shell.sessionRestoring ? 'true' : 'false'}}">
  <a class="skip-link" href="#mobile-main">Ana içeriğe geç</a>
  <ion-nav-bar class="bar-stable">
    <ion-nav-back-button></ion-nav-back-button>
  </ion-nav-bar>

  <div class="mobile-pwa-state" ng-class="{'offline': shell.pwa.offline && !shell.pwa.installError, 'update': shell.pwa.updateReady && !shell.pwa.offline && !shell.pwa.installError, 'error': shell.pwa.installError}" role="status" aria-live="polite" ng-if="shell.pwa.offline || shell.pwa.updateReady || shell.pwa.installError">
    <span ng-if="shell.pwa.installError">Çevrimdışı kullanım hazırlanamadı. Bağlantınızı denetleyin.</span>
    <span ng-if="shell.pwa.offline && !shell.pwa.installError">Çevrimdışısınız. Kayıtlı uygulama kabuğu salt okunur kullanılabilir.</span>
    <span ng-if="shell.pwa.updateReady && !shell.pwa.offline && !shell.pwa.installError">Zumbo güncellemesi hazır.</span>
    <button class="button button-small button-light" ng-if="shell.pwa.updateReady && !shell.pwa.offline && !shell.pwa.installError" ng-click="shell.applyUpdate()">Güncelle</button>
  </div>

  <ion-nav-view id="mobile-main" role="main" tabindex="-1"></ion-nav-view>

  <script id="templates/login.html" type="text/ng-template">
    <ion-view view-title="Zumbo">
      <ion-content class="login-surface login-entry-surface">
        <div class="brand-lockup">
          <img src="../shared/zumbo-mark.svg" alt="">
          <p class="zumbo-kicker">Ekip çalışma alanı</p>
          <h1>Zumbo</h1>
          <p>İşinize kaldığınız yerden devam edin.</p>
        </div>
        <form class="list login-form" ng-submit="vm.login()">
          <label class="item item-input">
            <span class="input-label">Kullanıcı</span>
            <input type="text" ng-model="vm.form.usernameOrEmail" placeholder="Kullanıcı adı veya e-posta">
          </label>
          <label class="item item-input">
            <span class="input-label">Parola</span>
            <input type="password" ng-model="vm.form.password" placeholder="Parolanız">
          </label>
          <label class="item item-input" ng-if="vm.mfaRequired">
            <span class="input-label">Doğrulama</span>
            <input type="text" ng-model="vm.form.mfaCode" inputmode="numeric" autocomplete="one-time-code" maxlength="16">
          </label>
          <button class="button button-positive button-block" type="submit" ng-disabled="shell.pwa.offline">Giriş yap</button>
          <a class="button button-clear button-positive button-block" href="#/forgot-password">Parolamı unuttum</a>
          <button class="button button-light button-block" type="button" ng-click="vm.demo()" ng-disabled="vm.demoPending || shell.pwa.offline">Demo kullanıcı oluştur</button>
          <p class="error-line" role="alert" aria-live="assertive" ng-if="vm.error">{{vm.error}}</p>
        </form>
      </ion-content>
    </ion-view>
  </script>

  <script id="templates/forgot-password.html" type="text/ng-template">
    <ion-view view-title="Parola sıfırlama">
      <ion-content class="login-surface">
        <form class="list login-form" ng-submit="vm.submit()" ng-if="!vm.sent">
          <label class="item item-input">
            <span class="input-label">Email</span>
            <input type="email" ng-model="vm.email" autocomplete="email" required>
          </label>
          <button class="button button-positive button-block" type="submit" ng-disabled="vm.pending || shell.pwa.offline">Bağlantı gönder</button>
          <button class="button button-clear button-stable button-block" type="button" ng-click="vm.back()">Girişe dön</button>
          <p class="error-line" role="alert" aria-live="assertive" ng-if="vm.error">{{vm.error}}</p>
        </form>
        <div class="list login-form" ng-if="vm.sent">
          <div class="item item-text-wrap">Hesap eşleşirse parola sıfırlama bağlantısı gönderildi.</div>
          <button class="button button-positive button-block" type="button" ng-click="vm.back()">Girişe dön</button>
        </div>
      </ion-content>
    </ion-view>
  </script>

  <script id="templates/reset-password.html" type="text/ng-template">
    <ion-view view-title="Yeni parola">
      <ion-content class="login-surface">
        <form class="list login-form" ng-submit="vm.submit()" ng-if="!vm.reset">
          <label class="item item-input">
            <span class="input-label">Yeni parola</span>
            <input type="password" ng-model="vm.form.newPassword" autocomplete="new-password" required>
          </label>
          <label class="item item-input">
            <span class="input-label">Tekrar</span>
            <input type="password" ng-model="vm.form.confirmPassword" autocomplete="new-password" required>
          </label>
          <button class="button button-positive button-block" type="submit" ng-disabled="vm.pending || shell.pwa.offline">Parolayı değiştir</button>
          <p class="error-line" role="alert" aria-live="assertive" ng-if="vm.error">{{vm.error}}</p>
        </form>
        <div class="list login-form" ng-if="vm.reset">
          <div class="item item-text-wrap">Parolanız değiştirildi.</div>
          <button class="button button-positive button-block" type="button" ng-click="vm.back()">Giriş yap</button>
        </div>
      </ion-content>
    </ion-view>
  </script>

  <script id="templates/project-detail.html" type="text/ng-template">
    <ion-view view-title="{{vm.project.name || 'Proje'}}">
      <ion-content class="workspace" data-project-saving="{{vm.saving ? 'true' : 'false'}}">
        <div class="mobile-feedback success" role="status" aria-live="polite" ng-if="vm.notice">{{vm.notice}}</div>
        <div class="mobile-feedback error" role="alert" aria-live="assertive" ng-if="vm.error">{{vm.error}}</div>
        <section class="mobile-project-overview" ng-if="vm.project">
          <header><div><small>{{vm.project.key}} · {{vm.membership.role}}</small><h2>{{vm.project.name}}</h2></div><span class="mobile-health" data-level="{{vm.health().level}}">{{vm.health().label}}</span></header>
          <div class="mobile-project-metrics"><div><span>Toplam</span><strong>{{vm.summary.total || 0}}</strong></div><div><span>Devam eden</span><strong>{{vm.summary.inProgress || 0}}</strong></div><div><span>Geciken</span><strong>{{vm.summary.overdue || 0}}</strong></div></div>
          <div class="mobile-delivery-list">
            <p><i class="ion-ios-timer-outline"></i><span><small>Aktif sprint</small><strong>{{vm.activeSprint().name || 'Aktif sprint yok'}}</strong></span></p>
            <p><i class="ion-ios-flag-outline"></i><span><small>Kilometre taşı</small><strong>{{vm.nextMilestone().name || 'Açık kilometre taşı yok'}}</strong></span><time ng-if="vm.nextMilestone().dueAt">{{vm.nextMilestone().dueAt | date:'dd MMM'}}</time></p>
            <p><i class="ion-paper-airplane"></i><span><small>Sıradaki sürüm</small><strong>{{vm.nextRelease().name || 'Planlanmış sürüm yok'}}</strong></span><time ng-if="vm.nextRelease().scheduledAt">{{vm.nextRelease().scheduledAt | date:'dd MMM'}}</time></p>
          </div>
          <nav class="mobile-project-views" aria-label="Mobil proje görünümü"><button ng-if="vm.boards.length" ng-click="vm.openProjectWork('board')">Pano</button><button ng-if="vm.boards.length" ng-click="vm.openProjectWork('list')">Liste</button><button ng-click="vm.openProjectWork('backlog')">Backlog</button><button ng-click="vm.openProjectWork('sprint')">Sprint</button><button ng-click="vm.openProjectWork('plan')">Plan</button><button ng-click="vm.openProjectWork('catalog')">Teslimat</button><button ng-click="vm.openProjectWork('intake')">Intake</button><button ng-click="vm.openProjectWork('automation')">Otomasyon</button><button ng-click="vm.openProjectWork('jobs')">İş merkezi</button><button ng-click="vm.openProjectWork('reports')">Rapor</button></nav>
        </section>
        <form class="mobile-manage-form" ng-if="vm.project && vm.canManage" ng-submit="vm.saveProject()">
          <label><span>Proje adı</span><input type="text" ng-model="vm.projectDraft.name" aria-label="Mobil proje adı" required></label>
          <label><span>Görünürlük</span><select ng-model="vm.projectDraft.visibility" aria-label="Mobil proje görünürlüğü"><option>Private</option><option>Internal</option><option>Public</option></select></label>
          <div class="mobile-form-actions"><button class="button button-small button-positive" type="submit" ng-disabled="vm.saving">Projeyi kaydet</button><button class="button button-small button-assertive button-outline" type="button" ng-if="vm.canArchive" ng-click="vm.archiveProject()" ng-disabled="vm.saving">Arşivle</button></div>
        </form>
        <div class="mobile-permission" ng-if="vm.project && !vm.canManage"><i class="ion-locked"></i> Bu projede yönetim yetkiniz yok.</div>
        <div class="item item-divider">Panolar</div>
        <div class="mobile-entity-row" ng-repeat="board in vm.boards track by board.id">
          <div class="mobile-entity-fields"><input type="text" ng-model="board.name" aria-label="Mobil pano adı" ng-disabled="!vm.canManage"><select ng-model="board.type" aria-label="Mobil pano türü" ng-disabled="!vm.canManage"><option>Kanban</option><option>Scrum</option></select><small>{{board.columns.length}} kolon</small></div>
          <div class="mobile-row-actions"><button class="button button-small button-stable" ng-click="vm.selectBoard(board)">Görevleri aç</button><button class="button button-small button-positive button-outline" ng-if="vm.canManage" ng-click="vm.saveBoard(board)" ng-disabled="vm.saving">Kaydet</button><button class="button button-small button-assertive button-clear" ng-if="vm.canManage" ng-click="vm.archiveBoard(board)" ng-disabled="vm.saving">Arşivle</button></div>
        </div>
        <div class="item item-text-wrap" ng-if="!vm.boards.length">Henüz pano yok.</div>
        <form class="mobile-manage-form compact" ng-if="vm.canManage" ng-submit="vm.createBoard()"><label><span>Yeni pano</span><input type="text" ng-model="vm.boardDraft.name" aria-label="Yeni mobil pano adı" required></label><label><span>Tür</span><select ng-model="vm.boardDraft.type" aria-label="Yeni mobil pano türü"><option>Kanban</option><option>Scrum</option></select></label><button class="button button-small button-positive" type="submit" ng-disabled="vm.saving">Pano oluştur</button></form>
        <div class="item item-divider" ng-if="vm.archivedBoards.length">Arşivlenmiş panolar</div>
        <div class="mobile-archive-row" ng-repeat="board in vm.archivedBoards track by board.id"><span>{{board.name}}</span><button class="button button-small button-stable" ng-click="vm.restoreBoard(board)">Geri yükle</button></div>
        <div class="item item-divider">Proje üyeleri</div>
        <div class="mobile-member-row" ng-repeat="member in vm.project.members track by member.userId">
          <span><strong>{{vm.memberLabel(member)}}</strong><small>{{member.role}}</small></span>
          <div class="mobile-member-actions" ng-if="vm.canManage && member.role !== 'ProjectOwner'">
            <select ng-model="member.role" aria-label="Mobil proje üyesi rolü"><option>ProjectAdmin</option><option>Developer</option><option>Viewer</option></select>
            <button class="button button-small button-positive button-clear ion-checkmark" ng-click="vm.saveProjectMember(member)" aria-label="Mobil proje üyesi rolünü kaydet"></button>
            <button class="button button-small button-assertive button-clear ion-trash-a" ng-click="vm.removeProjectMember(member)" aria-label="Mobil proje üyesini kaldır"></button>
          </div>
        </div>
        <form class="mobile-manage-form compact" ng-if="vm.canManage" ng-submit="vm.addProjectMember()">
          <label><span>Kullanıcı</span><select ng-model="vm.projectMemberDraft.userId" aria-label="Yeni mobil proje üyesi" ng-options="user.id as (user.username + ' · ' + user.email) for user in vm.users" required><option value="">Kullanıcı seçin</option></select></label>
          <label><span>Rol</span><select ng-model="vm.projectMemberDraft.role" aria-label="Yeni mobil proje üyesi rolü"><option>ProjectAdmin</option><option>Developer</option><option>Viewer</option></select></label>
          <button class="button button-small button-positive" type="submit" ng-disabled="vm.saving">Üye ekle</button>
        </form>
        <div class="item item-divider">Proje etkinliği</div>
        <div class="mobile-timeline"><p ng-repeat="entry in vm.audit | limitTo:8"><strong>{{entry.action}}</strong><span>{{entry.createdAt | date:'dd.MM HH:mm'}}</span></p><p ng-if="!vm.audit.length">Henüz etkinlik yok.</p></div>
      </ion-content>
    </ion-view>
  </script>

  <script id="templates/intake-center.html" type="text/ng-template">
    <ion-view view-title="{{vm.project.name || 'Intake'}}">
      <ion-content class="workspace mobile-intake" data-loading="{{vm.loading}}" data-busy="{{vm.busy}}">
        <header class="mobile-intake-head" ng-if="vm.project"><div><small>{{vm.project.key}} · {{vm.role}}</small><h2>Intake ve triage</h2><p>Formlar, talepler ve sınıflandırma kuyruğu</p></div><button type="button" ng-click="vm.load()" aria-label="Intake merkezini yenile"><i class="ion-refresh" aria-hidden="true"></i></button></header>
        <div class="mobile-intake-skeleton" ng-if="vm.loading" role="status" aria-label="Intake merkezi yükleniyor"><span></span><span></span><span></span></div>
        <div class="mobile-feedback success" role="status" aria-live="polite" ng-if="!vm.loading && vm.notice">{{vm.notice}}</div>
        <div class="mobile-feedback error" role="alert" aria-live="assertive" ng-if="!vm.loading && vm.error">{{vm.error}}</div>
        <div class="mobile-permission" ng-if="!vm.loading && vm.project && !vm.canManage"><i class="ion-eye" aria-hidden="true"></i> {{vm.role}} rolüyle form tanımları salt okunur.</div>
        <nav class="mobile-intake-tabs" ng-if="!vm.loading && vm.project" role="tablist" aria-label="Mobil intake çalışma alanları"><button type="button" role="tab" aria-selected="{{vm.tab==='forms'}}" ng-class="{active:vm.tab==='forms'}" ng-click="vm.setTab('forms')">Formlar</button><button type="button" role="tab" aria-selected="{{vm.tab==='submit'}}" ng-class="{active:vm.tab==='submit'}" ng-click="vm.setTab('submit')">Talep oluştur</button><button type="button" role="tab" aria-selected="{{vm.tab==='triage'}}" ng-class="{active:vm.tab==='triage'}" ng-click="vm.setTab('triage')">Triage</button></nav>

        <div ng-if="!vm.loading && vm.tab==='forms'">
          <section class="mobile-intake-section" aria-labelledby="mobile-intake-forms-heading"><header><div><h3 id="mobile-intake-forms-heading">Form kayıtları</h3><small>{{vm.forms.length}} form</small></div><button class="button button-small button-positive icon-left ion-plus" type="button" ng-if="vm.canManage" ng-click="vm.newForm()">Yeni</button></header><button class="mobile-intake-row" type="button" ng-repeat="form in vm.forms track by form.id" ng-class="{selected:vm.selectedForm.id===form.id}" data-state="{{form.state}}" ng-click="vm.selectForm(form)"><span><strong>{{form.name}}</strong><small>{{vm.accessLabel(form.draft.accessPolicy)}} · v{{form.publishedVersion || 0}}</small></span><span class="mobile-intake-state" data-state="{{form.state}}">{{vm.stateLabel(form.state)}}</span></button><p class="mobile-intake-empty" ng-if="!vm.forms.length">Henüz form yok.</p></section>

          <section class="mobile-intake-section" ng-if="vm.draft" aria-labelledby="mobile-intake-editor-heading"><header><div><h3 id="mobile-intake-editor-heading">{{vm.draft.id ? vm.draft.name : 'Yeni form'}}</h3><small>{{vm.draft.id ? vm.stateLabel(vm.draft.state) : 'Taslak'}}</small></div></header><div class="mobile-intake-actions" ng-if="vm.selectedForm && vm.canManage"><button class="button button-small button-stable icon-left ion-upload" type="button" ng-if="vm.selectedForm.state!=='Archived'" ng-click="vm.publishForm(vm.selectedForm)" ng-disabled="vm.busy">{{vm.selectedForm.publishedVersion ? 'Yeni sürüm' : 'Yayınla'}}</button><button class="button button-small button-assertive button-outline icon-left ion-archive" type="button" ng-if="vm.selectedForm.state!=='Archived'" ng-click="vm.archiveForm(vm.selectedForm)" ng-disabled="vm.busy">Arşivle</button><button class="button button-small button-positive button-outline icon-left ion-link" type="button" ng-if="vm.selectedForm.publicId" ng-click="vm.openPublicForm(vm.selectedForm)">Paylaşımı aç</button></div>
            <form class="mobile-intake-form" ng-if="vm.canManage && vm.draft.state!=='Archived'" ng-submit="vm.saveForm()"><label><span>Form adı</span><input ng-model="vm.draft.name" maxlength="{{vm.limits.formName}}" required></label><label><span>Açıklama</span><textarea ng-model="vm.draft.description" maxlength="{{vm.limits.description}}" rows="3"></textarea></label><label><span>Erişim</span><select ng-model="vm.draft.definition.accessPolicy"><option value="Internal">Yalnızca ekip</option><option value="Public">Dış paylaşıma açık</option></select></label><label><span>Hedef pano</span><select ng-model="vm.draft.definition.boardId" ng-options="board.id as board.name for board in vm.boards" required><option value="">Pano seçin</option></select></label><label><span>İş türü</span><select ng-model="vm.draft.definition.workItemType" ng-options="type.key as (type.name || type.key) for type in vm.issueTypes()" required></select></label><label><span>Varsayılan öncelik</span><select ng-model="vm.draft.definition.defaultPriority"><option>Critical</option><option>High</option><option>Medium</option><option>Low</option></select></label><label><span>Onay mesajı</span><input ng-model="vm.draft.definition.confirmationMessage" maxlength="{{vm.limits.confirmation}}" required></label>
              <section class="mobile-intake-fields"><header><h4>Alanlar · {{vm.draft.definition.fields.length}}/{{vm.limits.fields}}</h4><button class="button button-small button-stable icon-left ion-plus" type="button" ng-click="vm.addField()" ng-disabled="vm.draft.definition.fields.length>=vm.limits.fields">Ekle</button></header><article class="mobile-intake-field" ng-repeat="field in vm.draft.definition.fields track by $index"><header><strong>{{field.label || 'Yeni alan'}}</strong><button type="button" ng-click="vm.removeField(field)" ng-disabled="vm.draft.definition.fields.length<=1" aria-label="{{field.label || 'Alan'}} alanını kaldır"><i class="ion-trash-a" aria-hidden="true"></i></button></header><label><span>Görünen ad</span><input ng-model="field.label" maxlength="{{vm.limits.fieldLabel}}" required></label><label><span>Anahtar</span><input ng-model="field.key" pattern="[a-z][a-z0-9_\-]*" required></label><label><span>Tür</span><select ng-model="field.type" ng-options="type.id as type.label for type in vm.fieldTypes"></select></label><label><span>Yardım metni</span><input ng-model="field.helpText" maxlength="{{vm.limits.helpText}}"></label><label ng-if="field.type==='Choice'"><span>Seçenekler · satır veya virgülle</span><textarea ng-model="field.optionsText" rows="3"></textarea></label><label class="mobile-intake-check"><input type="checkbox" ng-model="field.required"><span>Zorunlu alan</span></label></article></section>
              <section class="mobile-intake-mappings"><header><h4>İş kaydı eşlemesi</h4></header><label><span>Başlık *</span><select ng-model="vm.draft.definition.mapping.titleFieldKey" ng-options="field.key as field.label for field in vm.compatibleFields('title')" required><option value="">Alan seçin</option></select></label><label><span>Açıklama</span><select ng-model="vm.draft.definition.mapping.descriptionFieldKey" ng-options="field.key as field.label for field in vm.compatibleFields('description')"><option value="">Eşleme yok</option></select></label><label><span>Öncelik</span><select ng-model="vm.draft.definition.mapping.priorityFieldKey" ng-options="field.key as field.label for field in vm.compatibleFields('priority')"><option value="">Varsayılan</option></select></label><label><span>Bitiş tarihi</span><select ng-model="vm.draft.definition.mapping.dueDateFieldKey" ng-options="field.key as field.label for field in vm.compatibleFields('dueDate')"><option value="">Eşleme yok</option></select></label><article class="mobile-intake-map" ng-repeat="mapping in vm.draft.definition.mapping.customFields track by $index"><header><strong>Özel alan</strong><button type="button" ng-click="vm.removeCustomMapping(mapping)" aria-label="Özel alan eşlemesini kaldır"><i class="ion-close" aria-hidden="true"></i></button></header><label><span>Form alanı</span><select ng-model="mapping.intakeFieldKey" ng-options="field.key as field.label for field in vm.compatibleFields('custom')"><option value="">Alan seçin</option></select></label><label><span>İş alanı</span><select ng-model="mapping.workItemFieldKey" ng-options="field.key as field.name for field in vm.customFields()"><option value="">Alan seçin</option></select></label></article><button class="button button-small button-stable icon-left ion-plus" type="button" ng-if="vm.customFields().length" ng-click="vm.addCustomMapping()">Özel alan eşle</button></section>
              <p class="mobile-feedback error" ng-if="vm.draftError()">{{vm.draftError()}}</p><div class="mobile-intake-actions"><button class="button button-positive" type="submit" ng-disabled="vm.busy || vm.draftError()">{{vm.draft.id ? 'Taslağı güncelle' : 'Form oluştur'}}</button><button class="button button-stable" type="button" ng-click="vm.cancelEdit()">Vazgeç</button></div>
            </form><p class="mobile-intake-empty" ng-if="vm.draft.state==='Archived'">Arşiv kaydı salt okunur; geçmiş sürümler korunur.</p>
          </section>
        </div>

        <div ng-if="!vm.loading && vm.tab==='submit'"><nav class="mobile-intake-picker" aria-label="Yayınlanmış iç formlar"><button type="button" ng-repeat="form in vm.publishedInternalForms() track by form.id" ng-class="{active:vm.submissionForm.id===form.id}" ng-click="vm.selectSubmissionForm(form)">{{form.name}}</button></nav><p class="mobile-intake-empty" ng-if="!vm.publishedInternalForms().length">Gönderime açık iç form yok.</p><section class="mobile-intake-section" ng-if="vm.publishedForm"><header><div><h3>{{vm.publishedForm.name}}</h3><small>v{{vm.publishedForm.version}}</small></div></header><div class="mobile-intake-confirmation" ng-if="vm.confirmation" role="status"><strong>Talep iş kaydına dönüştürüldü</strong><span>{{vm.confirmation.message}}</span><code>{{vm.confirmation.confirmationCode}}</code><button class="button button-small button-stable" type="button" ng-if="vm.confirmation.workItemId" ng-click="vm.openWorkItem(vm.confirmation)">İşi aç</button></div><form class="mobile-intake-form" ng-if="!vm.confirmation" ng-submit="vm.submit()"><label ng-repeat="field in vm.publishedForm.fields track by field.key" ng-switch="field.type"><span>{{field.label}}<b ng-if="field.required"> *</b></span><small ng-if="field.helpText">{{field.helpText}}</small><input ng-switch-when="Text" ng-model="vm.submissionModel.values[field.key]" maxlength="{{vm.limits.value}}" ng-required="field.required"><textarea ng-switch-when="LongText" ng-model="vm.submissionModel.values[field.key]" maxlength="{{vm.limits.value}}" rows="5" ng-required="field.required"></textarea><input ng-switch-when="Email" type="email" ng-model="vm.submissionModel.values[field.key]" maxlength="{{vm.limits.value}}" ng-required="field.required"><input ng-switch-when="Number" type="number" step="any" ng-model="vm.submissionModel.values[field.key]" ng-required="field.required"><input ng-switch-when="Date" type="date" ng-model="vm.submissionModel.values[field.key]" ng-required="field.required"><select ng-switch-when="Choice" ng-model="vm.submissionModel.values[field.key]" ng-options="option for option in field.options" ng-required="field.required"><option value="">Seçin</option></select><span class="mobile-intake-check" ng-switch-when="Checkbox"><input type="checkbox" ng-model="vm.submissionModel.values[field.key]"><span>Onaylıyorum</span></span><input ng-switch-when="Attachment" type="file" multiple intake-files="vm.captureFiles(field, files)" ng-required="field.required"></label><button class="button button-positive button-block" type="submit" ng-disabled="vm.submitBusy">{{vm.submitBusy ? 'Gönderiliyor…' : 'Talebi gönder'}}</button></form></section></div>

        <section class="mobile-intake-section" ng-if="!vm.loading && vm.tab==='triage'" aria-labelledby="mobile-intake-queue-heading"><header><div><h3 id="mobile-intake-queue-heading">Triage kuyruğu</h3><small>{{vm.queuePage.totalCount || 0}} talep</small></div><button class="button button-small button-clear ion-refresh" type="button" ng-click="vm.loadQueue()" aria-label="Triage kuyruğunu yenile"></button></header><div class="mobile-intake-queue-controls"><select ng-model="vm.selectedForm" ng-options="form as form.name for form in vm.forms track by form.id" ng-change="vm.selectQueueForm(vm.selectedForm)" aria-label="Triage formu"></select><select ng-model="vm.queueState" ng-change="vm.loadQueue()" aria-label="Triage durum filtresi"><option value="">Tüm durumlar</option><option ng-repeat="state in vm.triageStates" value="{{state.id}}">{{state.label}}</option></select></div><div class="mobile-intake-skeleton" ng-if="vm.queueLoading" role="status" aria-label="Triage kuyruğu yükleniyor"><span></span><span></span></div><article class="mobile-intake-submission" ng-repeat="submission in vm.submissions track by submission.id" ng-if="!vm.queueLoading"><header><strong>{{vm.submissionValue(submission, vm.selectedForm.draft.mapping.titleFieldKey) || submission.confirmationCode}}</strong><span class="mobile-intake-state" data-state="{{submission.state}}">{{vm.stateLabel(submission.state)}}</span></header><small>{{submission.confirmationCode}} · {{submission.createdAt | date:'dd MMM HH:mm'}}</small><div class="mobile-intake-values"><span ng-repeat="value in submission.values track by value.fieldKey"><b>{{value.fieldKey}}:</b> {{value.value}}</span></div><div class="mobile-intake-files"><span ng-repeat="file in submission.attachments track by file.id">{{file.fileName}} · {{vm.securityLabel(file.securityState)}}</span></div><div class="mobile-intake-triage"><textarea ng-model="vm.triageDrafts[submission.id]" maxlength="2000" placeholder="İnceleme notu" aria-label="{{submission.confirmationCode}} inceleme notu"></textarea><div class="mobile-intake-actions"><button class="button button-small button-stable" type="button" ng-repeat="state in vm.triageStates" ng-click="vm.triage(submission,state.id)" ng-disabled="vm.busy || submission.state==='Processing' || submission.state===state.id">{{state.label}}</button><button class="button button-small button-positive button-outline" type="button" ng-click="vm.openWorkItem(submission)">İşi aç</button></div></div></article><p class="mobile-intake-empty" ng-if="!vm.queueLoading && !vm.submissions.length">Bu filtrede bekleyen talep yok.</p></section>
      </ion-content>
    </ion-view>
  </script>

  <script id="templates/public-intake.html" type="text/ng-template">
    <ion-view view-title="{{vm.form.name || 'Talep formu'}}">
      <ion-content class="workspace mobile-public-intake" data-loading="{{vm.loading}}" data-busy="{{vm.busy}}">
        <div class="mobile-intake-skeleton" ng-if="vm.loading" role="status" aria-label="Form yükleniyor"><span></span><span></span><span></span></div>
        <div class="mobile-feedback error" role="alert" aria-live="assertive" ng-if="!vm.loading && vm.error">{{vm.error}}</div>
        <header class="mobile-public-intake-head" ng-if="!vm.loading && vm.form"><div><small>Zumbo · Güvenli talep formu</small><h2>{{vm.form.name}}</h2><p>{{vm.form.description}}</p></div></header>
        <div class="mobile-intake-confirmation" ng-if="vm.confirmation" role="status"><strong>Talebiniz alındı</strong><span>{{vm.confirmation.message}}</span><code>{{vm.confirmation.confirmationCode}}</code></div>
        <form class="mobile-intake-form" ng-if="!vm.loading && vm.form && !vm.confirmation" ng-submit="vm.submit()"><label ng-repeat="field in vm.form.fields track by field.key" ng-switch="field.type"><span>{{field.label}}<b ng-if="field.required"> *</b></span><small ng-if="field.helpText">{{field.helpText}}</small><input ng-switch-when="Text" ng-model="vm.model.values[field.key]" maxlength="4000" ng-required="field.required"><textarea ng-switch-when="LongText" ng-model="vm.model.values[field.key]" maxlength="4000" rows="5" ng-required="field.required"></textarea><input ng-switch-when="Email" type="email" ng-model="vm.model.values[field.key]" maxlength="4000" ng-required="field.required"><input ng-switch-when="Number" type="number" step="any" ng-model="vm.model.values[field.key]" ng-required="field.required"><input ng-switch-when="Date" type="date" ng-model="vm.model.values[field.key]" ng-required="field.required"><select ng-switch-when="Choice" ng-model="vm.model.values[field.key]" ng-options="option for option in field.options" ng-required="field.required"><option value="">Seçin</option></select><span class="mobile-intake-check" ng-switch-when="Checkbox"><input type="checkbox" ng-model="vm.model.values[field.key]"><span>Onaylıyorum</span></span><input ng-switch-when="Attachment" type="file" multiple intake-files="vm.captureFiles(field, files)" ng-required="field.required"></label><label class="hide"><span>Web sitesi</span><input tabindex="-1" autocomplete="off" ng-model="vm.model.website"></label><button class="button button-positive button-block" type="submit" ng-disabled="vm.busy">{{vm.busy ? 'Gönderiliyor…' : 'Talebi gönder'}}</button></form>
      </ion-content>
    </ion-view>
  </script>

  <script id="templates/project-catalog.html" type="text/ng-template">
    <ion-view view-title="{{vm.project.name || 'Teslimat'}}">
      <ion-content class="workspace mobile-catalog" data-loading="{{vm.loading}}" data-busy="{{vm.busy}}">
        <header class="mobile-catalog-head" ng-if="vm.project">
          <div><small>{{vm.project.key}} · {{vm.role}}</small><h2>Teslimat kataloğu</h2><p>Sürüm, yayın ve proje yapılandırmaları</p></div>
          <button type="button" ng-click="vm.load()" aria-label="Proje kataloğunu yenile"><i class="ion-refresh" aria-hidden="true"></i></button>
        </header>
        <div class="mobile-catalog-skeleton" ng-if="vm.loading" role="status" aria-label="Proje kataloğu yükleniyor"><span></span><span></span><span></span></div>
        <div class="mobile-feedback success" role="status" aria-live="polite" ng-if="!vm.loading && vm.notice">{{vm.notice}}</div>
        <div class="mobile-feedback error" role="alert" aria-live="assertive" ng-if="!vm.loading && vm.error">{{vm.error}}</div>
        <div class="mobile-permission" ng-if="!vm.loading && vm.project && !vm.canManage"><i class="ion-eye" aria-hidden="true"></i> {{vm.role}} rolüyle katalog salt okunur.</div>
        <div class="mobile-permission" ng-if="!vm.loading && vm.canManage && !vm.canRelease"><i class="ion-locked" aria-hidden="true"></i> Yayın onayı ve yayınlama proje sahibine aittir.</div>

        <nav class="mobile-catalog-tabs" ng-if="!vm.loading && vm.project" role="tablist" aria-label="Mobil proje teslimat alanları">
          <button type="button" role="tab" aria-selected="{{vm.tab==='releases'}}" ng-class="{active:vm.tab==='releases'}" ng-click="vm.setTab('releases')">Yayınlar</button>
          <button type="button" role="tab" aria-selected="{{vm.tab==='milestones'}}" ng-class="{active:vm.tab==='milestones'}" ng-click="vm.setTab('milestones')">Kilometre</button>
          <button type="button" role="tab" aria-selected="{{vm.tab==='components'}}" ng-class="{active:vm.tab==='components'}" ng-click="vm.setTab('components')">Bileşen</button>
          <button type="button" role="tab" aria-selected="{{vm.tab==='templates'}}" ng-class="{active:vm.tab==='templates'}" ng-click="vm.setTab('templates')">Şablon</button>
          <button type="button" role="tab" aria-selected="{{vm.tab==='activity'}}" ng-class="{active:vm.tab==='activity'}" ng-click="vm.setTab('activity')">Etkinlik</button>
        </nav>

        <div ng-if="!vm.loading && vm.project && vm.tab==='releases'">
          <section class="mobile-catalog-section" aria-labelledby="mobile-versions-heading">
            <header><div><h3 id="mobile-versions-heading">Sürümler</h3><small>{{vm.model.plannedVersions.length}} planlanan</small></div></header>
            <form class="mobile-catalog-form inline" ng-if="vm.canManage" ng-submit="vm.createVersion()"><label><span>Sürüm adı</span><input type="text" ng-model="vm.versionDraft.name" minlength="2" maxlength="{{vm.limits.versionName}}" required></label><button class="button button-small button-positive" type="submit" ng-disabled="vm.busy">Oluştur</button></form>
            <article class="mobile-catalog-row" ng-repeat="version in vm.model.versions track by version.id" data-status="{{version.status}}"><span><strong>{{version.name}}</strong><small>{{version.status}}<b ng-if="version.releasedAt"> · {{version.releasedAt | date:'dd MMM yyyy'}}</b></small></span><div ng-if="vm.canManage && version.status==='Planned'"><button class="button button-small button-assertive button-clear ion-archive" type="button" ng-if="!vm.confirmationIs('version',version.id)" ng-click="vm.requestConfirmation('version',version.id)" aria-label="{{version.name}} sürümünü arşivle"></button><span class="mobile-catalog-confirm" ng-if="vm.confirmationIs('version',version.id)"><button type="button" ng-click="vm.archiveVersion(version)">Arşivle</button><button type="button" ng-click="vm.cancelConfirmation()">Vazgeç</button></span></div></article>
            <p class="mobile-catalog-empty" ng-if="!vm.model.versions.length">Henüz sürüm yok.</p>
          </section>

          <section class="mobile-catalog-section" aria-labelledby="mobile-releases-heading">
            <header><div><h3 id="mobile-releases-heading">Yayın akışı</h3><small>{{vm.model.releases.length}} kayıt</small></div></header>
            <form class="mobile-catalog-form" ng-if="vm.canManage" ng-submit="vm.createRelease()"><label><span>Planlanan sürüm</span><select ng-model="vm.releaseDraft.versionId" ng-options="version.id as version.name for version in vm.model.plannedVersions" required><option value="">Sürüm seçin</option></select></label><label><span>Yayın adı</span><input type="text" ng-model="vm.releaseDraft.name" minlength="2" maxlength="{{vm.limits.releaseName}}" required></label><label><span>Planlanan tarih</span><input type="datetime-local" ng-model="vm.releaseDraft.scheduledAt"></label><button class="button button-small button-positive" type="submit" ng-disabled="vm.busy || !vm.releaseDraft.versionId">Taslak oluştur</button></form>
            <article class="mobile-catalog-row release" ng-repeat="release in vm.model.releases track by release.id" data-status="{{release.status}}"><span><strong>{{release.name}}</strong><small>{{vm.versionName(release.versionId)}} · {{release.status}}<b ng-if="release.scheduledAt"> · {{release.scheduledAt | date:'dd MMM'}}</b></small></span><div class="mobile-catalog-actions" ng-if="vm.canRelease"><button class="button button-small button-stable" type="button" ng-if="release.status==='Draft'" ng-click="vm.approveRelease(release)" ng-disabled="vm.busy">Onayla</button><button class="button button-small button-positive" type="button" ng-if="release.status==='Approved'" ng-click="vm.publishRelease(release)" ng-disabled="vm.busy">Yayınla</button></div></article>
            <p class="mobile-catalog-empty" ng-if="!vm.model.releases.length">Henüz yayın taslağı yok.</p>
          </section>
        </div>

        <section class="mobile-catalog-section" ng-if="!vm.loading && vm.project && vm.tab==='milestones'" aria-labelledby="mobile-milestones-heading">
          <header><div><h3 id="mobile-milestones-heading">Kilometre taşları</h3><small>{{vm.model.openMilestones.length}} açık</small></div></header>
          <form class="mobile-catalog-form" ng-if="vm.canManage" ng-submit="vm.saveMilestone()"><div class="mobile-catalog-edit-head"><strong>{{vm.milestoneDraft.id ? 'Kaydı düzenle' : 'Yeni kilometre taşı'}}</strong><button type="button" ng-if="vm.milestoneDraft.id" ng-click="vm.cancelMilestoneEdit()" aria-label="Düzenlemeyi kapat"><i class="ion-close" aria-hidden="true"></i></button></div><label><span>Ad</span><input type="text" ng-model="vm.milestoneDraft.name" minlength="2" maxlength="{{vm.limits.milestoneName}}" required></label><label><span>Hedef tarih</span><input type="datetime-local" ng-model="vm.milestoneDraft.dueAt" required></label><button class="button button-small button-positive" type="submit" ng-disabled="vm.busy">{{vm.milestoneDraft.id ? 'Kaydet' : 'Ekle'}}</button></form>
          <article class="mobile-catalog-row" ng-repeat="milestone in vm.model.milestones track by milestone.id" data-status="{{milestone.status}}"><span><strong>{{milestone.name}}</strong><small>{{milestone.status}} · {{milestone.dueAt | date:'dd MMM yyyy HH:mm'}}</small></span><div class="mobile-catalog-actions" ng-if="vm.canManage && milestone.status==='Open'"><button class="button button-small button-clear ion-edit" type="button" ng-click="vm.editMilestone(milestone)" aria-label="{{milestone.name}} kilometre taşını düzenle"></button><button class="button button-small button-stable" type="button" ng-click="vm.completeMilestone(milestone)" ng-disabled="vm.busy">Tamamla</button></div></article>
          <p class="mobile-catalog-empty" ng-if="!vm.model.milestones.length">Henüz kilometre taşı yok.</p>
        </section>

        <section class="mobile-catalog-section" ng-if="!vm.loading && vm.project && vm.tab==='components'" aria-labelledby="mobile-components-heading">
          <header><div><h3 id="mobile-components-heading">Bileşenler</h3><small>{{vm.model.activeComponents.length}} etkin</small></div></header>
          <form class="mobile-catalog-form" ng-if="vm.canManage" ng-submit="vm.saveComponent()"><div class="mobile-catalog-edit-head"><strong>{{vm.componentDraft.id ? 'Bileşeni düzenle' : 'Yeni bileşen'}}</strong><button type="button" ng-if="vm.componentDraft.id" ng-click="vm.cancelComponentEdit()" aria-label="Düzenlemeyi kapat"><i class="ion-close" aria-hidden="true"></i></button></div><label><span>Ad</span><input type="text" ng-model="vm.componentDraft.name" minlength="2" maxlength="{{vm.limits.componentName}}" required></label><label><span>Açıklama</span><textarea ng-model="vm.componentDraft.description" maxlength="{{vm.limits.componentDescription}}" rows="3"></textarea><small>{{(vm.componentDraft.description || '').length}} / {{vm.limits.componentDescription}}</small></label><button class="button button-small button-positive" type="submit" ng-disabled="vm.busy">{{vm.componentDraft.id ? 'Kaydet' : 'Ekle'}}</button></form>
          <article class="mobile-catalog-row" ng-repeat="component in vm.model.components track by component.id" data-status="{{component.archived ? 'Archived' : 'Active'}}"><span><strong>{{component.name}}</strong><small>{{component.description || 'Açıklama eklenmedi'}}<b ng-if="component.archived"> · Arşiv</b></small></span><div class="mobile-catalog-actions" ng-if="vm.canManage && !component.archived"><button class="button button-small button-clear ion-edit" type="button" ng-click="vm.editComponent(component)" aria-label="{{component.name}} bileşenini düzenle"></button><button class="button button-small button-assertive button-clear ion-archive" type="button" ng-if="!vm.confirmationIs('component',component.id)" ng-click="vm.requestConfirmation('component',component.id)" aria-label="{{component.name}} bileşenini arşivle"></button><span class="mobile-catalog-confirm" ng-if="vm.confirmationIs('component',component.id)"><button type="button" ng-click="vm.archiveComponent(component)">Arşivle</button><button type="button" ng-click="vm.cancelConfirmation()">Vazgeç</button></span></div></article>
          <p class="mobile-catalog-empty" ng-if="!vm.model.components.length">Henüz bileşen yok.</p>
        </section>

        <section class="mobile-catalog-section" ng-if="!vm.loading && vm.project && vm.tab==='templates'" aria-labelledby="mobile-templates-heading">
          <header><div><h3 id="mobile-templates-heading">Proje şablonları</h3><small>{{vm.model.activeTemplates.length}} etkin</small></div></header>
          <form class="mobile-catalog-form" ng-if="vm.canManage" ng-submit="vm.saveTemplate()"><div class="mobile-catalog-edit-head"><strong>{{vm.templateDraft.id ? 'Şablonu düzenle' : 'Yeni şablon'}}</strong><button type="button" ng-if="vm.templateDraft.id" ng-click="vm.cancelTemplateEdit()" aria-label="Düzenlemeyi kapat"><i class="ion-close" aria-hidden="true"></i></button></div><label><span>Ad</span><input type="text" ng-model="vm.templateDraft.name" minlength="2" maxlength="{{vm.limits.templateName}}" required></label><label><span>Varsayılan bileşen adları</span><textarea ng-model="vm.templateDraft.defaultComponentNamesText" rows="5" placeholder="Her satıra bir bileşen"></textarea><small ng-class="{danger:vm.templateComponentState().tooMany || vm.templateComponentState().tooLong}">{{vm.templateComponentState().values.length}} / {{vm.limits.defaultComponentCount}} benzersiz ad · en fazla {{vm.limits.componentName}} karakter</small></label><label class="mobile-catalog-check"><input type="checkbox" ng-model="vm.templateDraft.isDefault"><span>Proje varsayılanı</span></label><button class="button button-small button-positive" type="submit" ng-disabled="vm.busy || vm.templateComponentState().tooMany || vm.templateComponentState().tooLong">{{vm.templateDraft.id ? 'Kaydet' : 'Ekle'}}</button></form>
          <article class="mobile-catalog-row" ng-repeat="template in vm.model.templates track by template.id" data-status="{{template.archived ? 'Archived' : 'Active'}}"><span><strong>{{template.name}}</strong><small>{{template.defaultComponentNames.length || 0}} bileşen<b ng-if="template.isDefault"> · Varsayılan</b><b ng-if="template.archived"> · Arşiv</b></small></span><div class="mobile-catalog-actions" ng-if="vm.canManage && !template.archived"><button class="button button-small button-clear ion-edit" type="button" ng-click="vm.editTemplate(template)" aria-label="{{template.name}} şablonunu düzenle"></button><button class="button button-small button-assertive button-clear ion-archive" type="button" ng-if="!vm.confirmationIs('template',template.id)" ng-click="vm.requestConfirmation('template',template.id)" aria-label="{{template.name}} şablonunu arşivle"></button><span class="mobile-catalog-confirm" ng-if="vm.confirmationIs('template',template.id)"><button type="button" ng-click="vm.archiveTemplate(template)">Arşivle</button><button type="button" ng-click="vm.cancelConfirmation()">Vazgeç</button></span></div></article>
          <p class="mobile-catalog-empty" ng-if="!vm.model.templates.length">Henüz proje şablonu yok.</p>
        </section>

        <section class="mobile-catalog-section" ng-if="!vm.loading && vm.project && vm.tab==='activity'" aria-labelledby="mobile-catalog-activity-heading">
          <header><div><h3 id="mobile-catalog-activity-heading">Teslimat etkinliği</h3><small>{{vm.audit.length}} kayıt</small></div></header>
          <div class="mobile-catalog-audit"><p ng-repeat="entry in vm.audit track by entry.id"><span><strong>{{entry.action}}</strong><small>{{entry.createdAt | date:'dd MMM yyyy HH:mm'}}</small></span></p><p class="mobile-catalog-empty" ng-if="!vm.audit.length">Henüz katalog etkinliği yok.</p></div>
        </section>
      </ion-content>
    </ion-view>
  </script>

  <script id="templates/work-automation.html" type="text/ng-template">
    <ion-view view-title="{{vm.project.name || 'Otomasyon'}}">
      <ion-content class="workspace mobile-automation" data-loading="{{vm.loading}}" data-busy="{{vm.busy}}">
        <header class="mobile-automation-head" ng-if="vm.project"><div><small>{{vm.project.key}} · {{vm.role}}</small><h2>İş otomasyonu</h2><p>{{vm.timeZone}} · UTC zamanlama kaynağı</p></div><button type="button" ng-click="vm.load()" aria-label="Otomasyon kayıtlarını yenile"><i class="ion-refresh" aria-hidden="true"></i></button></header>
        <div class="mobile-automation-summary" ng-if="vm.project"><span><b>{{vm.model.activeTemplates.length}}</b> şablon</span><span><b>{{vm.model.activeRecurrences.length}}</b> etkin</span></div>
        <div class="mobile-automation-skeleton" ng-if="vm.loading" role="status" aria-label="Otomasyon kayıtları yükleniyor"><span></span><span></span><span></span></div>
        <div class="mobile-feedback success" role="status" aria-live="polite" ng-if="!vm.loading && vm.notice">{{vm.notice}}</div>
        <div class="mobile-feedback error" role="alert" aria-live="assertive" ng-if="!vm.loading && vm.error">{{vm.error}}</div>
        <div class="mobile-automation-permission" ng-if="!vm.loading && vm.project && !vm.canEdit"><i class="ion-eye" aria-hidden="true"></i> {{vm.role}} rolüyle otomasyon salt okunur.</div>
        <nav class="mobile-automation-tabs" ng-if="!vm.loading && vm.project" role="tablist" aria-label="Mobil otomasyon alanları"><button type="button" role="tab" aria-selected="{{vm.tab==='schedules'}}" ng-class="{active:vm.tab==='schedules'}" ng-click="vm.setTab('schedules')">Yineleme</button><button type="button" role="tab" aria-selected="{{vm.tab==='templates'}}" ng-class="{active:vm.tab==='templates'}" ng-click="vm.setTab('templates')">Şablon</button><button type="button" role="tab" aria-selected="{{vm.tab==='activity'}}" ng-class="{active:vm.tab==='activity'}" ng-click="vm.setTab('activity')">Etkinlik</button></nav>

        <div ng-if="!vm.loading && vm.project && vm.tab==='schedules'">
          <section class="mobile-automation-section editor" ng-if="vm.canEdit" aria-labelledby="mobile-recurrence-editor"><header><div><h3 id="mobile-recurrence-editor">Yeni yineleme</h3><small>Sunucu takvimiyle doğrulayın</small></div><i class="ion-calendar" aria-hidden="true"></i></header>
            <form ng-submit="vm.createRecurrence()" ng-if="vm.model.activeTemplates.length">
              <label><span>İş şablonu</span><select ng-model="vm.recurrenceDraft.templateId" ng-options="template.id as template.name for template in vm.model.activeTemplates" required><option value="">Şablon seçin</option></select></label>
              <div class="mobile-automation-fields"><label><span>Sıklık</span><select ng-model="vm.recurrenceDraft.frequency"><option>Daily</option><option>Weekly</option><option>Monthly</option></select></label><label><span>Aralık</span><input type="number" ng-model="vm.recurrenceDraft.interval" min="1" max="{{vm.limits.recurrenceInterval}}" required></label></div>
              <label><span>İlk çalıştırma · {{vm.timeZone}}</span><input type="datetime-local" ng-model="vm.recurrenceDraft.startAtLocal" required></label><label><span>Bitiş · isteğe bağlı</span><input type="datetime-local" ng-model="vm.recurrenceDraft.endAtLocal"></label><label><span>En fazla</span><input type="number" ng-model="vm.recurrenceDraft.maxOccurrences" min="1" max="{{vm.limits.recurrenceOccurrences}}" required></label>
              <div class="mobile-automation-actions"><button class="button button-small button-stable" type="button" ng-click="vm.previewRecurrence()" ng-disabled="vm.busy || !vm.recurrenceDraft.templateId"><i class="ion-search"></i> Önizle</button><button class="button button-small button-positive" type="submit" ng-disabled="vm.busy || !vm.recurrenceDraft.templateId"><i class="ion-play"></i> Etkinleştir</button></div>
            </form><p class="mobile-automation-empty" ng-if="!vm.model.activeTemplates.length">Önce etkin bir iş şablonu oluşturun.</p>
            <div class="mobile-automation-preview" ng-if="vm.preview"><strong>Sunucu önizlemesi</strong><small>{{vm.frequencyLabel(vm.preview.frequency,vm.preview.interval)}}</small><ol><li ng-repeat="date in vm.preview.occurrencesUtc track by $index"><b>{{$index+1}}</b><time>{{date | date:'dd MMM yyyy HH:mm'}}</time></li></ol></div>
          </section>

          <section class="mobile-automation-section" aria-labelledby="mobile-recurrence-list"><header><div><h3 id="mobile-recurrence-list">Yinelemeler</h3><small>{{vm.model.recurrences.length}} kayıt</small></div></header>
            <article class="mobile-automation-row" ng-repeat="recurrence in vm.model.recurrences track by recurrence.id" data-state="{{vm.recurrenceState(recurrence).id}}" ng-class="{selected:vm.selectedRecurrenceId===recurrence.id}"><button class="mobile-automation-main" type="button" ng-click="vm.selectRecurrence(recurrence)"><strong>{{vm.templateName(recurrence.templateId)}}</strong><small>{{vm.frequencyLabel(recurrence.frequency,recurrence.interval)}} · {{recurrence.generatedOccurrences}}/{{recurrence.maxOccurrences}}</small><time ng-if="recurrence.nextRunAtUtc">{{recurrence.nextRunAtUtc | date:'dd MMM HH:mm'}}</time><time ng-if="!recurrence.nextRunAtUtc">Sonraki çalışma yok</time></button><span class="mobile-automation-state" data-tone="{{vm.recurrenceState(recurrence).tone}}">{{vm.recurrenceState(recurrence).label}}</span><div class="mobile-automation-row-actions" ng-if="vm.canEdit && !recurrence.archived"><button class="button button-small button-clear ion-pause" type="button" ng-if="recurrence.active" ng-click="vm.setRecurrenceState(recurrence,false)" aria-label="Yinelemeyi duraklat"></button><button class="button button-small button-clear ion-play" type="button" ng-if="!recurrence.active && recurrence.nextRunAtUtc" ng-click="vm.setRecurrenceState(recurrence,true)" aria-label="Yinelemeyi devam ettir"></button><button class="button button-small button-assertive button-clear ion-archive" type="button" ng-if="!vm.confirmationIs('recurrence',recurrence.id)" ng-click="vm.requestConfirmation('recurrence',recurrence.id)" aria-label="Yinelemeyi arşivle"></button><span class="mobile-automation-confirm" ng-if="vm.confirmationIs('recurrence',recurrence.id)"><button type="button" ng-click="vm.archiveRecurrence(recurrence)">Arşivle</button><button type="button" ng-click="vm.cancelConfirmation()">Vazgeç</button></span></div></article><p class="mobile-automation-empty" ng-if="!vm.model.recurrences.length">Henüz yineleme yok.</p>
          </section>

          <section class="mobile-automation-section occurrences" ng-if="vm.selectedRecurrence()" aria-labelledby="mobile-occurrence-list"><header><div><h3 id="mobile-occurrence-list">Çalıştırmalar</h3><small>{{vm.templateName(vm.selectedRecurrence().templateId)}}</small></div><button type="button" ng-click="vm.selectRecurrence(vm.selectedRecurrence())" aria-label="Çalıştırmaları yenile"><i class="ion-refresh"></i></button></header><p class="mobile-automation-loading" ng-if="vm.occurrenceLoading">Yükleniyor...</p><p class="mobile-feedback error" ng-if="vm.occurrenceError">{{vm.occurrenceError}}</p><article class="mobile-occurrence-row" ng-repeat="occurrence in vm.model.occurrences track by occurrence.id"><span class="mobile-automation-state" data-tone="{{vm.occurrenceState(occurrence).tone}}">{{vm.occurrenceState(occurrence).label}}</span><time>{{occurrence.scheduledForUtc | date:'dd MMM HH:mm'}}</time></article><p class="mobile-automation-empty" ng-if="!vm.occurrenceLoading && !vm.occurrenceError && !vm.model.occurrences.length">Henüz çalıştırma yok.</p></section>
        </div>

        <div ng-if="!vm.loading && vm.project && vm.tab==='templates'">
          <section class="mobile-automation-section editor" ng-if="vm.canEdit" aria-labelledby="mobile-template-editor"><header><div><h3 id="mobile-template-editor">{{vm.templateDraft.id ? 'Şablonu düzenle' : 'Yeni iş şablonu'}}</h3><small>Yinelenen iş alanları</small></div><i class="ion-ios-copy-outline" aria-hidden="true"></i></header>
            <form ng-submit="vm.saveTemplate()" ng-if="vm.boards.length"><label><span>Şablon adı</span><input ng-model="vm.templateDraft.name" maxlength="{{vm.limits.templateName}}" required></label><label><span>İş başlığı</span><input ng-model="vm.templateDraft.title" maxlength="{{vm.limits.templateTitle}}" required></label><label><span>Pano</span><select ng-model="vm.templateDraft.boardId" ng-options="board.id as board.name for board in vm.boards" required></select></label><div class="mobile-automation-fields"><label><span>Tür</span><select ng-model="vm.templateDraft.type" ng-options="type.key as (type.name || type.key) for type in vm.issueTypes()"></select></label><label><span>Öncelik</span><select ng-model="vm.templateDraft.priority"><option>Critical</option><option>High</option><option>Medium</option><option>Low</option></select></label></div><label><span>Bitiş farkı · gün</span><input type="number" ng-model="vm.templateDraft.dueAfterDays" min="0" max="{{vm.limits.dueAfterDays}}"></label><label><span>Etiketler</span><textarea ng-model="vm.templateDraft.labelsText" rows="2"></textarea><small ng-class="{danger:vm.labelState().tooMany || vm.labelState().tooLong}">{{vm.labelState().values.length}}/{{vm.limits.labelCount}}</small></label><div class="mobile-automation-actions"><button class="button button-small button-positive" type="submit" ng-disabled="vm.busy || vm.labelState().tooMany || vm.labelState().tooLong">{{vm.templateDraft.id ? 'Güncelle' : 'Oluştur'}}</button><button class="button button-small button-stable" type="button" ng-if="vm.templateDraft.id" ng-click="vm.cancelTemplateEdit()">Vazgeç</button></div></form><p class="mobile-automation-empty" ng-if="!vm.boards.length">Şablon için etkin bir pano gerekir.</p>
          </section>
          <section class="mobile-automation-section" aria-labelledby="mobile-template-list"><header><div><h3 id="mobile-template-list">İş şablonları</h3><small>{{vm.model.activeTemplates.length}} etkin</small></div></header><article class="mobile-automation-row template" ng-repeat="template in vm.model.templates track by template.id" data-state="{{template.archived ? 'archived' : 'active'}}"><span><strong>{{template.name}}</strong><small>{{template.title}} · {{template.type}}</small></span><span class="mobile-automation-state">{{template.archived ? 'Arşiv' : 'Etkin'}}</span><div class="mobile-automation-row-actions" ng-if="vm.canEdit && !template.archived"><button class="button button-small button-clear ion-loop" type="button" ng-click="vm.useTemplate(template)" aria-label="Şablonla yineleme oluştur"></button><button class="button button-small button-clear ion-edit" type="button" ng-click="vm.editTemplate(template)" aria-label="Şablonu düzenle"></button><button class="button button-small button-assertive button-clear ion-archive" type="button" ng-if="!vm.confirmationIs('template',template.id)" ng-click="vm.requestConfirmation('template',template.id)" aria-label="Şablonu arşivle"></button><span class="mobile-automation-confirm" ng-if="vm.confirmationIs('template',template.id)"><button type="button" ng-click="vm.archiveTemplate(template)">Arşivle</button><button type="button" ng-click="vm.cancelConfirmation()">Vazgeç</button></span></div></article><p class="mobile-automation-empty" ng-if="!vm.model.templates.length">Henüz iş şablonu yok.</p></section>
        </div>

        <section class="mobile-automation-section audit" ng-if="!vm.loading && vm.project && vm.tab==='activity'" aria-labelledby="mobile-automation-audit"><header><div><h3 id="mobile-automation-audit">Otomasyon etkinliği</h3><small>{{vm.model.auditTarget.label || 'Kayıt seçin'}}</small></div></header><div class="mobile-automation-audit"><p ng-repeat="entry in vm.model.audit track by entry.id"><strong>{{entry.action}}</strong><time>{{entry.createdAt | date:'dd MMM HH:mm'}}</time></p></div><p class="mobile-automation-empty" ng-if="!vm.model.audit.length">Seçili kayıt için etkinlik yok.</p></section>
      </ion-content>
    </ion-view>
  </script>

  <script id="templates/bulk-job-center.html" type="text/ng-template">
    <ion-view view-title="{{vm.project.name || 'İş merkezi'}}">
      <ion-content class="workspace mobile-job-center" data-loading="{{vm.loading}}" data-busy="{{vm.busy}}" data-mode="{{vm.mode}}">
        <ion-refresher pulling-text="İş geçmişini yenile" on-refresh="vm.load()"></ion-refresher>
        <header class="mobile-job-head">
          <div><small>{{vm.project.key || 'Proje'}} · {{vm.total}} iş</small><h2>İş merkezi</h2><p>İçe ve dışa aktarımları uygulamadan ayrılmadan izleyin.</p></div>
          <button type="button" ng-click="vm.load()" ng-disabled="vm.loading" aria-label="İş merkezini yenile"><i class="ion-refresh" aria-hidden="true"></i></button>
        </header>

        <nav class="mobile-job-tabs" role="tablist" aria-label="İş merkezi alanları">
          <button type="button" role="tab" aria-selected="{{vm.mode==='launch'}}" ng-class="{active:vm.mode==='launch'}" ng-click="vm.setMode('launch')">Yeni iş</button>
          <button type="button" role="tab" aria-selected="{{vm.mode==='history'}}" ng-class="{active:vm.mode==='history'}" ng-click="vm.setMode('history')">Geçmiş <span>{{vm.total}}</span></button>
        </nav>

        <div class="mobile-job-skeleton" ng-if="vm.loading" role="status" aria-label="İş merkezi yükleniyor"><span></span><span></span><span></span></div>
        <div class="mobile-feedback success" role="status" aria-live="polite" ng-if="!vm.loading && vm.notice">{{vm.notice}}</div>
        <div class="mobile-feedback error" role="alert" aria-live="assertive" ng-if="!vm.loading && vm.error">{{vm.error}}</div>
        <div class="mobile-job-offline" ng-if="vm.pwa.offline"><i class="ion-wifi" aria-hidden="true"></i><span>Çevrimdışıyken yeni iş başlatılamaz ve sonuç dosyaları indirilemez.</span></div>

        <div ng-if="!vm.loading && vm.project && vm.mode==='launch'">
          <section class="mobile-job-section" aria-labelledby="mobile-import-heading">
            <header><div><h3 id="mobile-import-heading">JSON ile içe aktar</h3><p>En fazla 5 MB ve 5000 satır</p></div><i class="ion-ios-upload-outline" aria-hidden="true"></i></header>
            <div class="mobile-job-permission" ng-if="!vm.canEdit() && !vm.pwa.offline"><i class="ion-eye" aria-hidden="true"></i><span>Bu projede içe aktarım yetkiniz yok.</span></div>
            <div ng-if="vm.canEdit()">
              <label class="mobile-job-file">
                <i class="ion-document-text" aria-hidden="true"></i>
                <span><strong>{{vm.importFile ? vm.importFile.name : 'JSON dosyası seç'}}</strong><small ng-if="!vm.importFile">Satırlar gönderilmeden önce yerel olarak doğrulanır.</small></span>
                <input type="file" accept=".json,application/json" file-change="vm.chooseImportFile(file)" aria-label="İçe aktarım JSON dosyası seç">
              </label>
              <div class="mobile-job-validation" ng-if="vm.importParsed" data-valid="{{vm.importParsed.valid}}">
                <strong>{{vm.importParsed.rows.length}} geçerli satır</strong>
                <span ng-if="vm.importParsed.totalErrors">{{vm.importParsed.totalErrors}} hata</span>
                <p ng-repeat="error in vm.importParsed.errors | limitTo:3 track by $index">{{error}}</p>
              </div>
              <div class="mobile-job-actions">
                <button class="button button-small button-stable" type="button" ng-click="vm.submitImport(true)" ng-disabled="vm.busy || !vm.importParsed.valid"><i class="ion-search" aria-hidden="true"></i> Önizle</button>
                <button class="button button-small button-positive" type="button" ng-click="vm.submitImport(false)" ng-disabled="vm.busy || !vm.importParsed.valid"><i class="ion-play" aria-hidden="true"></i> İçe aktar</button>
              </div>
            </div>
          </section>

          <section class="mobile-job-section" aria-labelledby="mobile-export-heading">
            <header><div><h3 id="mobile-export-heading">Proje verisini dışa aktar</h3><p>Sonuç dosyası iş tamamlanınca hazırlanır.</p></div><i class="ion-ios-download-outline" aria-hidden="true"></i></header>
            <ion-toggle ng-model="vm.exportDraft.includeArchived" ng-disabled="vm.pwa.offline">Arşivlenmiş işleri dahil et</ion-toggle>
            <div class="mobile-job-actions">
              <button class="button button-small button-stable" type="button" ng-click="vm.submitExport(true)" ng-disabled="vm.busy || vm.pwa.offline"><i class="ion-search" aria-hidden="true"></i> Kapsamı doğrula</button>
              <button class="button button-small button-positive" type="button" ng-click="vm.submitExport(false)" ng-disabled="vm.busy || vm.pwa.offline"><i class="ion-archive" aria-hidden="true"></i> Dışa aktar</button>
            </div>
          </section>
        </div>

        <div ng-if="!vm.loading && vm.project && vm.mode==='history'">
          <section class="mobile-job-register" aria-labelledby="mobile-job-history-heading">
            <header><h3 id="mobile-job-history-heading">İş geçmişi</h3><span>Yalnız sizin başlattığınız işler</span></header>
            <button class="mobile-job-row" type="button" ng-repeat="job in vm.jobs track by job.id" ng-click="vm.select(job)" ng-class="{selected:vm.selected && vm.selected.id===job.id}">
              <i class="{{job.type==='Import' ? 'ion-ios-upload-outline' : 'ion-ios-download-outline'}}" aria-hidden="true"></i>
              <span><strong>{{vm.jobTypeLabel(job)}}</strong><small>{{job.processedItems}} / {{job.totalItems}} işlendi · {{job.createdAt | date:'dd MMM HH:mm'}}</small><progress max="100" value="{{vm.jobProgress(job)}}">{{vm.jobProgress(job)}}%</progress></span>
              <b data-tone="{{vm.jobState(job).tone}}">{{vm.jobState(job).label}}</b>
            </button>
            <p class="mobile-job-empty" ng-if="!vm.jobs.length">Bu projede henüz kalıcı iş başlatılmadı.</p>
          </section>

          <section class="mobile-job-detail" ng-if="vm.selected" aria-live="polite">
            <header><div><small>{{vm.selected.id | limitTo:8}}</small><h3>{{vm.jobTypeLabel(vm.selected)}}</h3></div><b data-tone="{{vm.jobState(vm.selected).tone}}">{{vm.jobState(vm.selected).label}}</b></header>
            <dl><div><dt>İşlenen</dt><dd>{{vm.selected.processedItems}} / {{vm.selected.totalItems}}</dd></div><div><dt>Başarılı</dt><dd>{{vm.selected.succeededItems}}</dd></div><div><dt>Başarısız</dt><dd>{{vm.selected.failedItems}}</dd></div><div><dt>Dosya süresi</dt><dd>{{vm.selected.artifactsExpireAt ? (vm.selected.artifactsExpireAt | date:'dd MMM yyyy HH:mm') : 'İş tamamlanınca başlar'}}</dd></div></dl>
            <p class="mobile-job-error-detail" ng-if="vm.selected.lastErrorMessage">{{vm.selected.lastErrorCode}} · {{vm.selected.lastErrorMessage}}</p>
            <p class="mobile-job-expired" ng-if="vm.artifactsExpired(vm.selected)">Bu işin sonuç dosyalarının saklama süresi doldu.</p>
            <div class="mobile-job-actions">
              <button class="button button-small button-stable" type="button" ng-if="vm.selected.hasResult && !vm.artifactsExpired(vm.selected)" ng-click="vm.download(vm.selected,false)" ng-disabled="vm.pwa.offline"><i class="ion-ios-download-outline" aria-hidden="true"></i> Sonuç</button>
              <button class="button button-small button-stable" type="button" ng-if="vm.selected.hasErrorFile && !vm.artifactsExpired(vm.selected)" ng-click="vm.download(vm.selected,true)" ng-disabled="vm.pwa.offline"><i class="ion-alert-circled" aria-hidden="true"></i> Hatalar</button>
              <button class="button button-small button-stable" type="button" ng-if="vm.canEdit() && vm.canRetry(vm.selected)" ng-click="vm.retry(vm.selected)" ng-disabled="vm.busy"><i class="ion-loop" aria-hidden="true"></i> Başarısızları yinele</button>
              <button class="button button-small button-assertive button-outline" type="button" ng-if="vm.canEdit() && vm.canCancel(vm.selected) && vm.cancelCandidateId!==vm.selected.id" ng-click="vm.requestCancel(vm.selected)" ng-disabled="vm.busy"><i class="ion-stop" aria-hidden="true"></i> İptal et</button>
            </div>
            <div class="mobile-job-confirm" ng-if="vm.cancelCandidateId===vm.selected.id">
              <span>Çalışan işi iptal etmek istiyor musunuz?</span>
              <button type="button" ng-click="vm.cancel(vm.selected)">İptal et</button>
              <button type="button" ng-click="vm.dismissCancel()">Vazgeç</button>
            </div>
          </section>
        </div>
      </ion-content>
    </ion-view>
  </script>

  <script id="templates/project-planning.html" type="text/ng-template">
    <ion-view view-title="{{vm.project.name || 'Proje planı'}}">
      <ion-content class="workspace mobile-plan-surface" data-loading="{{vm.loading}}">
        <header class="mobile-plan-head"><div><h2>{{vm.project.name || 'Proje planı'}}</h2><p>{{vm.timeZone}}</p></div><span><strong>{{vm.model.totals.tasks}} iş</strong><small>%{{vm.model.totals.progress}} tamamlandı</small></span></header>
        <nav class="mobile-plan-modes" aria-label="Plan görünümü"><button ng-class="{active: vm.mode === 'calendar'}" ng-click="vm.setMode('calendar')">Takvim</button><button ng-class="{active: vm.mode === 'timeline'}" ng-click="vm.setMode('timeline')">Zaman</button><button ng-class="{active: vm.mode === 'roadmap'}" ng-click="vm.setMode('roadmap')">Yol haritası</button></nav>
        <div class="mobile-plan-filters"><input type="search" ng-model="vm.filters.query" ng-change="vm.applyFilters()" placeholder="Plan içinde ara" aria-label="Plan içinde ara"><select ng-model="vm.filters.type" ng-change="vm.applyFilters()" ng-options="type for type in vm.typeOptions()" aria-label="İş türü"><option value="">Tüm türler</option></select></div>
        <div class="mobile-plan-window"><button ng-click="vm.shift(-1)" aria-label="Önceki tarih aralığı"><i class="ion-chevron-left" aria-hidden="true"></i></button><span><strong>{{vm.windowLabel()}}</strong><button class="button button-small button-clear" ng-click="vm.today()">Bugün</button></span><button ng-click="vm.shift(1)" aria-label="Sonraki tarih aralığı"><i class="ion-chevron-right" aria-hidden="true"></i></button></div>
        <div class="mobile-plan-zoom" ng-if="vm.mode !== 'calendar'" role="group" aria-label="Zaman ölçeği"><button ng-class="{active: vm.zoom === 'week'}" ng-click="vm.setZoom('week')">Hafta</button><button ng-class="{active: vm.zoom === 'month'}" ng-click="vm.setZoom('month')">Ay</button><button ng-class="{active: vm.zoom === 'quarter'}" ng-click="vm.setZoom('quarter')">Çeyrek</button></div>
        <p class="mobile-plan-scope" data-complete="{{vm.scopeComplete}}" role="status"><strong>{{vm.scopeComplete ? 'Tüm proje kapsamı' : 'Kısmi proje kapsamı'}}</strong> · {{vm.tasks.length}} iş, {{vm.sprints.length}} sprint</p>
        <p class="mobile-plan-feedback error" ng-if="vm.error" role="alert">{{vm.error}}</p><p class="mobile-plan-feedback success" ng-if="vm.notice" role="status">{{vm.notice}}</p>

        <section ng-if="vm.mode === 'calendar'" aria-labelledby="mobile-calendar-heading"><header class="mobile-plan-section-head"><h3 id="mobile-calendar-heading">Plan ajandası</h3><span>{{vm.calendarEvents().length}} tarihli kayıt</span></header><div class="mobile-plan-list"><article class="mobile-plan-row" ng-repeat="event in vm.calendarEvents() track by event.id"><time datetime="{{event.key}}">{{vm.dateLabel(event.key)}}</time><button ng-click="vm.openTask(event.task)" ng-disabled="!event.task"><strong>{{event.title}}</strong><small>{{event.kind}}<span ng-if="event.task"> · {{event.task.status}}</span></small></button><input ng-if="event.task && vm.canEdit()" type="date" ng-model="event.inputDate" ng-change="vm.reschedule(event.task, event.inputDate)" ng-disabled="vm.mutationTaskId" aria-label="{{event.title}} bitiş tarihi"></article><p class="mobile-plan-empty" ng-if="!vm.calendarEvents().length">Bu aralıkta tarihli kayıt yok.</p></div></section>

        <section ng-if="vm.mode === 'timeline'" aria-labelledby="mobile-timeline-heading"><header class="mobile-plan-section-head"><h3 id="mobile-timeline-heading">İş zaman çizelgesi</h3><span>{{vm.model.dependencies.length}} bağımlılık · {{vm.model.dependencyRisks.length}} risk</span></header><div class="mobile-plan-list"><article class="mobile-plan-row mobile-plan-summary-row" ng-repeat="row in vm.model.timelineRows track by row.id" data-risk="{{row.dependencyRisk}}"><button ng-click="vm.openTask(row.task)"><strong>{{row.title}}</strong><small>{{row.source}}</small></button><span><strong>{{vm.dateLabel(row.startKey)}}</strong><small>{{vm.dateLabel(row.endKey)}} · {{row.blockedBy.length}} engel</small></span></article><p class="mobile-plan-empty" ng-if="!vm.model.timelineRows.length">Planlanmış iş yok.</p></div></section>

        <section ng-if="vm.mode === 'roadmap'" aria-labelledby="mobile-roadmap-heading"><header class="mobile-plan-section-head"><h3 id="mobile-roadmap-heading">Teslimat yol haritası</h3><span>{{vm.model.totals.overdue}} geciken iş</span></header><div class="mobile-plan-list"><article class="mobile-plan-row mobile-plan-summary-row" ng-repeat="row in vm.model.roadmapRows track by row.id"><span><strong>{{row.title}}</strong><small>{{row.kind}} · {{row.status}} · {{vm.dateLabel(row.startKey)}}</small></span><span class="mobile-plan-progress"><strong>%{{row.progress}}</strong><progress max="100" value="{{row.progress}}">%{{row.progress}}</progress><small>{{row.progressSource}}</small></span></article><p class="mobile-plan-empty" ng-if="!vm.model.roadmapRows.length">Yol haritası teslimatı yok.</p></div></section>

        <section class="mobile-plan-unscheduled"><button ng-click="vm.unscheduledOpen = !vm.unscheduledOpen" aria-expanded="{{vm.unscheduledOpen}}"><i class="{{vm.unscheduledOpen ? 'ion-chevron-down' : 'ion-chevron-right'}}" aria-hidden="true"></i> Tarihsiz işler ({{vm.model.unscheduledTasks.length}})</button><div ng-if="vm.unscheduledOpen"><article class="mobile-plan-row" ng-repeat="task in vm.model.unscheduledTasks track by task.id"><button ng-click="vm.openTask(task)"><strong>{{task.title}}</strong><small>{{task.status}} · {{task.priority}}</small></button><input type="date" ng-model="task.mobilePlanningDue" ng-change="vm.reschedule(task, task.mobilePlanningDue)" ng-disabled="!vm.canEdit() || vm.mutationTaskId" aria-label="{{task.title}} bitiş tarihi ata"></article><p class="mobile-plan-empty" ng-if="!vm.model.unscheduledTasks.length">Tüm filtrelenmiş işlerin bitiş tarihi var.</p></div></section>
      </ion-content>
    </ion-view>
  </script>

  <script id="templates/project-reporting.html" type="text/ng-template">
    <ion-view view-title="{{vm.project.name || 'Proje içgörüleri'}}">
      <ion-content class="workspace mobile-report-surface" data-loading="{{vm.loading}}">
        <header class="mobile-report-head"><div><h2>{{vm.project.name || 'Proje içgörüleri'}}</h2><p>İş yükü ve teslimat sinyalleri</p></div><select class="mobile-report-range" ng-model="vm.rangeDays" ng-change="vm.setRange(vm.rangeDays)" aria-label="Rapor dönemi"><option ng-value="30">30 gün</option><option ng-value="90">90 gün</option><option ng-value="180">180 gün</option></select></header>
        <nav class="segmented" role="tablist" aria-label="Mobil içgörü görünümü"><button role="tab" aria-selected="{{vm.mode==='workload'}}" ng-class="{active:vm.mode==='workload'}" ng-click="vm.setMode('workload')">İş yükü</button><button role="tab" aria-selected="{{vm.mode==='reports'}}" ng-class="{active:vm.mode==='reports'}" ng-click="vm.setMode('reports')">Raporlar</button></nav>
        <p class="mobile-report-fresh" data-stale="{{vm.freshness.stale}}" role="status"><span ng-if="vm.freshness.generatedAt">Veri {{vm.freshness.generatedAt | date:'dd MMM HH:mm'}} · en fazla {{vm.freshness.maxAgeSeconds | number:0}} sn yaşında</span><span ng-if="!vm.freshness.generatedAt">Freshness bilgisi bekleniyor.</span></p>
        <div class="mobile-feedback error" role="alert" ng-if="vm.error">{{vm.error}}</div>
        <div class="mobile-report-metrics"><div><span>Açık iş</span><strong>{{vm.workloadModel.totals.openItems}}</strong></div><div><span>Geciken</span><strong>{{vm.workloadModel.totals.overdueItems}}</strong></div><div><span>Loglanan</span><strong>{{vm.workloadModel.totals.loggedHours | number:1}} sa</strong></div><div><span>Tahminsiz</span><strong>{{vm.workloadModel.totals.unestimatedItems === null ? '—' : vm.workloadModel.totals.unestimatedItems}}</strong></div></div>
        <section ng-if="vm.mode==='workload'" aria-labelledby="mobile-workload-heading"><h3 id="mobile-workload-heading" class="section-title">Proje iş yükü</h3><p class="mobile-capacity-note"><strong>Kapasite eşiği yapılandırılmadı.</strong> Açık iş sayısı kişileri sıralamak için kullanılmaz; tahminsiz iş sıfır efor değildir.</p><div ng-repeat="row in vm.workloadModel.rows track by row.id"><button class="mobile-workload-row" ng-click="vm.toggleWorkload(row)" aria-expanded="{{vm.expandedId===row.id}}"><span><strong>{{row.label}}</strong><b>{{row.openItems}} açık</b></span><small>{{row.overdueItems}} geciken · {{row.estimatedPoints}} puan · {{row.unestimatedItems}} tahminsiz</small><i class="mobile-workload-bar" aria-hidden="true"><i ng-style="{width:row.relativeWidth+'%'}"></i></i></button><div ng-if="vm.expandedId===row.id"><button class="mobile-report-row" ng-repeat="task in row.tasks | limitTo:vm.rowLimits[row.id] track by task.id" ng-click="vm.openTask(task)"><span><strong>{{task.title}}</strong><b>{{task.estimatePoints ? task.estimatePoints + ' p' : '—'}}</b></span><small>{{task.status}} · {{task.priority}}</small></button><button class="button button-small button-stable button-block" ng-if="vm.rowLimits[row.id] < row.tasks.length" ng-click="vm.showMoreWorkload(row)">Daha fazla iş göster</button></div></div><p class="mobile-report-empty" ng-if="!vm.workloadModel.rows.length">Atanmış açık iş yükü yok.</p></section>
        <section ng-if="vm.mode==='reports'" aria-labelledby="mobile-reports-heading"><h3 id="mobile-reports-heading" class="section-title">Teslimat raporları</h3><div class="mobile-report-section"><h3>Durum dağılımı</h3><div class="mobile-report-status" ng-repeat="row in vm.reportingModel.status track by row.status"><span>{{row.status}}</span><span class="report-bar-track"><i ng-style="{width:row.relativeWidth+'%'}"></i></span><strong>{{row.count}}</strong></div></div><div class="mobile-report-section"><h3>Akış ve tamamlama</h3><div class="mobile-report-metrics"><div><span>Tamamlanma</span><strong>%{{vm.reportingModel.completion.completionRatePercent}}</strong><small>{{vm.reportingModel.completion.completedItems}} / {{vm.reportingModel.completion.createdItems}} iş</small></div><div><span>Medyan lead</span><strong>{{vm.reportingModel.flow.medianLeadTimeHours / 24 | number:1}} gün</strong></div><div><span>Medyan cycle</span><strong>{{vm.reportingModel.flow.medianCycleTimeHours === null ? 'Veri yok' : ((vm.reportingModel.flow.medianCycleTimeHours / 24 | number:1) + ' gün')}}</strong></div><div><span>Örnek</span><strong>{{vm.reportingModel.flow.completedItems}}</strong></div></div></div><div class="mobile-report-section"><h3>Ekip teslimat özeti</h3><p class="mobile-capacity-note">Alfabetik görünüm; kişi performansı sıralaması değildir.</p><div class="mobile-report-row" ng-repeat="team in vm.reportingModel.teams track by team.teamId"><span><strong>{{team.teamName}}</strong><b>%{{team.completionRatePercent}}</b></span><small>{{team.completedItems}} / {{team.assignedItems}} tamamlanan · {{team.loggedHours | number:1}} sa</small></div></div><div class="mobile-report-section"><h3>Yakın riskler</h3><button class="mobile-report-row" ng-repeat="risk in vm.reportingModel.risks | limitTo:10 track by risk.id" ng-click="vm.openTask({id:risk.id})"><span><strong>{{risk.title}}</strong><time>{{risk.dueDate | date:'dd MMM'}}</time></span><small>{{risk.status}}</small></button><p class="mobile-report-empty" ng-if="!vm.reportingModel.risks.length">Yakın teslimat riski yok.</p></div></section>
      </ion-content>
    </ion-view>
  </script>

  <script id="templates/team-detail.html" type="text/ng-template">
    <ion-view view-title="{{vm.team.name || 'Ekip'}}">
      <ion-content class="workspace" data-team-saving="{{vm.saving ? 'true' : 'false'}}">
        <div class="mobile-feedback success" role="status" aria-live="polite" ng-if="vm.notice">{{vm.notice}}</div>
        <div class="mobile-feedback error" role="alert" aria-live="assertive" ng-if="vm.error">{{vm.error}}</div>
        <form class="mobile-manage-form" ng-if="vm.team && vm.canManage" ng-submit="vm.save()"><label><span>Ekip adı</span><input type="text" ng-model="vm.teamDraft.name" aria-label="Mobil ekip adı" required></label><div class="mobile-form-actions"><button class="button button-small button-positive" type="submit" ng-disabled="vm.saving">Ekibi kaydet</button><button class="button button-small button-assertive button-outline" type="button" ng-if="vm.canArchive" ng-click="vm.archive()" ng-disabled="vm.saving">Arşivle</button></div></form>
        <div class="mobile-permission" ng-if="vm.team && !vm.canManage"><i class="ion-locked"></i> Bu ekipte yönetim yetkiniz yok.</div>
        <div class="item item-divider">Üyeler ve davetler</div>
        <div class="mobile-member-row" ng-repeat="member in vm.team.members track by member.id"><span><strong>{{member.email}}</strong><small>{{member.role}} · {{member.status}}</small></span><button class="button button-small button-assertive button-clear ion-trash-a" ng-if="vm.canManage && member.role !== 'Owner'" ng-click="vm.removeMember(member)" aria-label="Mobil ekip üyesini kaldır"></button></div>
        <form class="mobile-manage-form compact" ng-if="vm.canManage" ng-submit="vm.invite()"><label><span>E-posta</span><input type="email" ng-model="vm.inviteDraft.email" aria-label="Mobil ekip davet e-postası" required></label><label><span>Rol</span><select ng-model="vm.inviteDraft.role" aria-label="Mobil ekip davet rolü"><option>Member</option><option>Admin</option></select></label><button class="button button-small button-positive" type="submit" ng-disabled="vm.saving">Davet et</button></form>
        <div class="item item-divider">Ekip etkinliği</div>
        <div class="mobile-timeline"><p ng-repeat="entry in vm.audit | limitTo:8"><strong>{{entry.action}}</strong><span>{{entry.createdAt | date:'dd.MM HH:mm'}}</span></p><p ng-if="!vm.audit.length">Henüz etkinlik yok.</p></div>
      </ion-content>
    </ion-view>
  </script>

  <script id="templates/task-detail.html" type="text/ng-template">
    <ion-view view-title="{{vm.task.title || 'Görev detayı'}}">
