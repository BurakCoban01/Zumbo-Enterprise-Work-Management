<ion-header><ion-toolbar><ion-title>Gelen kutusu</ion-title></ion-toolbar></ion-header><ion-content [fullscreen]="true"><ion-refresher slot="fixed" (ionRefresh)="refresh($event)"><ion-refresher-content pullingText="Yenile" /></ion-refresher><main><header><p>Eylem merkezi</p><h1>Gelen kutusu</h1><span>Okunmamış ve eylem bekleyen bildirimleri önceleyin.</span></header><nav role="tablist" aria-label="Bildirim görünümü">@for(item of ['unread','actions','all'];track item){<button type="button" role="tab" [class.active]="mode()===item" [attr.aria-selected]="mode()===item" (click)="setMode($any(item))">{{item==='unread'?'Okunmamış':item==='actions'?'Eylemler':'Tümü'}}</button>}</nav>@if(store.error()){<p class="state error" role="alert">{{store.error()}}</p>}<section class="inbox-list">@for(item of visible();track item.id){<button type="button" class="inbox-row" [class.unread]="!item.read" (click)="read(item.id)" [disabled]="item.read"><i></i><span><strong>{{label(item)}}</strong><small>{{item.message}}</small></span><time>{{date(item.createdAt)}}</time></button>}@empty{<p class="empty">Bu görünümde bildirim yok.</p>}</section></main></ion-content>
