<nav class="project-tabs" aria-label="Proje görünümü">
  <div class="primary-views">
    @for (view of primary(); track view.id) {
      <a [routerLink]="['/workspace', projectId(), view.id]" [class.active]="activeView() === view.id" [attr.aria-current]="activeView() === view.id ? 'page' : null">
        <zumbo-icon [name]="view.icon" [size]="16" /><span>{{ view.label }}</span>
      </a>
    }
  </div>
  @if (secondary().length) {
    <div class="secondary-groups" aria-label="Diğer proje çalışma alanları">
      @for (group of secondaryGroups; track group) {
        <details [class.active]="isGroupActive(group)" [open]="openGroup() === group" (toggle)="toggleGroup($event, group)">
          <summary><span>{{ groupLabels.get(group) }}</span><zumbo-icon name="chevron-down" [size]="15" /></summary>
          <div class="view-menu">
            @for (view of viewsInGroup(group); track view.id) {
              <a [routerLink]="['/workspace', projectId(), view.id]" [class.active]="activeView() === view.id" [attr.aria-current]="activeView() === view.id ? 'page' : null" (click)="openGroup.set(null)">{{ view.label }}</a>
            }
          </div>
        </details>
      }
    </div>
  }
</nav>
