<main class="modern-page login-layout" id="main-content">
  <section class="login-panel" aria-labelledby="login-title">
    <div class="modern-brand"><img src="shared/zumbo-mark.svg" alt=""><span>Zumbo</span></div>
    <header>
      <h1 id="login-title">Çalışma alanına giriş</h1>
      <p>Görevlerinize ve ekip projelerinize devam edin.</p>
    </header>
    <form [formGroup]="form" (ngSubmit)="submit()">
      <div class="field">
        <label class="label" for="modern-desktop-identity">Kullanıcı</label>
        <div class="control"><input class="input" id="modern-desktop-identity" formControlName="usernameOrEmail" autocomplete="username" required></div>
      </div>
      <div class="field">
        <label class="label" for="modern-desktop-password">Parola</label>
        <div class="control"><input class="input" id="modern-desktop-password" type="password" formControlName="password" autocomplete="current-password" required></div>
      </div>
      @if (mfaRequired()) {
        <div class="field">
          <label class="label" for="modern-desktop-mfa">Doğrulama kodu</label>
          <div class="control"><input class="input" id="modern-desktop-mfa" formControlName="mfaCode" inputmode="numeric" autocomplete="one-time-code" maxlength="16" required></div>
        </div>
      }
      @if (error()) { <p class="login-error" role="alert">{{ error() }}</p> }
      <button class="button is-primary is-fullwidth" type="submit" [disabled]="busy() || form.invalid">{{ busy() ? 'Giriş yapılıyor' : 'Giriş yap' }}</button>
    </form>
  </section>
</main>
