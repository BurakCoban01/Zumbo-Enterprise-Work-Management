services:
  api:
    environment:
      Notifications__Email__Enabled: "true"
      Notifications__Email__Host: mailpit
      Notifications__Email__Port: 1025
      Notifications__Email__UseSsl: "false"
      Notifications__Email__FromAddress: noreply@zumbo.local
      Notifications__Email__FromName: Zumbo Baseline
    depends_on:
      mailpit:
        condition: service_healthy

  worker:
    environment:
      Notifications__Email__Enabled: "true"
      Notifications__Email__Host: mailpit
      Notifications__Email__Port: 1025
      Notifications__Email__UseSsl: "false"
      Notifications__Email__FromAddress: noreply@zumbo.local
      Notifications__Email__FromName: Zumbo Baseline
    depends_on:
      mailpit:
        condition: service_healthy

  mailpit:
    image: axllent/mailpit:v1.24@sha256:3ad9483ac2dea937ae402b95435ab12c3355d2373a1002a49491db0be536d8fa
    ports:
      - "${ZUMBO_MAILPIT_BIND_HOST:-127.0.0.1}:${ZUMBO_MAILPIT_HTTP_HOST_PORT:-58825}:8025"
    healthcheck:
      test: ["CMD", "/mailpit", "readyz"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped
