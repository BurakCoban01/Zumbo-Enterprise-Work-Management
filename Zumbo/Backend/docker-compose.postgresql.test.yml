services:
  postgresql-data004:
    image: postgres:16-alpine@sha256:57c72fd2a128e416c7fcc499958864df5301e940bca0a56f58fddf30ffc07777
    profiles: ["postgresql-test"]
    network_mode: bridge
    environment:
      POSTGRES_DB: ${ZUMBO_POSTGRES_TEST_DATABASE:-zumbo_data004}
      POSTGRES_USER: ${ZUMBO_POSTGRES_TEST_USER:-zumbo_test}
      POSTGRES_PASSWORD: ${ZUMBO_POSTGRES_TEST_PASSWORD:-zumbo_test_password}
    ports:
      - target: 5432
        published: "${ZUMBO_POSTGRES_TEST_PORT:-0}"
        host_ip: 127.0.0.1
        protocol: tcp
        mode: host
    tmpfs:
      - /var/lib/postgresql/data:rw,noexec,nosuid,size=512m
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 2s
      timeout: 3s
      retries: 30
      start_period: 5s
    restart: "no"
