services:
  api:
    environment:
      Observability__OtlpEnabled: "true"
      Observability__OtlpEndpoint: http://otel-collector:4317
    depends_on:
      otel-collector:
        condition: service_started

  worker:
    environment:
      Observability__OtlpEnabled: "true"
      Observability__OtlpEndpoint: http://otel-collector:4317
    depends_on:
      otel-collector:
        condition: service_started

  otel-volume-init:
    image: busybox:1.37.0@sha256:9532d8c39891ca2ecde4d30d7710e01fb739c87a8b9299685c63704296b16028
    profiles: ["observability"]
    user: "0:0"
    command: ["sh", "-c", "chown -R 10001:10001 /var/lib/otel"]
    volumes:
      - otel_evidence:/var/lib/otel
    restart: "no"

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.130.1@sha256:9c247564e65ca19f97d891cca19a1a8d291ce631b890885b44e3503c5fdb3895
    profiles: ["observability"]
    user: "10001:10001"
    command: ["--config=/etc/otelcol-contrib/config.yaml"]
    volumes:
      - ./observability/otel-collector.yaml:/etc/otelcol-contrib/config.yaml:ro
      - otel_evidence:/var/lib/otel
    mem_limit: 256m
    cpus: 0.50
    depends_on:
      otel-volume-init:
        condition: service_completed_successfully
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:v3.5.0@sha256:63805ebb8d2b3920190daf1cb14a60871b16fd38bed42b857a3182bc621f4996
    profiles: ["observability"]
    command: ["--config.file=/etc/prometheus/prometheus.yml", "--storage.tsdb.retention.time=24h"]
    volumes:
      - ./observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./observability/alerts.yml:/etc/prometheus/alerts.yml:ro
    ports:
      - "${ZUMBO_OBSERVABILITY_BIND_HOST:-127.0.0.1}:${ZUMBO_PROMETHEUS_PORT:-59090}:9090"
    mem_limit: 256m
    cpus: 0.50
    depends_on: [otel-collector]
    restart: unless-stopped

  grafana:
    image: grafana/grafana:12.1.0@sha256:6ac590e7cabc2fbe8d7b8fc1ce9c9f0582177b334e0df9c927ebd9670469440f
    profiles: ["observability"]
    environment:
      GF_SECURITY_ADMIN_USER: ${ZUMBO_GRAFANA_ADMIN_USER:-zumbo-local}
      GF_SECURITY_ADMIN_PASSWORD: ${ZUMBO_GRAFANA_ADMIN_PASSWORD:?ZUMBO_GRAFANA_ADMIN_PASSWORD must be set}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_PLUGINS_PREINSTALL_DISABLED: "true"
    volumes:
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports:
      - "${ZUMBO_OBSERVABILITY_BIND_HOST:-127.0.0.1}:${ZUMBO_GRAFANA_PORT:-53000}:3000"
    mem_limit: 256m
    cpus: 0.50
    depends_on: [prometheus]
    restart: unless-stopped

volumes:
  otel_evidence:
