name: Zumbo CI

on:
  push:
    branches: ["main", "master"]
  pull_request:
    branches: ["main", "master"]

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Restore
        run: dotnet restore Backend/Zumbo.sln

      - name: Build
        run: dotnet build Backend/Zumbo.sln --configuration Release --no-restore

      - name: Test
        run: dotnet test Backend/Zumbo.sln --configuration Release --no-build

      - name: Docker build
        run: docker build -f Backend/src/Zumbo.Api/Dockerfile Backend
