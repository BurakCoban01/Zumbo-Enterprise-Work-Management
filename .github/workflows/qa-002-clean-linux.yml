name: QA-002 Clean Linux Lifecycle

on:
  workflow_dispatch:
    inputs:
      target_sha:
        description: Exact 40-character commit SHA to validate
        required: true
        type: string
      confirmation:
        description: Type RUN-QA-002 to confirm the disposable lifecycle run
        required: true
        type: string

permissions:
  contents: read

defaults:
  run:
    working-directory: Zumbo

concurrency:
  group: qa-002-clean-linux
  cancel-in-progress: false

jobs:
  clean-linux-lifecycle:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      QA002_RUNNER_IMAGE: ubuntu-24.04
    steps:
      - name: Validate inputs and initialize runtime paths
        shell: bash
        working-directory: ${{ github.workspace }}
        env:
          QA002_TARGET_SHA_INPUT: ${{ inputs.target_sha }}
          QA002_CONFIRMATION_INPUT: ${{ inputs.confirmation }}
        run: |
          set -euo pipefail
          [[ "$QA002_TARGET_SHA_INPUT" =~ ^[0-9a-fA-F]{40}$ ]] || {
            echo 'target_sha must be exactly 40 hexadecimal characters.' >&2
            exit 2
          }
          test "$QA002_CONFIRMATION_INPUT" = 'RUN-QA-002' || {
            echo 'confirmation must be exactly RUN-QA-002.' >&2
            exit 2
          }

          umask 077
          qa002_root="$RUNNER_TEMP/qa002-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          mkdir -p "$qa002_root/raw" "$qa002_root/artifact"

          {
            printf 'QA002_TARGET_SHA=%s\n' "$QA002_TARGET_SHA_INPUT"
            printf 'QA002_ROOT=%s\n' "$qa002_root"
            printf 'QA002_ENV_FILE=%s\n' "$qa002_root/runtime.env"
            printf 'QA002_RAW_DIR=%s\n' "$qa002_root/raw"
            printf 'QA002_EVIDENCE_DIR=%s\n' "$qa002_root/artifact"
            printf 'QA002_PROJECT=zumbo-qa002-%s-%s\n' \
              "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT"
          } >> "$GITHUB_ENV"

      - name: Checkout exact target
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.target_sha }}
          fetch-depth: 1
          persist-credentials: false
          clean: true
          show-progress: false

      - name: Setup Node 20
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22.22.3"

      - name: Setup .NET 8
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: "8.0.x"

      - name: Prepare synthetic runtime inputs
        shell: bash
        run: |
          set -euo pipefail
          corepack enable
          corepack prepare pnpm@9.0.0 --activate
          node scripts/operations/prepare-env.mjs --output "$QA002_ENV_FILE"
          node scripts/operations/qa002-mask-environment.mjs --environment "$QA002_ENV_FILE"

      - name: Clean Linux preflight
        shell: bash
        run: >-
          node scripts/operations/qa002-linux-preflight.mjs
          --target-sha "$QA002_TARGET_SHA"
          --environment "$QA002_ENV_FILE"
          --output "$QA002_RAW_DIR/preflight.json"

      - name: Execute canonical lifecycle
        shell: bash
        run: >-
          node scripts/operations/qa002-linux-lifecycle.mjs
          --project "$QA002_PROJECT"
          --environment "$QA002_ENV_FILE"
          --output "$QA002_RAW_DIR/lifecycle.json"

      - name: Targeted always cleanup
        if: ${{ always() }}
        shell: bash
        run: >-
          node scripts/operations/qa002-cleanup.mjs
          --project "$QA002_PROJECT"
          --environment "$QA002_ENV_FILE"
          --output "$QA002_RAW_DIR/cleanup.json"

      - name: Build sanitized evidence
        if: ${{ always() }}
        shell: bash
        run: >-
          node scripts/operations/qa002-evidence.mjs
          --target-sha "$QA002_TARGET_SHA"
          --preflight "$QA002_RAW_DIR/preflight.json"
          --lifecycle "$QA002_RAW_DIR/lifecycle.json"
          --cleanup "$QA002_RAW_DIR/cleanup.json"
          --output-dir "$QA002_EVIDENCE_DIR"

      - name: Validate sanitized evidence schema
        if: ${{ always() }}
        shell: bash
        run: >-
          node scripts/operations/qa002-evidence.mjs
          --validate "$QA002_EVIDENCE_DIR/qa-002-remote-evidence.json"
          --expected-sha "$QA002_TARGET_SHA"

      - name: Upload sanitized QA-002 evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: qa-002-clean-linux-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ env.QA002_EVIDENCE_DIR }}
          if-no-files-found: error
          include-hidden-files: false
          retention-days: 1

      - name: Remove synthetic runtime files
        if: ${{ always() }}
        shell: bash
        run: rm -f "$QA002_ENV_FILE"
